security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Module\Account\Entity\User

    firewalls:
        # Every request to the content domain of stored artifacts. No security
        # listener, so no session is read and no cookie is set.
        artifact_content_host:
            request_matcher: App\Module\Artifact\Security\ArtifactContentHostRequestMatcher
            security: false
        # Every request to a site host that differs from the app host. Same
        # shape as the content domain: no session is read, no cookie is set.
        site_host:
            request_matcher: App\Module\Landing\Security\SiteHostRequestMatcher
            security: false
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # No security listener at all, so /livez cannot resolve a user and
        # therefore cannot reach the database — see ShowLivenessController.
        livez:
            pattern: ^/livez$
            security: false
        # The CLI install script is public. With no security listener, a signed-in
        # browser's session is never read, so the answer stays publicly cacheable.
        install_script:
            pattern: ^/install\.sh$
            security: false
        # The docs script is the same for every visitor, so no session may be
        # read and no cookie set: a shared cache keeps one copy.
        site_docs_script:
            pattern: ^/site/docs\.js$
            security: false
        # The signed content links of a stored prototype. No security listener,
        # so no session is read or started and the response sets no cookie. The
        # signature in the path is the credential.
        artifact_content:
            pattern: ^/artifact-content/
            security: false
        # The suspension gate on these two firewalls is the user_checker, not
        # RequireNotSuspendedListener: that listener exempts ^/api and ^/mcp
        # because an HTML redirect would corrupt a machine client's response.
        mcp:
            pattern: ^/mcp
            stateless: true
            user_checker: App\Module\Account\Security\AccountStatusChecker
            custom_authenticators:
                - App\Module\OAuth\Security\OAuthAccessTokenAuthenticator
            access_denied_handler: App\Module\OAuth\Security\McpAccessDeniedHandler
        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Module\Account\Security\AccountStatusChecker
            custom_authenticators:
                - App\Module\OAuth\Security\OAuthAccessTokenAuthenticator
                - App\Module\OAuth\Security\ApiKeyAuthenticator
            access_denied_handler: App\Module\Account\Security\ApiAccessDeniedHandler
        # The OAuth token and device authorization endpoints and the discovery
        # documents serve machine clients. No session, remember-me or HTML
        # redirect listener may touch them.
        oauth_public:
            pattern: ^/(oauth/token$|oauth/device-authorization$|\.well-known/)
            stateless: true
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: app_home
                enable_csrf: true
            custom_authenticators:
                - App\Module\Account\Security\SocialAuthenticator
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
            remember_me:
                secret: '%env(APP_SECRET)%'
                lifetime: 2592000
                path: /
                always_remember_me: false

    access_control:
        # The widget routes under their private prefix. The widget token creates and
        # lists board cards and saves feedback through these routes, so a widget token
        # may write to the board. See the Loupe design 'Picking and creating cards
        # from the site-review widget' for the exposure this accepts.
        - { path: ^/api/v1/live-review-widget/, roles: ROLE_API_SITE_REVIEW }
        # The loupe CLI's own surface, which must refuse the project-bound widget
        # token the rule above accepts. One rule per route, so a later route
        # inherits no grant. A handle is one path segment, a project id or slug.
        - { path: '^/api/v1/bridge/projects$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/columns$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/cards/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/events$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/events/replay$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/card-holds$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/interactive-sessions/[^/]+/close$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/interactive-sessions/[^/]+/card-run$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/worker-runs/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/worker-runs/sessions/[^/]+/usage$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/worker-runs/[^/]+/tool-calls$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/worker-runs/sessions/[^/]+/wake$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/worker-runs/[^/]+/output$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/interactive-runs/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/experiments/[^/]+/pins/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/inbox/asks/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/artifacts$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/preview-tokens$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/preview-tokens/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/projects/[^/]+/git-token$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/bridges/[^/]+/heartbeat$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/bridges/[^/]+/commands/[^/]+$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/bridges/[^/]+/runs$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/bridges/[^/]+/work-requests/[^/]+/claim$', roles: ROLE_API_AGENT }
        - { path: '^/api/v1/bridge/bridges/[^/]+/work-requests/[^/]+/result$', roles: ROLE_API_AGENT }
        # The version list and the public spec need no sign-in. Both spend from the
        # budget of the client address, as ApplyApiBudgetOnRequest says.
        - { path: '^/api/versions$', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/openapi\.json$', roles: PUBLIC_ACCESS }
        # The public API. A route of it names the public scope, which an API key and a
        # CLI sign-in carry. One rule per route shape, so a later route inherits no grant.
        - { path: '^/api/v1/projects(/[^/]+)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/board/columns(/[^/]+)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/feedback(/[^/]+)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/artifacts(/[^/]+)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/artifacts/[^/]+/(versions|files/.+)$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/cards(/[1-9][0-9]{0,8}(/(events|hold|pause))?|/reorder)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/github/repositories/status$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/inbox/items(/[^/]+)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/documents(/[^/]+(/(publish|review|versions(/[^/]+)?|comments/[^/]+(/replies)?|decisions/[^/]+|verdicts(/[^/]+)?))?)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/discovery$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/experiments/[^/]+/cards(/[1-9][0-9]{0,8}/exclusion)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/graphs(/[^/]+(/restore)?)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/bucket-rules(/[^/]+)?$', roles: ROLE_API_PUBLIC }
        - { path: '^/api/v1/projects/[^/]+/analytics/settings$', roles: ROLE_API_PUBLIC }
        # Deny-by-default for the rest of /api: every API-token user also carries
        # ROLE_USER, so without this a new /api/<endpoint> falls through to the ^/
        # catch-all and authorizes ANY scoped token. Add new scope rules ABOVE this
        # line. An always-false expression rather than a sentinel role, so no
        # future role-hierarchy entry can accidentally satisfy it.
        - { path: ^/api,             allow_if: 'false' }
        - { path: ^/mcp,             roles: ROLE_API_MCP }
        # Stripe authenticates with a request signature, not a session or a
        # bearer token, so the webhook endpoint must be reachable anonymously.
        # The controller rejects anything it cannot verify.
        - { path: ^/webhooks/stripe$, roles: PUBLIC_ACCESS }
        # A forge authenticates with a request signature or a shared token, not
        # a session, so its webhook endpoint must be reachable anonymously. The
        # adapter rejects anything it cannot verify.
        - { path: ^/webhooks/forge/, roles: PUBLIC_ACCESS }
        # The /dev/* controllers are #[When('dev')] only, so this path 404s in
        # prod and this rule is inert there. It exists so the e2e seeding endpoint
        # is reachable unauthenticated in the dev environment.
        - { path: ^/dev/register-and-verify$, roles: PUBLIC_ACCESS }
        - { path: ^/dev/preview-login$, roles: PUBLIC_ACCESS }
        - { path: ^/dev/live-review-harness$, roles: PUBLIC_ACCESS }
        - { path: ^/dev/landing-preview/, roles: PUBLIC_ACCESS }
        - { path: ^/dev/e2e/, roles: PUBLIC_ACCESS }
        - { path: ^/styleguide$, roles: PUBLIC_ACCESS }
        # The OAuth start and callback URLs must be reachable unauthenticated.
        # Each route is additionally gated by its provider's feature flag.
        # Liveness probe for load balancers, which cannot authenticate. It
        # returns a fixed ok/error body and nothing else, and is served by
        # ubermuda/health-check-bundle.
        - { path: ^/healthz$,        roles: PUBLIC_ACCESS }
        # Carries the AGPL source offer, which a network user must be able to
        # reach without an account.
        - { path: ^/about$,          roles: PUBLIC_ACCESS }
        # A coding agent fetches the setup steps with curl, before any sign-in.
        - { path: ^/setup\.md$,      roles: PUBLIC_ACCESS }
        # The policies have to be readable before signing up, since they are what
        # a visitor is agreeing to by signing up.
        - { path: ^/privacy$,        roles: PUBLIC_ACCESS }
        - { path: ^/terms$,          roles: PUBLIC_ACCESS }
        - { path: ^/ai-policy$,      roles: PUBLIC_ACCESS }
        # The comparison pages are public marketing pages. Both routes answer 404
        # on an instance with no site host.
        - { path: ^/compare(?:/|$), roles: PUBLIC_ACCESS }
        # The feature pages are public marketing pages and answer 404 with no site host.
        - { path: ^/features(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/faq$, roles: PUBLIC_ACCESS }
        # A shared graph or experiment. The code is 12 characters, and the page answers 404 for any code it does not show.
        - { path: '^/s/[a-z2-7]{12}$', roles: PUBLIC_ACCESS }
        # The preview image of that page. A chat app fetches it with no session.
        - { path: '^/s/[a-z2-7]{12}/preview\.png$', roles: PUBLIC_ACCESS }
        # Crawlers fetch these without a session. Both answer from the public page list.
        - { path: ^/robots\.txt$,    roles: PUBLIC_ACCESS }
        - { path: ^/sitemap\.xml$,   roles: PUBLIC_ACCESS }
        # Agents fetch this before any sign-in. It points them at /setup.md and the docs.
        - { path: ^/llms\.txt$,      roles: PUBLIC_ACCESS }
        # The marketing landing page. LandingController serves it to anonymous
        # visitors only where billing is on, and redirects to /login otherwise;
        # authenticated users get the same home redirect as before.
        - { path: ^/$,               roles: PUBLIC_ACCESS }
        # The OAuth authorization endpoint shows the consent page to a signed-in
        # user. It must stay above the social-login rule below.
        - { path: ^/oauth/authorize$, roles: ROLE_USER }
        - { path: ^/oauth/token$,     roles: PUBLIC_ACCESS }
        - { path: ^/oauth/device-authorization$, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/device$,    roles: ROLE_USER }
        - { path: ^/\.well-known/,    roles: PUBLIC_ACCESS }
        - { path: ^/oauth,           roles: PUBLIC_ACCESS }
        - { path: ^/login,           roles: PUBLIC_ACCESS }
        - { path: ^/register,        roles: PUBLIC_ACCESS }
        - { path: ^/waitlist,        roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/install,         roles: PUBLIC_ACCESS }
        # A beta invite link carries a signed-out visitor to sign-up.
        - { path: ^/beta/,           roles: PUBLIC_ACCESS }
        # The emailed deletion link must be reachable logged-out and by an
        # unverified logged-in user; it covers both GET (confirm) and POST
        # (execute), which share the same path. /goodbye is the public landing
        # page after a successful deletion, once the session is gone.
        - { path: ^/account/delete/confirm, roles: PUBLIC_ACCESS }
        - { path: ^/goodbye$,               roles: PUBLIC_ACCESS }
        - { path: ^/admin,           roles: ROLE_ADMIN }
        - { path: ^/,                roles: ROLE_USER }

# Login throttling is a per-IP rate limiter. The e2e suite drives the dev app and the
# WebTestCase suite both from a single IP, so the default cap accumulates across specs
# and fails later auth tests (which pass in isolation). Relax it well out of the way in
# dev and test — never in prod. (Partial firewall overrides deep-merge, so only
# max_attempts changes; form_login/logout/remember_me are preserved.)
when@dev:
    security:
        firewalls:
            main:
                login_throttling:
                    max_attempts: 1000
        # e2e runs in dev on parallel workers. At cost 13 each login burns ~0.5s of
        # CPU, and under load that pushes the login redirect past Playwright's 5s.
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

when@test:
    security:
        firewalls:
            main:
                login_throttling:
                    max_attempts: 1000
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
