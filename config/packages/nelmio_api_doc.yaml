# Generates the committed API specs under openapi/. The bundle loads in dev and test
# alone, so production reads the committed files. Production still installs this
# package and swagger-php, because Symfony instantiates controller attributes per request.
# `bin/console nelmio:apidoc:dump --area=<area> --format=json` rebuilds one, and a test
# compares the committed file with a fresh build.
when@dev: &generator
    services:
        App\Api\OpenApi\PartialChangeSchemaProcessor:
            tags: ['nelmio_api_doc.swagger.processor']
        App\Api\OpenApi\FieldsSchemaProcessor:
            tags: ['nelmio_api_doc.swagger.processor']

    nelmio_api_doc:
        # Whitelisted explicitly: the bundle documents every route of an area by default.
        use_validation_groups: false
        documentation:
            openapi: 3.0.3
            servers:
                - url: https://app.loupe.ac
                  description: Hosted instance
            security:
                - bearerAuth: []
            components:
                securitySchemes:
                    bearerAuth:
                        type: http
                        scheme: bearer
                        description: 'An API key or an OAuth access token, in `Authorization: Bearer <token>`.'
                headers:
                    Retry-After:
                        description: The number of seconds to wait before the next request.
                        schema: { type: integer }
                    RateLimit-Limit:
                        description: The number of requests the window allows.
                        schema: { type: integer }
                    RateLimit-Remaining:
                        description: The number of requests left in the window.
                        schema: { type: integer }
                    RateLimit-Reset:
                        description: The seconds until the window resets.
                        schema: { type: integer }
                    Link:
                        description: 'The next page, as `<url>; rel="next"`. It is absent on the last page.'
                        schema: { type: string }
                    Location:
                        description: The URL of the new resource.
                        schema: { type: string, format: uri }
                schemas:
                    Problem:
                        type: object
                        description: An error, as RFC 9457 `application/problem+json`.
                        required: [type, title, status, code, detail]
                        properties:
                            type:
                                type: string
                                format: uri
                                description: A URI that names the error.
                            title:
                                type: string
                                description: A short summary of the error.
                            status:
                                type: integer
                                description: The HTTP status.
                            code:
                                type: string
                                description: The stable machine-readable code.
                            detail:
                                type: string
                                description: What happened in this request.
                    ValidationProblem:
                        description: A refusal of one or more fields.
                        allOf:
                            - $ref: '#/components/schemas/Problem'
                            - type: object
                              required: [errors]
                              properties:
                                  errors:
                                      type: array
                                      items:
                                          type: object
                                          required: [field, code, message]
                                          properties:
                                              field:
                                                  type: string
                                                  description: The field, as a request names it.
                                              code:
                                                  type: string
                                                  description: The stable code of the refusal.
                                              message:
                                                  type: string
                                                  description: A sentence that says why.
                    NameTakenProblem:
                        description: A refusal because a name is taken.
                        allOf:
                            - $ref: '#/components/schemas/Problem'
                            - type: object
                              properties:
                                  slug:
                                      type: string
                                      description: The slug of the project that holds the name.
                    NativeFacts:
                      type: object
                      description: What a native note says about the app, the device, the screen and the element.
                      required:
                      - app
                      - device
                      - screen
                      - element
                      properties:
                        app:
                          type: object
                          required:
                          - name
                          - bundleId
                          properties:
                            name:
                              type: string
                              nullable: true
                            bundleId:
                              type: string
                        device:
                          type: object
                          required:
                          - name
                          - udid
                          - osVersion
                          properties:
                            name:
                              type: string
                            udid:
                              type: string
                            osVersion:
                              type: string
                        screen:
                          type: object
                          required:
                          - title
                          properties:
                            title:
                              type: string
                              nullable: true
                        element:
                          type: object
                          required:
                          - role
                          - label
                          - identifier
                          - frame
                          properties:
                            role:
                              type: string
                            label:
                              type: string
                              nullable: true
                            identifier:
                              type: string
                              nullable: true
                            frame:
                              type: object
                              required:
                              - x
                              - y
                              - width
                              - height
                              properties:
                                x:
                                  type: number
                                y:
                                  type: number
                                width:
                                  type: number
                                height:
                                  type: number
                              nullable: true
                          nullable: true
                    ApiVersions:
                        type: object
                        description: The API versions of this instance.
                        required: [versions, cliRange]
                        properties:
                            versions:
                                type: array
                                items:
                                    type: object
                                    required: [version, status]
                                    properties:
                                        version:
                                            type: string
                                            example: v1
                                        status:
                                            type: string
                                            enum: [beta, stable, deprecated]
                                            description: The state of this version.
                                            example: beta
                            cliRange:
                                type: string
                                description: The CLI versions this server works with, as a caret range.
                                example: ^2.0
        # The component name of each response or request class of the public API. Without an entry
        # the name is the class name, and a body shared by two operations may get two names.
        models:
            # List a model before each model that refers to it. A model reached first through a parent gets the name of its class.
            names:
                - { alias: Project, type: App\Module\Project\Controller\Api\ProjectResponse }
                - { alias: ProjectList, type: App\Module\Project\Controller\Api\ProjectListResponse }
                - { alias: ProjectCreate, type: App\Module\Project\Controller\Api\CreateProjectRequest }
                - { alias: ProjectUpdate, type: App\Module\Project\Controller\Api\UpdateProjectRequest }
                - { alias: BoardColumn, type: App\Module\Board\Controller\Api\BoardColumnResponse }
                - { alias: CardType, type: App\Module\Board\Controller\Api\CardTypeResponse }
                - { alias: BoardColumnList, type: App\Module\Board\Controller\Api\BoardColumnListResponse }
                - { alias: ColumnWriteResult, type: App\Module\Board\Controller\Api\ColumnWriteResponse }
                - { alias: ColumnOrderResult, type: App\Module\Board\Controller\Api\ColumnOrderResponse }
                - { alias: ColumnDeleteResult, type: App\Module\Board\Controller\Api\ColumnDeleteResponse }
                - { alias: ColumnCreate, type: App\Module\Board\Controller\Api\CreateBoardColumnRequest }
                - { alias: ColumnUpdate, type: App\Module\Board\Controller\Api\UpdateBoardColumnRequest }
                - { alias: ColumnOrder, type: App\Module\Board\Controller\Api\ReorderBoardColumnsRequest }
                - { alias: FeedbackItem, type: App\Module\Board\Controller\Api\FeedbackResponse }
                - { alias: FeedbackRow, type: App\Module\Board\Controller\Api\FeedbackRowResponse }
                - { alias: FeedbackList, type: App\Module\Board\Controller\Api\FeedbackListResponse }
                - { alias: FeedbackAnchor, type: App\Module\Board\Controller\Api\FeedbackAnchorResponse }
                - { alias: FeedbackUpdate, type: App\Module\Board\Controller\Api\FeedbackUpdateRequest }
                - { alias: ArtifactVersionRef, type: App\Module\Artifact\Controller\Api\ArtifactVersionRefResponse }
                - { alias: ArtifactFileRef, type: App\Module\Artifact\Controller\Api\ArtifactFileRefResponse }
                - { alias: ArtifactVersion, type: App\Module\Artifact\Controller\Api\ArtifactVersionResponse }
                - { alias: ArtifactFile, type: App\Module\Artifact\Controller\Api\ArtifactFileResponse }
                - { alias: Artifact, type: App\Module\Artifact\Controller\Api\ArtifactResponse }
                - { alias: ArtifactRow, type: App\Module\Artifact\Controller\Api\ArtifactRowResponse }
                - { alias: ArtifactList, type: App\Module\Artifact\Controller\Api\ArtifactListResponse }
                - { alias: ArtifactStored, type: App\Module\Artifact\Controller\Api\ArtifactStoredResponse, areas: [public] }
                - { alias: ArtifactCreateUpload, type: App\Module\Artifact\Controller\Api\ArtifactUploadRequest }
                - { alias: ArtifactVersionUpload, type: App\Module\Artifact\Controller\Api\ArtifactVersionUploadRequest }
                - { alias: ArtifactUpdate, type: App\Module\Artifact\Controller\Api\UpdateArtifactRequest }
                - { alias: PullRequestRef, type: App\Module\Board\Controller\Api\PullRequestRefResponse }
                - { alias: FeedbackRef, type: App\Module\Board\Controller\Api\FeedbackRefResponse }
                - { alias: Card, type: App\Module\Board\Controller\Api\CardResponse }
                - { alias: CardRow, type: App\Module\Board\Controller\Api\CardRowResponse }
                - { alias: CardList, type: App\Module\Board\Controller\Api\CardListResponse }
                - { alias: CardCreate, type: App\Module\Board\Controller\Api\CreateProjectCardRequest }
                - { alias: CardUpdate, type: App\Module\Board\Controller\Api\UpdateProjectCardRequest }
                - { alias: CardRelatedInput, type: App\Module\Board\Controller\Api\RelatedCardInput }
                - { alias: CardPlaced, type: App\Module\Board\Controller\Api\PlacedCardResponse }
                - { alias: CardReorder, type: App\Module\Board\Controller\Api\ReorderProjectCardsRequest }
                - { alias: CardReorderResult, type: App\Module\Board\Controller\Api\ReorderProjectCardsResponse }
                - { alias: CardEvent, type: App\Module\Board\Controller\Api\CardEventResponse }
                - { alias: CardEventList, type: App\Module\Board\Controller\Api\CardEventListResponse }
                - { alias: CardHoldResult, type: App\Module\Board\Controller\Api\CardHoldResponse }
                - { alias: CardReleaseResult, type: App\Module\Board\Controller\Api\CardReleaseResponse }
                - { alias: CardPauseReleaseResult, type: App\Module\Board\Controller\Api\CardPauseReleaseResponse }
                - { alias: DiscoveryStartResult, type: App\Module\Readiness\Controller\Api\DiscoveryStartResponse }
                - { alias: GitHubRepositoryStatus, type: App\Module\GitHub\Controller\Api\LookupGitHubRepositoryResponse }
                - { alias: ExperimentCardRow, type: App\Module\Bridge\Controller\Api\ExperimentCardRowResponse }
                - { alias: ExperimentCardList, type: App\Module\Bridge\Controller\Api\ExperimentCardListResponse }
                - { alias: ExperimentCardExclude, type: App\Module\Bridge\Controller\Api\ExcludeExperimentCardRequest }
                - { alias: MetricListEntry, type: App\Module\Bridge\Controller\Api\MetricListEntryResponse }
                - { alias: MetricList, type: App\Module\Bridge\Controller\Api\MetricListResponse }
                - { alias: MetricQueryResult, type: App\Module\Bridge\Controller\Api\MetricQueryResponse }
                - { alias: AnalysisScope, type: App\Module\Insights\Controller\Api\AnalysisScopeResponse }
                - { alias: AnalysisProposal, type: App\Module\Insights\Controller\Api\AnalysisProposalResponse }
                - { alias: Analysis, type: App\Module\Insights\Controller\Api\AnalysisResponse }
                - { alias: AnalysisList, type: App\Module\Insights\Controller\Api\AnalysisListResponse }
                - { alias: InboxItem, type: App\Module\Inbox\Controller\Api\InboxItemResponse }
                - { alias: InboxItemCreate, type: App\Module\Inbox\Controller\Api\CreateInboxItemRequest }
                - { alias: DocumentLink, type: App\Module\Review\Controller\Api\DocumentLinkResponse }
                - { alias: DocumentRow, type: App\Module\Review\Controller\Api\DocumentRowResponse }
                - { alias: DocumentList, type: App\Module\Review\Controller\Api\DocumentListResponse }
                - { alias: Document, type: App\Module\Review\Controller\Api\DocumentResponse }
                - { alias: DocumentCreated, type: App\Module\Review\Controller\Api\DocumentCreatedResponse }
                - { alias: DocumentPublishResult, type: App\Module\Review\Controller\Api\DocumentPublishResponse }
                - { alias: DocumentVersionRow, type: App\Module\Review\Controller\Api\DocumentVersionRowResponse }
                - { alias: DocumentVersionList, type: App\Module\Review\Controller\Api\DocumentVersionListResponse }
                - { alias: DocumentVersion, type: App\Module\Review\Controller\Api\DocumentVersionResponse }
                - { alias: DocumentRevision, type: App\Module\Review\Controller\Api\DocumentRevisionResponse }
                - { alias: DocumentCreate, type: App\Module\Review\Controller\Api\CreateDocumentRequest }
                - { alias: DocumentUpdate, type: App\Module\Review\Controller\Api\UpdateDocumentRequest }
                - { alias: DocumentRevise, type: App\Module\Review\Controller\Api\CreateDocumentVersionRequest }
                - { alias: ReviewReply, type: App\Module\Review\Controller\Api\ReviewReplyResponse }
                - { alias: ReviewComment, type: App\Module\Review\Controller\Api\ReviewCommentResponse }
                - { alias: DecisionSelection, type: App\Module\Review\Controller\Api\DecisionSelectionResponse }
                - { alias: ReviewDecision, type: App\Module\Review\Controller\Api\ReviewDecisionResponse }
                - { alias: DocumentAgentReviewFinding, type: App\Module\Review\Controller\Api\DocumentAgentReviewFindingResponse }
                - { alias: DocumentAgentReview, type: App\Module\Review\Controller\Api\DocumentAgentReviewResponse }
                - { alias: DocumentReview, type: App\Module\Review\Controller\Api\ReviewResponse }
                - { alias: CommentUpdate, type: App\Module\Review\Controller\Api\MarkCommentAddressedRequest }
                - { alias: CommentStatusResult, type: App\Module\Review\Controller\Api\CommentStatusResponse }
                - { alias: CommentReply, type: App\Module\Review\Controller\Api\ReplyToCommentRequest }
                - { alias: CommentReplyCreated, type: App\Module\Review\Controller\Api\CommentReplyResponse }
                - { alias: DecisionAnswer, type: App\Module\Review\Controller\Api\AnswerDecisionRequest }
                - { alias: DecisionResult, type: App\Module\Review\Controller\Api\DecisionResultResponse }
                - { alias: VerdictSubmit, type: App\Module\Review\Controller\Api\SubmitVerdictRequest }
                - { alias: VerdictResult, type: App\Module\Review\Controller\Api\VerdictResponse }
                - { alias: VerdictWithdrawResult, type: App\Module\Review\Controller\Api\VerdictWithdrawResponse }
        areas:
            # The bundle requires an area of this name. It documents the public routes, as `public` does.
            default:
                path_patterns:
                    - '^/api/versions$'
                    - '^/api/v1(?!/(bridge|live-review-widget)(/|$))'
            public:
                path_patterns:
                    - '^/api/versions$'
                    - '^/api/v1(?!/(bridge|live-review-widget)(/|$))'
                documentation:
                    info:
                        title: Loupe API v1
                        version: 1.0.0
                        description: The public HTTP API of Loupe.
            private:
                path_patterns:
                    - '^/api/v1/(bridge|live-review-widget)(/|$)'
                documentation:
                    info:
                        title: Loupe API v1, private routes
                        version: 1.0.0
                        description: The bridge and widget routes. They carry no public promise.
                    components:
                        schemas:
                            CommandAckAnswer:
                                type: object
                                required:
                                - commandId
                                - state
                                properties:
                                    commandId:
                                        type: string
                                        format: uuid
                                    state:
                                        type: string
                                        description: The stored state.
                                        enum:
                                        - pending
                                        - done
                                        - refused
                                        - expired
                                        - cancelled
                            HeartbeatAnswer:
                                type: object
                                required:
                                - cliRange
                                - paused
                                - commands
                                - workRequests
                                - lostClaims
                                - watchSessions
                                - blockedAccounts
                                properties:
                                    cliRange:
                                        type: string
                                        example: ^2.0
                                    paused:
                                        type: boolean
                                        description: True when the server asks the bridge to take no new work.
                                    commands:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/BridgeCommand'
                                        description: The pending commands, oldest first.
                                    workRequests:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/WorkRequest'
                                        description: The open work requests the bridge can claim, oldest first, at most 100.
                                    lostClaims:
                                        type: array
                                        items:
                                            type: string
                                            format: uuid
                                        description: The ids from `workClaims` that the bridge no longer holds.
                                    watchSessions:
                                        type: array
                                        items:
                                            type: string
                                            format: uuid
                                        description: The open interactive runs that this bridge launched.
                                    blockedAccounts:
                                        type: array
                                        description: The accounts that hit a usage limit, with the time each one frees up.
                                        items:
                                            type: object
                                            required:
                                            - account
                                            - until
                                            properties:
                                                account:
                                                    type: string
                                                until:
                                                    type: string
                                                    format: date-time
                                                    nullable: true
                            BridgeCommand:
                                type: object
                                description: One command to a bridge.
                                required:
                                - type
                                - projectId
                                - subject
                                - commandId
                                - kind
                                - bridgeId
                                - runId
                                - runKey
                                - sessionId
                                - subjectType
                                - subjectId
                                - cardNumber
                                - workRequestId
                                - workKind
                                - ruleId
                                - startedAt
                                - endedAt
                                - expiresAt
                                - cause
                                - context
                                - model
                                - effort
                                - harness
                                - account
                                - runModel
                                - inboxActionId
                                - inboxItemNumber
                                - inboxItemId
                                properties:
                                    type:
                                        type: string
                                        enum:
                                        - bridge.command
                                    projectId:
                                        type: string
                                        format: uuid
                                    subject:
                                        $ref: '#/components/schemas/SubjectRef'
                                    commandId:
                                        type: string
                                        format: uuid
                                    kind:
                                        type: string
                                        enum:
                                        - resume-run
                                        - stop-run
                                        - rerun-command
                                        - collect-session-usage
                                    bridgeId:
                                        type: string
                                        format: uuid
                                    runId:
                                        type: string
                                        format: uuid
                                    runKey:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    sessionId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    subjectType:
                                        type: string
                                    subjectId:
                                        type: string
                                        format: uuid
                                    cardNumber:
                                        type: integer
                                        nullable: true
                                    workRequestId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    workKind:
                                        type: string
                                        nullable: true
                                    ruleId:
                                        type: string
                                        nullable: true
                                    startedAt:
                                        type: string
                                        format: date-time
                                        nullable: true
                                    endedAt:
                                        type: string
                                        format: date-time
                                        nullable: true
                                    expiresAt:
                                        type: string
                                        format: date-time
                                    cause:
                                        type: string
                                        enum:
                                        - person
                                        - ask-closed
                                        - inbox-action
                                        - agent
                                    context:
                                        $ref: '#/components/schemas/WorkContext'
                                    model:
                                        type: string
                                        nullable: true
                                    effort:
                                        type: string
                                        nullable: true
                                    harness:
                                        type: string
                                        nullable: true
                                    account:
                                        type: string
                                        nullable: true
                                    runModel:
                                        type: string
                                        nullable: true
                                    inboxActionId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    inboxItemNumber:
                                        type: integer
                                        nullable: true
                                    inboxItemId:
                                        type: string
                                        format: uuid
                                        nullable: true
                            SubjectRef:
                                type: object
                                required:
                                - type
                                - id
                                properties:
                                    type:
                                        type: string
                                    id:
                                        type: string
                                        format: uuid
                            WorkContext:
                                type: object
                                description: What the card held when the request opened. Each key is null when the card held no such value.
                                required:
                                - pullRequestNumber
                                - pullRequestUrl
                                - headSha
                                - reason
                                - documentId
                                - epicBranch
                                - inboxActionId
                                - inboxItemNumber
                                - inboxItemId
                                properties:
                                    pullRequestNumber:
                                        type: integer
                                        nullable: true
                                    pullRequestUrl:
                                        type: string
                                        nullable: true
                                    headSha:
                                        type: string
                                        nullable: true
                                    reason:
                                        type: string
                                        nullable: true
                                    documentId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    epicBranch:
                                        type: string
                                        nullable: true
                                    inboxActionId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    inboxItemNumber:
                                        type: integer
                                        nullable: true
                                    inboxItemId:
                                        type: string
                                        format: uuid
                                        nullable: true
                            WorkRequest:
                                type: object
                                description: One work request. It never carries the claim token.
                                required:
                                - type
                                - projectId
                                - subject
                                - workRequestId
                                - subjectType
                                - subjectId
                                - kind
                                - capability
                                - state
                                - cardNumber
                                - ruleId
                                - createdAt
                                - resumeSessionId
                                - context
                                - model
                                - effort
                                - prompt
                                - inboxActionId
                                - inboxItemNumber
                                - inboxItemId
                                - targetBridgeId
                                - branch
                                - params
                                - run
                                properties:
                                    type:
                                        type: string
                                        enum:
                                        - bridge.work_request
                                    projectId:
                                        type: string
                                        format: uuid
                                    subject:
                                        $ref: '#/components/schemas/SubjectRef'
                                    workRequestId:
                                        type: string
                                        format: uuid
                                    subjectType:
                                        type: string
                                    subjectId:
                                        type: string
                                        format: uuid
                                    kind:
                                        type: string
                                        description: The kind of work.
                                    capability:
                                        type: string
                                        description: The capability a bridge must report to claim the request.
                                        nullable: true
                                    state:
                                        type: string
                                        enum:
                                        - open
                                        - claimed
                                        - done
                                        - refused
                                        - expired
                                        - cancelled
                                    cardNumber:
                                        type: integer
                                        description: A label a person reads, for a card subject alone.
                                        nullable: true
                                    ruleId:
                                        type: string
                                        nullable: true
                                    createdAt:
                                        type: string
                                        format: date-time
                                    resumeSessionId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    context:
                                        $ref: '#/components/schemas/WorkContext'
                                    model:
                                        type: string
                                        nullable: true
                                    effort:
                                        type: string
                                        description: '`low`, `medium`, `high`, `xhigh` or `max`.'
                                        nullable: true
                                    prompt:
                                        type: string
                                        nullable: true
                                    inboxActionId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    inboxItemNumber:
                                        type: integer
                                        nullable: true
                                    inboxItemId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    targetBridgeId:
                                        type: string
                                        format: uuid
                                        nullable: true
                                    branch:
                                        type: string
                                        nullable: true
                                    params:
                                        type: object
                                        additionalProperties: true
                                        description: Parameter name to value, or null when the request has none.
                                        nullable: true
                                    run:
                                        type: array
                                        items:
                                            type: string
                                        description: The `run` list of the command entry.
                                        nullable: true
                            WorkClaim:
                                type: object
                                required:
                                - workRequestId
                                - claimToken
                                - leaseUntil
                                - workRequest
                                properties:
                                    workRequestId:
                                        type: string
                                        format: uuid
                                    claimToken:
                                        type: string
                                        description: The bridge sends it back with the result.
                                        format: uuid
                                    leaseUntil:
                                        type: string
                                        format: date-time
                                        nullable: true
                                    workRequest:
                                        $ref: '#/components/schemas/WorkRequest'
                            WorkResultAnswer:
                                type: object
                                required:
                                - workRequestId
                                - state
                                properties:
                                    workRequestId:
                                        type: string
                                        format: uuid
                                    state:
                                        type: string
                                        description: The stored state.
                                        enum:
                                        - open
                                        - claimed
                                        - done
                                        - refused
                                        - expired
                                        - cancelled
                            CardHolds:
                                type: object
                                required:
                                - holds
                                properties:
                                    holds:
                                        type: array
                                        items:
                                            type: object
                                            required:
                                            - projectId
                                            - cardId
                                            properties:
                                                projectId:
                                                    type: string
                                                    format: uuid
                                                cardId:
                                                    type: string
                                                    format: uuid
                            EventsAnswer:
                                type: object
                                required:
                                - hubUrl
                                - jwt
                                - topic
                                - projects
                                - flags
                                - cliRange
                                - head
                                properties:
                                    hubUrl:
                                        type: string
                                        format: uri
                                    jwt:
                                        type: string
                                        description: A subscriber JWT for the topic of the caller.
                                    topic:
                                        type: string
                                    projects:
                                        type: array
                                        items:
                                            type: object
                                            required:
                                            - id
                                            - slug
                                            - name
                                            properties:
                                                id:
                                                    type: string
                                                    format: uuid
                                                slug:
                                                    type: string
                                                    nullable: true
                                                name:
                                                    type: string
                                    flags:
                                        type: object
                                        description: The only flags an agent token reads, such as `inbox.enabled` and `bridge.heartbeat_interval_seconds`.
                                        properties: {}
                                        additionalProperties:
                                            oneOf:
                                            -   type: boolean
                                            -   type: integer
                                    cliRange:
                                        type: string
