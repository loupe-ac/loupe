framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Email, notifier messages, pull request refreshes and every other background job. Same DSN, own queue name.
            jobs:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: jobs
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Card checks that an event starts, read before `jobs`: a backlog of mail or refreshes must not delay a marker. Same DSN, own queue name.
            card_eval:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: card_eval
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # The sweep's card checks, read after `jobs` is empty. Same DSN, own queue name.
            card_sweep:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: card_sweep
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - App\Messenger\Middleware\AuditChannelMiddleware

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: jobs
            Symfony\Component\Notifier\Message\ChatMessage: jobs
            Symfony\Component\Notifier\Message\SmsMessage: jobs
            App\Module\Account\Messenger\GenerateDataExportMessage: jobs
            App\Module\Billing\Messenger\CancelSubscriptionMessage: jobs
            App\Module\Board\Messenger\NeutralizeSiteReviewCheck: jobs
            App\Module\Board\Messenger\PostFixRunComment: jobs
            App\Module\Board\Messenger\PostPullRequestNotice: jobs
            App\Module\Bridge\Messenger\CollectSessionUsage: jobs
            App\Module\Bridge\Messenger\RecomputeBucketTimes: jobs
            App\Module\Bridge\Messenger\ResumeAskingSession: jobs
            App\Module\Forge\Messenger\RefreshPullRequestState: jobs
            App\Module\Inbox\Messenger\ReconcileCardWaits: jobs
            App\Module\Workflow\Messenger\EvaluateCard: card_eval
            App\Module\Workflow\Messenger\RunRuleAskAnswer: jobs

            # Route your messages to the transports
            # 'App\Message\YourMessage': jobs

# Registered only here: the override is keyed on a client-supplied header, so in
# production any caller could force queued work inline.
when@dev:
    framework:
        messenger:
            transports:
                sync: 'sync://'

            # `middleware` does not deep-merge, so this list replaces the one
            # above outright: the audit entry has to be repeated here.
            buses:
                messenger.bus.default:
                    middleware:
                        - App\Messenger\Middleware\AuditChannelMiddleware
                        - App\Messenger\Middleware\PlaywrightSyncMiddleware

when@test:
    framework:
        messenger:
            transports:
                jobs:
                    dsn: 'in-memory://'
                    retry_strategy:
                        # Same retry budget as prod so retry-flow tests exercise
                        # the real number of attempts; zero delay so the
                        # in-memory transport releases retries immediately.
                        max_retries: 3
                        multiplier: 2
                        delay: 0
                card_eval:
                    dsn: 'in-memory://'
                    retry_strategy:
                        max_retries: 3
                        multiplier: 2
                        delay: 0
                card_sweep:
                    dsn: 'in-memory://'
                    retry_strategy:
                        max_retries: 3
                        multiplier: 2
                        delay: 0
