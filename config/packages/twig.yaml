twig:
    file_name_pattern: '*.twig'
    globals:
        site_review_widget_project: '%env(SITE_REVIEW_WIDGET_PROJECT)%'
        site_review_widget_backend: '%env(SITE_REVIEW_WIDGET_BACKEND)%'
        site_review_widget_public: '%env(bool:SITE_REVIEW_WIDGET_PUBLIC)%'
        site_review_widget_context: '%env(SITE_REVIEW_WIDGET_CONTEXT)%'
        site_review_widget_preview_token: '%env(SITE_REVIEW_WIDGET_PREVIEW_TOKEN)%'
        app_docs_url: '%app.docs_url%'
        mermaid_module_url: '%app.mermaid_cdn_base%mermaid.esm.min.mjs'
    paths:
        '%kernel.project_dir%/templates/Module/Analytics': 'Analytics'
        '%kernel.project_dir%/templates/Module/Account': 'Account'
        '%kernel.project_dir%/templates/Module/Admin': 'Admin'
        '%kernel.project_dir%/templates/Module/Artifact': 'Artifact'
        '%kernel.project_dir%/templates/Module/Billing': 'Billing'
        '%kernel.project_dir%/templates/Module/Board': 'Board'
        '%kernel.project_dir%/templates/Module/Bridge': 'Bridge'
        '%kernel.project_dir%/templates/Module/DesignSystem': 'DesignSystem'
        '%kernel.project_dir%/templates/Module/Diagnostics': 'Diagnostics'
        '%kernel.project_dir%/templates/Module/GitHub': 'GitHub'
        '%kernel.project_dir%/templates/Module/Inbox': 'Inbox'
        '%kernel.project_dir%/templates/Module/Insights': 'Insights'
        '%kernel.project_dir%/templates/Module/Landing': 'Landing'
        '%kernel.project_dir%/templates/Module/Legal': 'Legal'
        '%kernel.project_dir%/templates/Module/Notification': 'Notification'
        '%kernel.project_dir%/templates/Module/OAuth': 'OAuth'
        '%kernel.project_dir%/templates/Module/OpenRouter': 'OpenRouter'
        '%kernel.project_dir%/templates/Module/Project': 'Project'
        '%kernel.project_dir%/templates/Module/Readiness': 'Readiness'
        '%kernel.project_dir%/templates/Module/Review': 'Review'
        '%kernel.project_dir%/templates/Module/SiteReview': 'SiteReview'
        '%kernel.project_dir%/templates/Module/Workflow': 'Workflow'
        '%kernel.project_dir%/var/tailwind': 'tailwind'
        '%kernel.project_dir%/assets/styles': 'EmailStyles'

when@test:
    twig:
        strict_variables: true
        paths:
            # Backs AdminUserPanelFixture. A fixture template must not sit under
            # templates/Module/, which is production markup.
            '%kernel.project_dir%/tests/Support/templates': 'TestFixtures'
            # Backs the layout export test with a sample part, until a real one ships.
            '%kernel.project_dir%/tests/Support/design-system-templates': 'DesignSystem'
