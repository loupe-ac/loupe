# Rules the app adds to the workflow of every project, after the rules of its template.
# A request may name a prompt, the file prompts/<name>.md, which the work request carries to the bridge.
# The slot of the column where the cards of ticked discovery proposals land.
proposalSlot: next

rules:
    # The rule reads the state of the discovery run, so a failed run turns it false and the engine does not retry.
    - id: discovery
      slot: '@backlog'
      when: { card.discovery.requested: {} }
      then:
          request:
              kind: discovery
              onNoTaker: fail
              prompt: discovery
              checks:
                  - The Loupe plugin skills are installed for the agent, with the loupe-discovery skill
                  - The bridge rule file maps the discovery kind, or sets appPrompts to true

    # The owner asked for changes to the report. An approval or a failure ends the run, so the rule turns false and the engine cancels the request.
    - id: discovery-revise
      slot: '@backlog'
      when: { card.discovery.revising: {} }
      then:
          request:
              kind: discovery-revise
              onNoTaker: fail
              prompt: discovery-revise
              checks:
                  - The Loupe plugin skills are installed for the agent, with the loupe-discovery skill
                  - The bridge rule file maps the discovery-revise kind, or sets appPrompts to true

    # The listener that approves a report sets the run to done. The engine then moves the card to the terminal column.
    - id: discovery-approved
      slot: '@backlog'
      when: { card.discovery.approved: {} }
      then: { move: { to: '@terminal' } }

    - id: post-widget-review
      when: { card.site_review.verdict_unsent: {} }
      then: { forge-write: { write: post-review } }

    - id: sync-site-review-check
      when: { card.site_review.check_stale: {} }
      then: { forge-write: { write: site-review-check } }

    - id: sync-agent-review-check
      when: { agent_review.unposted: {} }
      then: { forge-write: { write: agent-review-check } }

    - id: comment-agent-review
      when: { agent_review.uncommented: {} }
      then: { forge-write: { write: comment, comment: agent-review } }

# Work the app asks a bridge for outside the engine. Each entry ships a prompt.
requests:
    - id: insights.analysis
      kind: analysis
      prompt: analysis
      checks:
          - The Loupe plugin skills are installed for the agent, with the loupe-analysis skill
          - The bridge rule file maps the analysis kind, or sets appPrompts to true
