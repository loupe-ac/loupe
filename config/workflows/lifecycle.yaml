key: lifecycle
version: 33
defaultType: feature
epicBranch: 'epic/{number}'
outcomes:
    - { key: merged, delivered: true }
metrics:
    - key: fix-rounds
      label: Fix rounds
      description: The fix rounds a finished card needed.
      count: { role: fix }
      splitBy: reason
    - key: design-rounds
      label: Design review rounds
      description: The design revise rounds a finished card needed.
      count: { role: design-revise }
    - key: merge-rate
      label: Merge rate
      description: The share of finished cards that the merge rule ended.
      rate: { outcome: merged }
    - key: hours-to-merge
      label: Hours to merge
      description: The hours from the first pull request opening to the merge.
      duration: { from: pr-opened, to: pr-merged }
    - key: hours-to-agent-pass
      label: Hours to agent review pass
      description: The hours from the first pull request opening to the last agent review pass.
      duration: { from: pr-opened, to: agent-review-passed }
    - key: hours-waiting-for-approval
      label: Hours waiting for approval
      description: The hours from the last agent review pass to ready to merge.
      duration: { from: { last: agent-review-passed }, to: ready-to-merge }
agentReviewFailingSeverities: [important]
approvalCoversConflictResolution: true
repositorySettings:
    - { key: approval-gate, mark: blocking }
    - { key: ci-checks, mark: warning }
    - { key: branch-protection, mark: warning }
    - { key: merge-method, mark: blocking }
types:
    - { key: feature, label: board.card.type.feature, tone: lime }
    - { key: bug, label: board.card.type.bug, tone: amber }
    - { key: security, label: board.card.type.security, tone: red }
    - { key: tooling, label: board.card.type.tooling, tone: neutral }
    - { key: docs, label: board.card.type.docs, tone: green }
    - { key: idea, label: board.card.type.idea, tone: purple }
    - { key: epic, label: board.card.type.epic, tone: blue, capabilities: [children, lane] }
values:
    - key: tech-design-interactive
      type: bool
      label: workflow.value.tech_design_interactive.label
      caption: workflow.value.tech_design_interactive.caption
      help: workflow.value.tech_design_interactive.help
      history: workflow.value.tech_design_interactive.history
slots:
    - { key: next, label: workflow.slot.next, tone: lime }
    - { key: product-design, label: workflow.slot.product_design, tone: sky }
    - { key: tech-design, label: workflow.slot.tech_design, stageWork: tech-design, tone: indigo }
    - { key: implementation, label: workflow.slot.implementation, stageWork: implement, tone: purple }
    - { key: in-review, label: workflow.slot.in_review, tone: amber }
manualMoves:
    - { from: '@backlog', to: next }
    - { from: next, to: '@backlog' }
    - { from: '@backlog', to: product-design }
    - { from: '@backlog', to: tech-design }
    - { from: next, to: product-design }
    - { from: next, to: tech-design }
    - { from: '@backlog', to: '@terminal' }
    - { from: next, to: '@terminal' }
    - { from: implementation, to: tech-design }
childChoices:
    inherit: [{ link-document: { from: parent, tag: tech-design } }]
    own: [{ move: { to: tech-design } }]
backoffMinutes: [10, 60, 360]
workTimeoutMinutes: 120
onWorkFailed:
    retryOn: [failed, timeout, still-true, mcp-unreachable]
    retries: 3
    backoffMinutes: [2, 3, 5]
    repair: { kind: repair }
facts:
    pr-reviewable:
        all:
            - pr.open: {}
            - not: { pr.draft: {} }
            - pr.checks_passed: {}
            - not: { pr.conflicting: {} }
            - not: { pr.changes_requested: {} }
    pr-waits-for-approval:
        all:
            - fact.pr-reviewable: {}
            - pr.checks_on_head: {}
            - pr.base_is_default: {}
            - not: { pr.approval_check_passed: {} }
            - not: { card.run.worker_active: {} }
            - any:
                  - card.review.needs_person: {}
                  - not: { pr.can_post_check: {} }
                  - agent_review.failed: {}
rules:
    # These two come first and have no slot. A person who withdraws an approval undoes the stage it opened.
    # A card in a terminal column keeps its place, and a card already in the slot of the design has nothing to undo.
    - id: product-design-undo
      when:
          all:
              - card.document.approval_withdrawn: { tag: product-design }
              - not: { card.in_slot: { slot: '@terminal' } }
              - not: { card.in_slot: { slot: product-design } }
      then:
          - stop-work: {}
          - request-changes: { tags: [tech-design], note: workflow.note.product_design_undone }
          - move: { to: product-design }

    - id: tech-design-undo
      when:
          all:
              - card.document.approval_withdrawn: { tag: tech-design }
              - not: { card.in_slot: { slot: '@terminal' } }
              - not: { card.in_slot: { slot: tech-design } }
      then:
          - stop-work: {}
          - move: { to: tech-design }

    - id: product-design-session
      slot: product-design
      when:
          all:
              - not: { card.document.linked: { tag: product-design } }
              - not: { card.run.session_open: {} }
      then:
          request:
              kind: product-design
              capability: interactive
              cancelWhen: { card.run.session_open: {} }
              cancelOnly: open
              checks:
                  - An interactive session that the owner can join
                  - The Loupe plugin skills are installed for the agent
                  - When the project has a user interface, a design system that an agent can read, such as design tokens, a component catalog, a styleguide page, or a Design System artifact on claude.ai that the agent instructions name as its home
                  - When the project has a user interface, a Design System artifact on claude.ai that holds or mirrors the design system, named in .loupe/lifecycle.md or the agent instructions

    - id: product-design-revise
      slot: product-design
      when: { card.document.changes_requested: { tag: product-design } }
      then:
          request:
              kind: product-design-revise
              role: design-revise
              document: { tag: product-design, status: changes-requested }
              checks:
                  - The Loupe plugin skills are installed for the agent

    - id: product-design-review
      slot: product-design
      when:
          all:
              - design_review.due: { tag: product-design, rounds: 6 }
              - not: { card.run.work_active: { kind: product-design } }
              - not: { card.run.work_active: { kind: product-design-revise } }
              - not: { card.run.worker_active: { kind: product-design } }
              - not: { card.run.worker_active: { kind: product-design-revise } }
              - not: { card.run.session_open: {} }
      then:
          request:
              kind: design-review
              role: design-review
              stillTrue: retry
              cancelWhen: { not: { card.document.linked: { tag: product-design, status: draft } } }
              document: { tag: product-design, status: draft }
              checks:
                  - A bridge work entry for the design-review kind
                  - The Loupe plugin skills are installed for the agent

    - id: product-design-review-fix
      slot: product-design
      when: { design_review.fix_due: { tag: product-design, rounds: 6 } }
      then:
          request:
              kind: product-design-revise
              role: design-revise
              reason: agent-review
              cancelWhen: { not: { card.document.linked: { tag: product-design, status: draft } } }
              limit: 6
              document: { tag: product-design, status: draft }
              checks:
                  - The Loupe plugin skills are installed for the agent

    - id: product-design-review-publish
      slot: product-design
      when:
          all:
              - design_review.finished: { tag: product-design, rounds: 6 }
              - not: { card.run.work_active: {} }
              - not: { card.run.worker_active: {} }
      then: { publish-documents: { tags: [product-design] } }

    - id: product-design-auto-approve
      slot: product-design
      when:
          all:
              - card.document.in_review: { tag: product-design }
              - card.document.published_in_column: { tag: product-design }
              - not: { card.document.entry_decisions_open: { tag: product-design } }
              - not: { card.document.entry_threads_open: { tag: product-design } }
              - not: { card.document.rejected_before: { tag: product-design } }
              - design_review.passed: { tag: product-design }
      then: { approve-document: { tag: product-design } }

    - id: product-design-approved
      slot: product-design
      when:
          all:
              - card.document.approved: { tag: product-design }
              - not: { card.document.changes_requested: { tag: product-design } }
      then: { move: { to: tech-design } }

    - id: tech-design-handover
      slot: tech-design
      when:
          all:
              - card.value: { key: tech-design-interactive, equals: true }
              - not: { card.document.linked: { tag: tech-design } }
              - any:
                    - card.run.work_active: { kind: tech-design, origin: rule }
                    - card.run.worker_active: { kind: tech-design, origin: rule }
      then: { stop-work: {} }

    - id: tech-design-session
      slot: tech-design
      when:
          all:
              - card.value: { key: tech-design-interactive, equals: true }
              - not: { card.document.linked: { tag: tech-design } }
              - not: { card.run.session_open: {} }
              - not: { card.run.work_active: { kind: tech-design } }
              - not: { card.run.worker_active: { kind: tech-design } }
      then:
          request:
              kind: tech-design-session
              capability: interactive
              cancelOnly: open
              cancelWhen:
                  any:
                      - card.run.session_open: {}
                      - not: { card.value: { key: tech-design-interactive, equals: true } }
              checks:
                  - A bridge work entry for the tech-design-session kind
                  - An interactive session that the owner can join
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-write
      slot: tech-design
      when:
          all:
              - not: { card.document.linked: { tag: tech-design } }
              - not: { card.value: { key: tech-design-interactive, equals: true } }
              - not: { card.run.session_open: {} }
      then:
          request:
              kind: tech-design
              cancelWhen: { card.run.session_open: {} }
              cancelOnly: open
              checks:
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-revise
      slot: tech-design
      when: { card.document.changes_requested: { tag: tech-design } }
      then:
          request:
              kind: tech-design-revise
              role: design-revise
              document: { tag: tech-design, status: changes-requested }
              checks:
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-review
      slot: tech-design
      when:
          all:
              - design_review.due: { tag: tech-design, rounds: 6 }
              - not: { card.run.work_active: { kind: tech-design } }
              - not: { card.run.work_active: { kind: tech-design-revise } }
              - not: { card.run.worker_active: { kind: tech-design } }
              - not: { card.run.worker_active: { kind: tech-design-revise } }
              - not: { card.run.session_open: {} }
      then:
          request:
              kind: design-review
              role: design-review
              stillTrue: retry
              cancelWhen: { not: { card.document.linked: { tag: tech-design, status: draft } } }
              document: { tag: tech-design, status: draft }
              checks:
                  - A bridge work entry for the design-review kind
                  - The Loupe plugin skills are installed for the agent
                  - The agent can read the whole repository

    - id: tech-design-review-fix
      slot: tech-design
      when: { design_review.fix_due: { tag: tech-design, rounds: 6 } }
      then:
          request:
              kind: tech-design-revise
              role: design-revise
              reason: agent-review
              cancelWhen: { not: { card.document.linked: { tag: tech-design, status: draft } } }
              limit: 6
              document: { tag: tech-design, status: draft }
              checks:
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-review-publish
      slot: tech-design
      when:
          all:
              - design_review.finished: { tag: tech-design, rounds: 6 }
              - not: { card.run.work_active: {} }
              - not: { card.run.worker_active: {} }
      then: { publish-documents: { tags: [tech-design, deploy-notes] } }

    - id: tech-design-auto-approve
      slot: tech-design
      when:
          all:
              - card.document.in_review: { tag: tech-design }
              - card.document.published_in_column: { tag: tech-design }
              - not: { card.document.entry_decisions_open: { tag: tech-design } }
              - not: { card.document.entry_threads_open: { tag: tech-design } }
              - not: { card.document.rejected_before: { tag: tech-design } }
              - design_review.passed: { tag: tech-design }
      then: { approve-document: { tag: tech-design } }

    - id: tech-design-recheck
      slot: tech-design
      when:
          all:
              - card.document.approved: { tag: tech-design }
              - not: { card.document.changes_requested: { tag: tech-design } }
              - not: { card.blocker.open: {} }
              - card.blocker.closed: {}
              - not: { card.run.finished_with: { kind: tech-design-recheck, reason: done } }
      then:
          request:
              kind: tech-design-recheck
              checks:
                  - The agent can read the whole repository
                  - Agent instructions such as AGENTS.md or CLAUDE.md describe the architecture
                  - The Loupe plugin skills are installed for the agent

    - id: tech-design-approved
      slot: tech-design
      when:
          all:
              - card.document.approved: { tag: tech-design }
              - not: { card.document.changes_requested: { tag: tech-design } }
              - not: { card.blocker.open: {} }
              - any:
                    - not: { card.blocker.closed: {} }
                    - card.run.finished_with: { kind: tech-design-recheck, reason: done }
      then: { move: { to: implementation } }

    - id: implement
      slot: implementation
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - not: { card.pr.linked: {} }
      then:
          request:
              kind: implement
              checks:
                  - A worktree per card, so two cards never share one checkout
                  - A preview URL per branch, with the review widget on it
                  - The .loupe/lifecycle.md sections that the stage skills read
                  - A build command and a test command that an agent can run
                  - A draft pull request that a separate agent reviews after the push

    # After implement, so a card that comes back opens its new request before these read the latest request.
    - id: nothing-to-build
      slot: implementation
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - not: { card.pr.linked: {} }
              - not: { card.run.work_active: {} }
              - card.run.finished_with: { kind: implement, reason: nothing-to-build }
      then: { move: { to: '@terminal' } }

    - id: delivered-without-code
      slot: implementation
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - not: { card.pr.linked: {} }
              - not: { card.run.work_active: {} }
              - card.run.finished_with: { kind: implement, reason: delivered-without-code }
      then: { move: { to: '@terminal' } }

    - id: breakdown
      slot: implementation
      when: { card.type: { types: [epic] } }
      then:
          request:
              kind: breakdown
              checks:
                  - The Epics section of .loupe/lifecycle.md, when the project uses epic branches
                  - Permission to push an epic branch

    - id: reviewable
      slot: implementation
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - pr.open: {}
              - not: { card.pr.draft_open: {} }
              - not: { pr.draft: {} }
              - pr.checks_passed: {}
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
              - any:
                    - agent_review.passed: {}
                    - agent_review.overridden: {}
      then: { move: { to: in-review } }

    - id: fix-in-implementation
      slot: implementation
      when:
          all:
              - not: { card.run.waits_on_answer: {} }
              - pr.open: {}
              - any:
                    - pr.checks_failed: {}
                    - pr.conflicting: {}
                    - pr.changes_requested: {}
      then:
          request:
              kind: fix
              role: fix
              limit: 3
              checks:
                  - The worktree of the card is still available, or the agent can make it again
                  - The gate commands of .loupe/lifecycle.md
                  - Read access to the CI check logs
              refill:
                  all:
                      - pr.checks_passed: {}
                      - not: { pr.conflicting: {} }
                      - not: { pr.changes_requested: {} }

    - id: agent-review
      slot: implementation
      when:
          all:
              - pr.open: {}
              - agent_review.due: {}
              - card.children.finished: {}
              - not: { card.run.work_active: { kind: implement } }
              - not: { card.run.work_active: { kind: fix } }
              - not: { card.run.work_active: { kind: sync } }
              - not: { card.run.work_active: { kind: rebase-stacked } }
      then:
          request:
              kind: review
              role: code-review
              stillTrue: retry
              checks:
                  - A bridge work entry for the review kind
                  - The Loupe plugin skills are installed for the agent

    - id: fix-agent-review
      slot: implementation
      when:
          all:
              - not: { card.run.waits_on_answer: {} }
              - pr.open: {}
              - agent_review.failed: {}
              - card.children.finished: {}
      then:
          request:
              kind: fix
              role: fix
              reason: agent-review
              limit: 10
              checks:
                  - The worktree of the card is still available, or the agent can make it again
                  - The gate commands of .loupe/lifecycle.md
                  - Read access to the CI check logs
              refill:
                  agent_review.passed: {}

    - id: review-ready
      slot: implementation
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - pr.draft: {}
              - any:
                    - agent_review.passed: {}
                    - agent_review.overridden: {}
              - pr.checks_passed: {}
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
      then: { forge-write: { write: review-ready } }

    - id: fix-in-review
      slot: in-review
      when:
          all:
              - not: { card.run.waits_on_answer: {} }
              - pr.open: {}
              - any:
                    - pr.checks_failed: {}
                    - pr.conflicting: {}
                    - pr.changes_requested: {}
      then:
          request:
              kind: fix
              role: fix
              limit: 3
              checks:
                  - The worktree of the card is still available, or the agent can make it again
                  - The gate commands of .loupe/lifecycle.md
                  - Read access to the CI check logs
              refill:
                  all:
                      - pr.checks_passed: {}
                      - not: { pr.conflicting: {} }
                      - not: { pr.changes_requested: {} }

    - id: comment-fix-run
      when: { card.fix_run.uncommented: {} }
      then: { forge-write: { write: comment, comment: fix-run } }

    - id: comment-stale-approval
      when: { card.pr.approval_stale: {} }
      then: { forge-write: { write: comment, comment: stale-approval } }

    - id: agent-review-in-review
      slot: in-review
      when:
          all:
              - pr.open: {}
              - agent_review.due: {}
              - not: { card.run.work_active: { kind: implement } }
              - not: { card.run.work_active: { kind: fix } }
              - not: { card.run.work_active: { kind: sync } }
              - not: { card.run.work_active: { kind: rebase-stacked } }
      then:
          request:
              kind: review
              role: code-review
              stillTrue: retry
              checks:
                  - A bridge work entry for the review kind
                  - The Loupe plugin skills are installed for the agent

    - id: fix-agent-review-in-review
      slot: in-review
      when:
          all:
              - not: { card.run.waits_on_answer: {} }
              - pr.open: {}
              - agent_review.failed: {}
      then:
          request:
              kind: fix
              role: fix
              reason: agent-review
              limit: 10
              checks:
                  - The worktree of the card is still available, or the agent can make it again
                  - The gate commands of .loupe/lifecycle.md
                  - Read access to the CI check logs
              refill:
                  agent_review.passed: {}

    - id: back-to-draft
      slot: in-review
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - pr.draft: {}
      then: { move: { to: implementation } }

    - id: rebase-stacked
      slot: in-review
      when:
          all:
              - pr.open: {}
              - pr.stacked: {}
              - pr.parent_merged: {}
      then: { forge-write: { write: change-base, fallback: rebase-stacked } }

    - id: update-behind
      slot: in-review
      when:
          all:
              - pr.open: {}
              - pr.behind: {}
              - any:
                    - pr.approval_check_passed: {}
                    - pr.base_is_epic_branch: {}
      then: { forge-write: { write: update-branch, fallback: sync } }

    # Loupe posts the Loupe / Approval check once the agent review passed on the head and no person must review the card.
    - id: approval-check-auto
      slot: in-review
      when:
          all:
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.base_is_default: {}
              - pr.checks_passed: {}
              - pr.checks_on_head: {}
              - pr.can_post_check: {}
              - not: { card.review.needs_person: {} }
              - not: { pr.approval_check_passed: {} }
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
              - agent_review.passed: {}
      then: { forge-write: { write: approval-check, state: pass } }

    # A person's approval of the head also passes the check.
    - id: approval-check-person
      slot: in-review
      when:
          all:
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.base_is_default: {}
              - pr.checks_passed: {}
              - pr.checks_on_head: {}
              - pr.approval_covers_head: { min: 1, by: person }
              - not: { pr.approval_check_passed: {} }
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
      then: { forge-write: { write: approval-check, state: pass } }

    - id: merge-ready
      slot: in-review
      when:
          all:
              - card.children.finished: {}
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.checks_passed: {}
              - pr.approval_check_passed: {}
              - any:
                    - not: { card.review.needs_person: {} }
                    - pr.approval_covers_head: { min: 1, by: person }
              - pr.base_is_merge_target: {}
              - not: { pr.base_is_epic_branch: {} }
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
              - not: { pr.behind: {} }
              - any:
                    - agent_review.passed: {}
                    - agent_review.overridden: {}
      then: { forge-write: { write: merge, methods: [squash, merge, rebase], fallback: merge } }

    - id: merge-ready-epic-child
      slot: in-review
      when:
          all:
              - card.children.finished: {}
              - pr.open: {}
              - not: { pr.draft: {} }
              - pr.checks_passed: {}
              - pr.base_is_epic_branch: {}
              - not: { pr.conflicting: {} }
              - not: { pr.changes_requested: {} }
              - not: { pr.behind: {} }
              - not: { card.parent.run.active: {} }
              - any:
                    - agent_review.passed: {}
                    - agent_review.overridden: {}
      then: { forge-write: { write: merge, methods: [squash, merge, rebase], fallback: merge } }

    - id: epic-to-review
      slot: implementation
      when:
          all:
              - card.type: { types: [epic] }
              - card.children.exist: {}
              - card.children.finished: {}
              - pr.open: {}
              - not: { card.run.work_active: {} }
      then: { move: { to: in-review } }

    - id: epic-to-done
      slot: implementation
      when:
          all:
              - card.type: { types: [epic] }
              - card.children.exist: {}
              - card.children.finished: {}
              - not: { card.pr.linked: {} }
              - not: { card.children.merged_into_epic_branch: {} }
              - not: { card.run.work_active: {} }
      then: { move: { to: '@terminal' } }

    - id: epic-entered-implementation
      slot: implementation
      when: { card.type: { types: [epic] } }
      then: { evaluate: { cards: children } }

    - id: breakdown-ended
      when:
          all:
              - card.type: { types: [epic] }
              - not: { card.run.worker_active: {} }
      then: { evaluate: { cards: children } }

    - id: epic-reopened-from-review
      slot: in-review
      when:
          all:
              - card.type: { types: [epic] }
              - not: { card.children.finished: {} }
      then: { move: { to: implementation } }

    - id: epic-reopened-from-done
      slot: '@terminal'
      when:
          all:
              - card.type: { types: [epic] }
              - not: { card.children.finished: {} }
      then: { move: { to: implementation } }

    - id: epic-open-pull-request
      slot: implementation
      when:
          all:
              - card.type: { types: [epic] }
              - card.children.merged_into_epic_branch: {}
              - not: { pr.open: {} }
      then: { forge-write: { write: open-epic } }

    - id: epic-draft
      slot: implementation
      when: { card.type: { types: [epic] } }
      then: { forge-write: { write: draft } }

    - id: epic-ready
      slot: in-review
      when: { card.type: { types: [epic] } }
      then: { forge-write: { write: ready } }

    - id: epic-close
      slot: '@backlog'
      when: { card.type: { types: [epic] } }
      then: { forge-write: { write: close } }

    - id: teardown
      slot: '@terminal'
      when: { all: [] }
      then:
          request:
              kind: teardown
              onTimeout: expire

    - id: epic-preview
      slot: in-review
      when:
          all:
              - card.type: { types: [epic] }
              - card.children.finished: {}
              - pr.open: {}
              - not: { card.run.done_at_head: { kind: epic-preview } }
              - not: { card.run.work_active: {} }
              - not: { card.run.worker_active: {} }
      then:
          request:
              kind: epic-preview
              onTimeout: expire
              limit: 3
              refill: { card.run.done_at_head: { kind: epic-preview } }
              checks:
                  - A preview URL per epic branch

    - id: epic-branch-sync
      slot: next
      when:
          all:
              - card.parent.exists: {}
              - not: { card.blocker.open: {} }
              - not: { card.parent.epic_branch.synced: {} }
      then: { forge-write: { write: merge-main-into-epic, fallback: sync-epic } }

    - id: child-unblocked
      slot: next
      when:
          all:
              - card.parent.exists: {}
              - card.document.approved: { tag: tech-design }
              - card.parent.in_slot: { slot: implementation }
              - not: { card.blocker.open: {} }
              - card.parent.epic_branch.synced: {}
              - not: { card.pr.linked: {} }
              - not: { card.parent.run.active: {} }
      then: { move: { to: implementation } }

    - id: unplanned-child
      slot: next
      when:
          all:
              - card.parent.exists: {}
              - not: { card.document.approved: { tag: tech-design } }
              - card.parent.document.approved: { tag: tech-design }
              - not: { card.parent.run.active: {} }
      then:
          ask:
              question: workflow.ask.unplanned_child
              options:
                  - { label: workflow.ask.unplanned_child.link, then: [{ link-document: { from: parent, tag: tech-design } }] }
                  - { label: workflow.ask.unplanned_child.design, then: [{ move: { to: tech-design } }] }
                  - { label: workflow.ask.unplanned_child.detach, then: [{ detach: {} }] }

    # No slot, so its truth outlives a move: a person who moves a card with an open pull request to the Backlog makes no edge.
    - id: pull-request-reopened
      when:
          all:
              - not: { card.type: { types: [epic] } }
              - pr.open: {}
      then: { move: { to: implementation, from: '@backlog' } }

    - id: merged
      when:
          all:
              - not: { card.in_slot: { slot: '@terminal' } }
              - card.pr.all_finished_one_merged: {}
              - card.children.finished: {}
              - any: [{ not: { card.type: { types: [epic] } } }, { not: { card.run.worker_active: {} } }]
      then: { move: { to: '@terminal', outcome: merged } }

    # No slot, so its truth outlives a move. A card turns the switch on once for each artifact that reaches it.
    - id: human-review-on-artifact
      when:
          all:
              - card.review.unseen_artifact: {}
              - not: { card.in_slot: { slot: '@terminal' } }
      then: { require-human-review: {} }

    # No slot, so it also runs while the card sits in another column. A switch that a person turns on fails the check.
    - id: approval-check-revoke
      when:
          all:
              - pr.open: {}
              - pr.approval_check_passed: {}
              - card.review.needs_person: {}
              - not: { pr.approval_covers_head: { min: 1, by: person } }
      then: { forge-write: { write: approval-check, state: revoke } }

    # These two come last, with no slot. A fired move ends the pass even when it moves nothing, so an earlier place would shadow the rules after it.
    # The truth outlives a move: a child that a person moves back to the Backlog makes no edge and stays parked.
    - id: child-to-next
      when: { card.parent.exists: {} }
      then: { move: { to: next, from: '@backlog' } }

    # No slot, so its truth outlives a move: a follow-up that a person sends back to the Backlog stays there.
    - id: follow-up-to-next
      when: { card.follows.finished: {} }
      then: { move: { to: next, from: '@backlog' } }

inbox: [waits-for-approval, document-in-review, run-needs-you, paused, repository-misfit]
markers:
    - key: paused
      kind: stuck
      label: marker.paused
      remedy: marker.paused.remedy
      when:
          all:
              - card.paused: {}
              - not: { card.inbox.open_question: { blocking: true } }
              - not: { card.run.asking: {} }
    - key: run-stopped
      kind: stuck
      label: marker.run_stopped
      remedy: marker.run_stopped.remedy
      when:
          all:
              - card.run.stopped: {}
              - not: { card.run.needs_person: {} }
              - not:
                    any:
                        - card.run.work_active: {}
                        - card.run.worker_active: {}
                        - card.inbox.open_question: { blocking: true }
                        - card.rule.retry_scheduled: {}
    - key: run-needs-you
      kind: stuck
      label: marker.run_needs_you
      remedy: marker.run_needs_you.remedy
      when:
          all:
              - card.run.needs_person: {}
              - not: { card.run.asking: {} }
    - key: checks-failed
      kind: stuck
      label: marker.checks_failed
      remedy: marker.checks_failed.remedy
      when:
          all:
              - pr.open: {}
              - pr.checks_failed: {}
              - not:
                    any:
                        - card.run.work_active: { kind: fix }
                        - card.run.worker_active: { kind: fix }
                        - card.run.work_active: { kind: repair }
                        - card.run.worker_active: { kind: repair }
                        - card.rule.retry_scheduled: {}
    - key: conflicting
      kind: stuck
      label: marker.conflicting
      remedy: marker.conflicting.remedy
      when:
          all:
              - pr.open: {}
              - pr.conflicting: {}
              - not:
                    any:
                        - card.run.work_active: { kind: fix }
                        - card.run.worker_active: { kind: fix }
                        - card.run.work_active: { kind: repair }
                        - card.run.worker_active: { kind: repair }
    - key: ready-not-merged
      kind: stuck
      label: marker.ready_not_merged
      remedy: marker.ready_not_merged.remedy
      when:
          all:
              - pr.ready_for: {}
              - not:
                    any:
                        - card.run.work_active: { kind: merge }
                        - card.run.worker_active: { kind: merge }
    - key: pull-request-idle
      kind: stuck
      label: marker.pull_request_idle
      remedy: marker.pull_request_idle.remedy
      fallback: true
      slots: [implementation, in-review]
      when:
          all:
              - pr.open: {}
              - not: { pr.checks_pending: {} }
              - not: { pr.stacked: {} }
              - card.quiet_for: {}
              - not: { card.held: {} }
              - card.children.finished: {}
              - not: { card.parent.run.active: {} }
    - key: pull-requests-closed
      kind: stuck
      label: marker.pull_requests_closed
      remedy: marker.pull_requests_closed.remedy
      slots: [implementation]
      when:
          all:
              - card.pr.all_closed_unmerged: {}
              - not: { card.run.worker_active: {} }
              - not: { card.held: {} }
    - key: nothing-happened
      kind: stuck
      label: marker.nothing_happened
      remedy: marker.nothing_happened.remedy
      fallback: true
      slots: [product-design, tech-design, implementation, in-review]
      when:
          all:
              - card.quiet_for: { children: true }
              - not: { card.held: {} }
              - not:
                    any:
                        - card.children.marked: { kind: working }
                        - card.children.marked: { kind: waiting }
    - key: document-in-review
      kind: needs-you
      label: marker.document_in_review
      remedy: marker.document_in_review.remedy
      slots: [product-design, tech-design]
      when:
          all:
              - any:
                    - all:
                          - card.in_slot: { slot: product-design }
                          - card.document.in_review: { tag: product-design }
                    - all:
                          - card.in_slot: { slot: tech-design }
                          - card.document.in_review: { tag: tech-design }
              - not: { card.document.agent_review_open: {} }
    - key: waits-for-approval
      kind: needs-you
      label: marker.waits_for_approval
      remedy: marker.waits_for_approval.remedy
      when: { fact.pr-waits-for-approval: {} }
    - key: merge-blocked
      kind: needs-you
      label: marker.merge_blocked
      remedy: marker.merge_blocked.remedy
      when:
          all:
              - pr.open: {}
              - pr.approval_check_passed: {}
              - pr.checks_passed: {}
              - pr.merge_blocked: {}
              - not: { card.run.worker_active: {} }
    - key: repository-misfit
      kind: needs-you
      label: marker.repository_misfit
      remedy: marker.repository_misfit.remedy
      link: repositories
      when: { card.rule.held_by_work_hold: {} }
    - key: open-question
      kind: needs-you
      label: marker.open_question
      remedy: marker.open_question.remedy
      when: { card.inbox.open_question: { blocking: true } }
    - key: design-review-running
      kind: working
      label: marker.design_review_running
      remedy: marker.design_review_running.remedy
      slots: [product-design, tech-design]
      when:
          any:
              - all:
                    - card.in_slot: { slot: product-design }
                    - design_review.running: { tag: product-design, rounds: 6 }
              - all:
                    - card.in_slot: { slot: tech-design }
                    - design_review.running: { tag: tech-design, rounds: 6 }
    - key: session-open
      kind: working
      label: marker.session_open
      remedy: marker.session_open.remedy
      when: { card.run.session_open: {} }
    - key: run-open
      kind: working
      label: marker.run_open
      remedy: marker.run_open.remedy
      when: { card.run.worker_active: {} }
    - key: no-capable-bridge
      kind: stuck
      label: marker.no_capable_bridge
      remedy: marker.no_capable_bridge.remedy
      link: agents
      when: { card.run.work_no_capable_taker: {} }
    - key: no-bridge-online
      kind: stuck
      label: marker.no_bridge_online
      remedy: marker.no_bridge_online.remedy
      link: agents
      when:
          all:
              - card.run.work_no_taker: {}
              - not: { card.run.work_no_capable_taker: {} }
    - key: bridge-paused
      kind: waiting
      label: marker.bridge_paused
      remedy: marker.bridge_paused.remedy
      link: agents
      when: { card.run.work_taker_paused: {} }
    - key: usage-limit
      kind: waiting
      label: marker.usage_limit
      remedy: marker.usage_limit.remedy
      link: agents
      when: { card.run.work_taker_limited: {} }
    - key: work-requested
      kind: waiting
      label: marker.work_requested
      remedy: marker.work_requested.remedy
      when:
          all:
              - card.run.work_open: {}
              - not: { card.run.work_no_taker: {} }
              - not: { card.run.work_taker_paused: {} }
              - not: { card.run.work_taker_limited: {} }
    - key: retry-scheduled
      kind: waiting
      label: marker.retry_scheduled
      remedy: marker.retry_scheduled.remedy
      when: { card.rule.retry_scheduled: {} }
    - key: forge-request-pending
      kind: working
      label: marker.forge_request_pending
      remedy: marker.forge_request_pending.remedy
      when: { pr.forge_request_pending: {} }
    - key: held-by-blocker
      kind: waiting
      label: marker.held_by_blocker
      remedy: marker.held_by_blocker.remedy
      when: { card.rule.held_by_blocker: {} }
    - key: waits-for-parent-card
      kind: waiting
      label: marker.waits_for_parent_card
      remedy: marker.waits_for_parent_card.remedy
      when: { pr.stack_parent: { parent: known } }
    - key: waits-for-parent-branch
      kind: waiting
      label: marker.waits_for_parent_branch
      remedy: marker.waits_for_parent_branch.remedy
      when: { pr.stack_parent: { parent: unknown } }
    - key: waiting-on-checks
      kind: waiting
      label: marker.waiting_on_checks
      remedy: marker.waiting_on_checks.remedy
      when: { pr.checks_pending: {} }
    - key: child-stuck
      kind: stuck
      label: marker.child_stuck
      remedy: marker.child_stuck.remedy
      when: { card.children.marked: { kind: stuck } }
    - key: child-needs-you
      kind: needs-you
      label: marker.child_needs_you
      remedy: marker.child_needs_you.remedy
      when: { card.children.marked: { kind: needs-you } }
    - key: child-working
      kind: working
      label: marker.child_working
      remedy: marker.child_working.remedy
      when: { card.children.marked: { kind: working } }
    - key: child-waiting
      kind: waiting
      label: marker.child_waiting
      remedy: marker.child_waiting.remedy
      when: { card.children.marked: { kind: waiting } }
    - key: unmanaged
      kind: chip
      label: marker.unmanaged
      remedy: marker.unmanaged.remedy
      when: { card.held: {} }
