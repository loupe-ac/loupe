key: simple
version: 9
defaultType: feature
epicBranch: 'epic/{number}'
types:
    - { key: feature, label: board.card.type.feature, tone: lime }
    - { key: bug, label: board.card.type.bug, tone: amber }
    - { key: security, label: board.card.type.security, tone: red }
    - { key: tooling, label: board.card.type.tooling, tone: neutral }
    - { key: docs, label: board.card.type.docs, tone: green }
    - { key: idea, label: board.card.type.idea, tone: purple }
    - { key: epic, label: board.card.type.epic, tone: blue, capabilities: [children, lane] }
slots: []
manualMoves:
    - { from: '*', to: '*' }
backoffMinutes: [10, 60, 360]
workTimeoutMinutes: 120
facts:
    pr-reviewable:
        all:
            - pr.open: {}
            - not: { pr.draft: {} }
            - pr.checks_passed: {}
            - not: { pr.conflicting: {} }
            - not: { pr.changes_requested: {} }
    pr-waits-for-approval:
        all:
            - fact.pr-reviewable: {}
            - pr.checks_on_head: {}
            - pr.can_merge: {}
            - pr.base_is_default: {}
            - not: { pr.approval_covers_head: { min: 1 } }
            - not: { card.run.worker_active: {} }
rules:
    - id: merged
      when:
          all:
              - not: { card.in_slot: { slot: '@terminal' } }
              - card.pr.all_finished_one_merged: {}
              - card.children.finished: {}
      then: { move: { to: '@terminal', outcome: merged } }

    - id: teardown
      slot: '@terminal'
      when: { all: [] }
      then:
          request:
              kind: teardown
              onTimeout: expire

inbox: [waits-for-approval, run-needs-you, paused]
markers:
    - key: paused
      kind: stuck
      label: marker.paused
      remedy: marker.paused.remedy
      when:
          all:
              - card.paused: {}
              - not: { card.inbox.open_question: { blocking: true } }
              - not: { card.run.asking: {} }
    - key: run-stopped
      kind: stuck
      label: marker.run_stopped
      remedy: marker.run_stopped.remedy
      when:
          all:
              - card.run.stopped: {}
              - not: { card.run.needs_person: {} }
              - not:
                    any:
                        - card.run.work_active: {}
                        - card.run.worker_active: {}
                        - card.inbox.open_question: { blocking: true }
    - key: run-needs-you
      kind: stuck
      label: marker.run_needs_you
      remedy: marker.run_needs_you.remedy
      when:
          all:
              - card.run.needs_person: {}
              - not: { card.run.asking: {} }
    - key: checks-failed
      kind: stuck
      label: marker.checks_failed
      remedy: marker.checks_failed.remedy
      when:
          all:
              - pr.open: {}
              - pr.checks_failed: {}
              - not:
                    any:
                        - card.run.work_active: { kind: fix }
                        - card.run.worker_active: { kind: fix }
                        - card.run.work_active: { kind: repair }
                        - card.run.worker_active: { kind: repair }
    - key: conflicting
      kind: stuck
      label: marker.conflicting
      remedy: marker.conflicting.remedy
      when:
          all:
              - pr.open: {}
              - pr.conflicting: {}
              - not:
                    any:
                        - card.run.work_active: { kind: fix }
                        - card.run.worker_active: { kind: fix }
                        - card.run.work_active: { kind: repair }
                        - card.run.worker_active: { kind: repair }
    - key: ready-not-merged
      kind: stuck
      label: marker.ready_not_merged
      remedy: marker.ready_not_merged.remedy
      when:
          all:
              - pr.ready_for: {}
              - not:
                    any:
                        - card.run.work_active: { kind: merge }
                        - card.run.worker_active: { kind: merge }
    - key: waits-for-approval
      kind: needs-you
      label: marker.waits_for_approval
      remedy: marker.waits_for_approval.remedy
      when: { fact.pr-waits-for-approval: {} }
    - key: open-question
      kind: needs-you
      label: marker.open_question
      remedy: marker.open_question.remedy
      when: { card.inbox.open_question: { blocking: true } }
    - key: session-open
      kind: working
      label: marker.session_open
      remedy: marker.session_open.remedy
      when: { card.run.session_open: {} }
    - key: run-open
      kind: working
      label: marker.run_open
      remedy: marker.run_open.remedy
      when: { card.run.worker_active: {} }
    - key: no-capable-bridge
      kind: stuck
      label: marker.no_capable_bridge
      remedy: marker.no_capable_bridge.remedy
      link: agents
      when: { card.run.work_no_capable_taker: {} }
    - key: no-bridge-online
      kind: stuck
      label: marker.no_bridge_online
      remedy: marker.no_bridge_online.remedy
      link: agents
      when:
          all:
              - card.run.work_no_taker: {}
              - not: { card.run.work_no_capable_taker: {} }
    - key: bridge-paused
      kind: waiting
      label: marker.bridge_paused
      remedy: marker.bridge_paused.remedy
      link: agents
      when: { card.run.work_taker_paused: {} }
    - key: work-requested
      kind: waiting
      label: marker.work_requested
      remedy: marker.work_requested.remedy
      when:
          all:
              - card.run.work_active: {}
              - not: { card.run.work_no_taker: {} }
              - not: { card.run.work_taker_paused: {} }
    - key: forge-request-pending
      kind: working
      label: marker.forge_request_pending
      remedy: marker.forge_request_pending.remedy
      when: { pr.forge_request_pending: {} }
    - key: held-by-blocker
      kind: waiting
      label: marker.held_by_blocker
      remedy: marker.held_by_blocker.remedy
      when: { card.rule.held_by_blocker: {} }
    - key: waits-for-parent-card
      kind: waiting
      label: marker.waits_for_parent_card
      remedy: marker.waits_for_parent_card.remedy
      when: { pr.stack_parent: { parent: known } }
    - key: waits-for-parent-branch
      kind: waiting
      label: marker.waits_for_parent_branch
      remedy: marker.waits_for_parent_branch.remedy
      when: { pr.stack_parent: { parent: unknown } }
    - key: waiting-on-checks
      kind: waiting
      label: marker.waiting_on_checks
      remedy: marker.waiting_on_checks.remedy
      when: { pr.checks_pending: {} }
    - key: child-stuck
      kind: stuck
      label: marker.child_stuck
      remedy: marker.child_stuck.remedy
      when: { card.children.marked: { kind: stuck } }
    - key: child-needs-you
      kind: needs-you
      label: marker.child_needs_you
      remedy: marker.child_needs_you.remedy
      when: { card.children.marked: { kind: needs-you } }
    - key: child-working
      kind: working
      label: marker.child_working
      remedy: marker.child_working.remedy
      when: { card.children.marked: { kind: working } }
    - key: child-waiting
      kind: waiting
      label: marker.child_waiting
      remedy: marker.child_waiting.remedy
      when: { card.children.marked: { kind: waiting } }
    - key: unmanaged
      kind: chip
      label: marker.unmanaged
      remedy: marker.unmanaged.remedy
      when: { card.held: {} }
