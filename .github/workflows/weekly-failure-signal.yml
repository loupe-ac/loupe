name: Weekly failure signal

# Puts one to-do in the Loupe inbox of the owner when a weekly run is red. The
# dedupe key keeps a run that stays red from adding an item each week. A
# fork run gets no secrets, and this workflow runs only by workflow_call.
on:
  workflow_call:
    inputs:
      workflow:
        description: The name of the calling workflow.
        required: true
        type: string
      project:
        description: The id of the Loupe project.
        required: true
        type: string
      title:
        description: The title of the to-do. Empty means the weekly run title.
        required: false
        default: ''
        type: string
      body:
        description: Lines to put before the run link in the to-do body.
        required: false
        default: ''
        type: string
    secrets:
      LOUPE_API_TOKEN:
        required: true

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the inbox to-do
        env:
          LOUPE_API_TOKEN: ${{ secrets.LOUPE_API_TOKEN }}
          PROJECT: ${{ inputs.project }}
          WORKFLOW: ${{ inputs.workflow }}
          TITLE: ${{ inputs.title }}
          DETAIL: ${{ inputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IDEMPOTENCY_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          [ -n "$PROJECT" ] || { echo '::error::The repository variable LOUPE_PROJECT is empty.'; exit 1; }
          [ -n "$TITLE" ] || TITLE="Weekly run failed: $WORKFLOW"
          BODY="The run failed on $(date -u +%F): $RUN_URL"
          [ -z "$DETAIL" ] || BODY="$DETAIL"$'\n\n'"$BODY"
          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg key "weekly-failure:$WORKFLOW" \
            '{kind: "todo", title: $title, body: $body, dedupeKey: $key}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://app.loupe.ac/api/v1/projects/$PROJECT/inbox/items" \
            -H "Authorization: Bearer $LOUPE_API_TOKEN" \
            -H "Idempotency-Key: $IDEMPOTENCY_KEY" \
            -H 'Content-Type: application/json' \
            -d "$payload"
