name: CLI Homebrew

# Updates the formula in loupe-ac/homebrew-tap for a published, signed CLI
# release. `just sign-release` starts it on main after it publishes the
# release. The workflow file, release_keys and the tap scripts all come from
# main, never from the release tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as cli/v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  homebrew:
    runs-on: ubuntu-latest
    # The environment admits only the branch main, so a run elsewhere gets no tap token.
    environment: homebrew
    steps:
      - name: Check the ref and the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::This workflow runs only on main, not on $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^cli/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a cli/vX.Y.Z tag."
            exit 1
          fi
      - name: Check the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set in the homebrew environment."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            cli/scripts
            cli/internal/update/release_keys
          persist-credentials: false
      - name: Download the checksums and the signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)
          if [ "$draft" != false ]; then
            echo "::error::$TAG is not a published release."
            exit 1
          fi
          gh release download "$TAG" --repo "$REPO" --pattern checksums.txt --pattern checksums.txt.sig --dir "$RUNNER_TEMP"
      - name: Verify the signature
        run: |
          ssh-keygen -Y verify -f cli/internal/update/release_keys -I loupe-release -n loupe-release \
            -s "$RUNNER_TEMP/checksums.txt.sig" < "$RUNNER_TEMP/checksums.txt"
      - name: Update the formula in the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#cli/v}"
          tap="$RUNNER_TEMP/tap"
          # The tap is public, so the clone needs no token and .git/config never holds one.
          git clone --depth 1 https://github.com/loupe-ac/homebrew-tap.git "$tap"
          status=0
          sh cli/scripts/homebrew-publishable.sh "$version" "$tap/Formula/loupe.rb" || status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          if [ "$status" != 0 ]; then exit "$status"; fi
          mkdir -p "$tap/Formula"
          sh cli/scripts/homebrew-formula.sh "$version" "$RUNNER_TEMP/checksums.txt" > "$tap/Formula/loupe.rb"
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd "$tap"
          git add Formula/loupe.rb
          if git diff --cached --quiet; then
            echo "The formula already describes loupe $version."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "loupe $version"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD
