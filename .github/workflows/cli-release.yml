name: CLI release

# The CLI has its own version track, with tags such as `cli/v1.0.0`. GoReleaser
# OSS reads no tag prefix, so it only builds, and `gh` publishes the release.
on:
  push:
    tags: ['cli/v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#cli/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a cli/vX.Y.Z tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # With no signing secret at all, the release ships without the Live review app. Some but not all is an error.
  signing:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check the signing secrets
        id: check
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 5 ]; then
            echo "::warning::No signing secret is set, so this release ships without the Live review app."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in "${missing[@]}"; do
            echo "::error::$name is not set. Add the secret to sign and notarise the Live review app."
          done
          [ "${#missing[@]}" -eq 0 ] || exit 1
          echo "ready=true" >> "$GITHUB_OUTPUT"

  # Builds, signs and notarises the Live review app. The release job puts it in the darwin archives.
  panel:
    needs: [version, signing]
    if: needs.signing.outputs.ready == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Name the temporary files
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/panel-signing.keychain-db" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Test the panel
        working-directory: cli/macos/LiveReview
        run: swift test
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $existing
      - name: Find the signing identity
        id: identity
        run: |
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Build and sign the app
        env:
          LIVE_REVIEW_SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          LIVE_REVIEW_VERSION: ${{ needs.version.outputs.version }}
        run: sh cli/macos/LiveReview/Scripts/bundle.sh "$RUNNER_TEMP/panel"
      - name: Notarise and staple the app
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        working-directory: ${{ runner.temp }}/panel
        run: |
          umask 077
          printf '%s' "$APPLE_NOTARY_KEY" > "$NOTARY_KEY_FILE"
          ditto -c -k --keepParent 'Live review.app' notarise.zip
          xcrun notarytool submit notarise.zip --wait \
            --key "$NOTARY_KEY_FILE" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
            | tee notarytool.log
          if ! grep -q 'status: Accepted' notarytool.log; then
            echo "::error::Apple did not accept the Live review app for notarisation."
            exit 1
          fi
          xcrun stapler staple 'Live review.app'
      - name: Verify the app
        working-directory: ${{ runner.temp }}/panel
        run: |
          codesign --verify --deep --strict --verbose=2 'Live review.app'
          xcrun stapler validate 'Live review.app'
      # A zip artifact loses file modes, so the app travels as a tar.
      - name: Pack the app
        working-directory: ${{ runner.temp }}/panel
        run: COPYFILE_DISABLE=1 tar -cf panel.tar 'Live review.app'
      - uses: actions/upload-artifact@v7
        with:
          name: panel
          path: ${{ runner.temp }}/panel/panel.tar
          if-no-files-found: error
      - name: Delete the keychain and the notary key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$NOTARY_KEY_FILE" "$RUNNER_TEMP/certificate.p12"

  release:
    needs: [version, signing, panel]
    if: ${{ !cancelled() && needs.signing.result == 'success' && (needs.panel.result == 'success' || needs.panel.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@v8
        if: needs.panel.result == 'success'
        with:
          name: panel
          path: ${{ runner.temp }}/panel-artifact
      - name: Unpack the app
        if: needs.panel.result == 'success'
        run: |
          mkdir -p cli/panel
          tar -xf "$RUNNER_TEMP/panel-artifact/panel.tar" -C cli/panel
          if [ ! -f 'cli/panel/Live review.app/Contents/MacOS/LiveReview' ]; then
            echo "::error::The panel artifact holds no Live review.app executable."
            exit 1
          fi
      # GoReleaser fails on a files entry that matches nothing. The updater reads an archive with no app.
      - name: Leave the app out of the archives
        if: needs.panel.result != 'success'
        run: yq -i 'del(.archives[].files[] | select(.src == "panel/Live review.app"))' cli/.goreleaser.yaml
      - name: Vet and test
        working-directory: cli
        run: go vet ./... && go test ./...
      # validate refuses a GORELEASER_CURRENT_TAG that git does not hold.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish,validate
          workdir: cli
        env:
          GORELEASER_CURRENT_TAG: v${{ needs.version.outputs.version }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes start at the next lower CLI tag, never at a server tag.
          previous=$(git tag --list 'cli/v*' --sort=-v:refname \
            | awk -v cur="$GITHUB_REF_NAME" 'found { print; exit } $0 == cur { found = 1 }')
          notes=(--notes "The first release of the loupe CLI on its own version track.")
          if [ -n "$previous" ]; then notes=(--generate-notes --notes-start-tag "$previous"); fi
          # The server's update check reads /releases/latest, so "Latest" stays a server release.
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "loupe CLI ${GITHUB_REF_NAME#cli/}" "${notes[@]}" \
            cli/dist/*.tar.gz cli/dist/checksums.txt

  # The tap token writes to ubermuda/homebrew-tap only, so this job needs no write access here.
  homebrew:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Create ubermuda/homebrew-tap and add the secret."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          sparse-checkout: cli/scripts
          persist-credentials: false
      - name: Download the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$REPO" -p checksums.txt -D "$RUNNER_TEMP"
      - name: Update the formula in the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cli/v}"
          tap="$RUNNER_TEMP/tap"
          # The tap is public, so the clone needs no token and .git/config never holds one.
          git clone --depth 1 https://github.com/ubermuda/homebrew-tap.git "$tap"
          status=0
          sh cli/scripts/homebrew-publishable.sh "$version" "$tap/Formula/loupe.rb" || status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          if [ "$status" != 0 ]; then exit "$status"; fi
          mkdir -p "$tap/Formula"
          sh cli/scripts/homebrew-formula.sh "$version" "$RUNNER_TEMP/checksums.txt" > "$tap/Formula/loupe.rb"
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd "$tap"
          git add Formula/loupe.rb
          if git diff --cached --quiet; then
            echo "The formula already describes loupe $version."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "loupe $version"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD
