name: Audit

# Not a pull request check. An advisory on a dependency a branch does not touch
# should not block that branch. The run on main and the daily run find it, and
# the failure signal puts one to-do in the Loupe inbox.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lines: ${{ steps.audit.outputs.lines }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: 'true'
          docker: 'true'
      - name: Run the audit
        id: audit
        shell: bash
        run: |
          set +e
          just audit 2>&1 | tee var/audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo 'lines<<AUDIT_LINES_EOF'
              grep -iE 'advisory|severity|CVE-|GHSA-|vulnerab|^Package:|^Title:|^Link:' var/audit.log | head -c 3000
              echo
              echo 'AUDIT_LINES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

  failure-signal:
    needs: [audit]
    if: failure()
    uses: ./.github/workflows/weekly-failure-signal.yml
    with:
      workflow: audit
      project: ${{ vars.LOUPE_PROJECT }}
      title: Audit failed
      body: ${{ needs.audit.outputs.lines }}
    secrets:
      LOUPE_API_TOKEN: ${{ secrets.LOUPE_API_TOKEN }}
