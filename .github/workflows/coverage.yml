name: Coverage report

on:
  schedule:
    # Mondays, 03:00 UTC. A schedule fires from the default branch only, so this
    # first runs after the branch merges. Use workflow_dispatch before then.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

# A job key is the check-run name GitHub matches required checks against, and the
# workflow display name is not part of that match. Never reuse a job key from
# ci.yml: lint, cs-check, phpstan, arkitect, gamache, audit, phpunit, cli-test,
# e2e. A weekly job named `phpunit` would satisfy the required `phpunit` while
# CI's own never ran.
#
# Each suite runs on separate runners and writes to its own tree, so no two jobs
# share a database. Each long test step has its own timeout below the job
# timeout. GitHub cancels a job at its job timeout and skips every later step,
# also one with `if: always()`. A step timeout only fails that step, so the
# uploads and the failure-signal job still run.
jobs:
  # Four shards, each a quarter of the test files. One run of the whole suite
  # outgrew its step limit, and the suite grows each week. A shard takes every
  # fourth file of a sorted list (bin/coverage-shard.php), so a new test file
  # joins a shard by itself.
  phpunit-coverage:
    name: phpunit-coverage-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner conditions
        run: |
          nproc
          date -u +'stack build starts %H:%M:%S UTC'

      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      - run: date -u +'stack build ends %H:%M:%S UTC'

      # Writes var/phpunit-coverage. Never var/coverage, which the e2e legs
      # below delete at the start of their own run. ParaTest runs four workers,
      # each restarting after 100 test files, so memory stays bounded per process.
      - run: just phpunit-coverage-shard ${{ matrix.shard }} 4
        timeout-minutes: 100

      - name: Raw coverage and test log of this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-coverage-shard-${{ matrix.shard }}
          path: |
            var/phpunit-coverage/shard-${{ matrix.shard }}.cov
            var/phpunit-coverage/junit-${{ matrix.shard }}.xml
          retention-days: 2
          if-no-files-found: error

  # Runs only after all four shards are green. Infection counts a failing test
  # as a killed mutant, and a missing shard would leave its tests out of the
  # merged log. A job key that collides with no key of ci.yml.
  phpunit-coverage-merge:
    needs: phpunit-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: phpunit-coverage-shard-*
          path: var/phpunit-coverage
          merge-multiple: true

      - run: just phpunit-coverage-merge

      - name: Coverage summary
        if: always()
        run: head -12 var/phpunit-coverage/summary.txt || echo "no summary written"

      - name: PHPUnit coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-coverage
          path: |
            var/phpunit-coverage/summary.txt
            var/phpunit-coverage/clover.xml
            var/phpunit-coverage/html
          if-no-files-found: warn

      # What Infection reads, so the mutation jobs skip their own first test run.
      - name: Infection input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-coverage-data
          path: |
            var/phpunit-coverage/coverage-xml
            var/phpunit-coverage/junit.xml
          retention-days: 2
          if-no-files-found: error

  # Four shards, each a quarter of the files of src/. A job key that collides
  # with no key of ci.yml.
  infection:
    name: infection-${{ matrix.shard }}
    needs: phpunit-coverage-merge
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A timing is only readable beside the machine that produced it, and the
      # thread count in infection.json5 is chosen against a core count.
      - name: Runner conditions
        run: |
          nproc
          free -g | head -2

      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phpunit-coverage-data
          path: var/phpunit-coverage

      # The paths in the coverage XML match because every job mounts the
      # checkout at /var/www/html.
      - run: just mutation-shard ${{ matrix.shard }} 4
        timeout-minutes: 110

      - name: Mutation log of this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-shard-${{ matrix.shard }}
          path: |
            var/infection/infection.log
            var/infection/summary.log
          retention-days: 2
          if-no-files-found: error

  # Adds the four shard summaries into the one report that `just ci-report
  # mutation` reads.
  infection-report:
    needs: infection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: infection-shard-*
          path: var/infection-shards

      - run: php bin/merge-infection-logs.php var/infection-report var/infection-shards/infection-shard-*

      - run: cat var/infection-report/summary.log

      - name: Mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-report
          path: |
            var/infection-report/infection.log
            var/infection-report/summary.log
          if-no-files-found: error

  # The leg names and splits match the e2e-shard matrix of ci.yml. The job key
  # differs from every key of ci.yml.
  e2e-coverage-leg:
    name: e2e-coverage-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            shard: chromium
            split: '--shard=1/6'
          - name: chromium-2
            shard: chromium
            split: '--shard=2/6'
          - name: chromium-3
            shard: chromium
            split: '--shard=3/6'
          - name: chromium-4
            shard: chromium
            split: '--shard=4/6'
          - name: chromium-5
            shard: chromium
            split: '--shard=5/6'
          - name: chromium-6
            shard: chromium
            split: '--shard=6/6'
          - name: rest
            shard: rest
            split: ''
          - name: global-flags
            shard: global-flags
            split: ''
    # ci.yml pins XDEBUG_MODE to off, because a normal CI run reads no coverage
    # and pays double for it. These legs are the ones that do read it.
    env:
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/e2e-stack

      # A silent 'off' collects nothing and still produces an empty report,
      # which reads as zero coverage. Read getenv, not ini_get: xdebug honours
      # the environment variable and ini_get keeps reporting the ini file.
      - name: Confirm the coverage driver is live
        run: |
          mode=$(docker compose exec -T php-fpm php -r 'echo getenv("XDEBUG_MODE");')
          echo "XDEBUG_MODE=$mode"
          case "$mode" in *coverage*) ;; *) echo 'coverage is off; the report would be empty'; exit 1 ;; esac

      - run: date -u +'e2e run starts %H:%M:%S UTC'

      # The recipe merges the local coverage before it returns the Playwright
      # status, so a red leg still leaves its raw files in var/coverage.
      - run: just e2e-coverage ${{ matrix.split }}
        timeout-minutes: 100
        env:
          E2E_BASE_URL: http://localhost
          MAILPIT_URL: http://localhost:8025
          E2E_SHARD: ${{ matrix.shard }}

      # The suffix is matrix.name. The six chromium legs share one shard value,
      # and upload-artifact refuses a second upload to the same name in a run.
      - name: Raw coverage of this leg
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage-raw-${{ matrix.name }}
          path: var/coverage/*.cov
          retention-days: 2
          if-no-files-found: error

      - name: Application errors
        if: failure()
        run: docker compose exec -T php-fpm sh -c 'grep -hE "CRITICAL|ERROR" var/log/dev.log | tail -n 40'

      - name: Web server log
        if: failure()
        run: docker compose logs --no-log-prefix nginx > var/e2e-nginx.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: nginx-log-${{ matrix.name }}
          path: var/e2e-nginx.log
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright-report
          retention-days: 7

  # Runs after a red or timed-out leg too, so the report holds the coverage of
  # every test that ran. A cancelled run skips it on purpose. The workflow stays
  # red through the failed leg.
  e2e-coverage:
    needs: e2e-coverage-leg
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          docker: 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-coverage-raw-*
          path: var/raw
          merge-multiple: false

      # A missing leg makes the report partial, so the step fails after it
      # merges and uploads what the other legs sent.
      - name: Merge the raw coverage
        run: |
          expected='chromium chromium-2 chromium-3 chromium-4 chromium-5 chromium-6 rest global-flags'
          found=0
          missing=0
          mkdir -p var/coverage
          for leg in $expected; do
            if compgen -G "var/raw/e2e-coverage-raw-$leg/*.cov" > /dev/null; then
              found=$((found + 1))
              cp var/raw/e2e-coverage-raw-$leg/*.cov var/coverage/
            else
              missing=$((missing + 1))
              echo "::error::leg $leg uploaded no raw coverage"
              echo "missing: $leg" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$found" -gt 0 ] || { echo 'no leg uploaded raw coverage'; exit 1; }
          docker compose exec -T php-fpm php -d memory_limit=2G vendor/bin/phpcov merge var/coverage --html var/coverage/html --clover var/coverage/clover.xml --text var/coverage/summary.txt
          [ "$missing" -eq 0 ] || { echo "$missing leg(s) uploaded no raw coverage; the report is partial"; exit 1; }

      - name: Coverage summary
        if: always()
        run: head -12 var/coverage/summary.txt || echo 'no summary written'

      - name: e2e coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: |
            var/coverage/summary.txt
            var/coverage/clover.xml
            var/coverage/html
          if-no-files-found: warn

  failure-signal:
    needs: [phpunit-coverage, phpunit-coverage-merge, infection, infection-report, e2e-coverage-leg, e2e-coverage]
    if: failure()
    uses: ./.github/workflows/weekly-failure-signal.yml
    with:
      workflow: ${{ github.workflow }}
      project: ${{ vars.LOUPE_PROJECT }}
    secrets:
      LOUPE_API_TOKEN: ${{ secrets.LOUPE_API_TOKEN }}
