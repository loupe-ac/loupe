name: Skills release

# Each skill package has its own version track, with tags such as
# `skills/loupe/v1.2.0`. A person runs this workflow after the app is live, so
# a tool reaches production before the skill that names it. The workflow
# attests checksums.txt and creates a draft release. `just sign-release` checks
# that attestation, signs checksums.txt with the release key, and publishes the
# draft.
on:
  workflow_dispatch:
    inputs:
      package:
        description: The package folder under plugins/
        required: true
        type: choice
        options: [loupe, loupe-lifecycle]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          version=$(jq -r .version "plugins/$PACKAGE/.claude-plugin/plugin.json")
          codex=$(jq -r .version "plugins/$PACKAGE/.codex-plugin/plugin.json")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is not a version such as 1.2.3."
            exit 1
          fi
          if [ "$version" != "$codex" ]; then
            echo "::error::The Claude Code manifest says $version and the Codex manifest says $codex."
            exit 1
          fi
          tag="skills/$PACKAGE/v$version"
          sh cli/scripts/skills-tag-check.sh "$PACKAGE" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # A draft has no tag, so skills-tag-check.sh cannot see it.
      - name: Refuse a version that has a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft) | .tag_name')
          if printf '%s\n' "$drafts" | grep -Fxq "$TAG"; then
            echo "::error::$TAG already has a draft release. Publish or delete the draft first."
            exit 1
          fi
      - name: Pack the package
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          archive="dist/${PACKAGE}_${VERSION}.tar.gz"
          # The folder is the root of the archive, with loupe-package.json inside it.
          tar -czf "$archive" -C "plugins/$PACKAGE" .
          (cd dist && sha256sum "${PACKAGE}_${VERSION}.tar.gz" > checksums.txt)
      - name: Attest the checksums
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/checksums.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The server's update check reads /releases/latest, so "Latest" stays a server release.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --latest=false \
            --title "$PACKAGE $VERSION" --notes "The $PACKAGE skill package, version $VERSION." \
            dist/*.tar.gz dist/checksums.txt
