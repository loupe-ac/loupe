# Directives that the app server and the site server share. nginx.conf includes
# this file in the app server, and nginx-config.sh includes it in the site server.
add_header Strict-Transport-Security $hsts_header always;
index index.php index.html;
# nginx defaults to 1m, which refuses an artifact push of a few MiB.
client_max_body_size 8m;
# Log to the container's streams, not to files: files inside the container
# never reach `docker logs` and grow unbounded in the writable layer.
error_log  /dev/stderr;
access_log /dev/stdout;
root /var/www/html/public;

# Compress text responses (HTML is always compressed when gzip is on).
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml
    application/json application/javascript text/javascript
    application/xml application/rss+xml image/svg+xml
    application/ld+json application/manifest+json
    font/ttf font/otf;

# Content-hashed AssetMapper output is immutable — cache it hard.
# In prod the compiled file exists on disk (served static with these headers);
# in dev it doesn't, so fall through to index.php (Symfony serves it).
location /assets/ {
    try_files $uri /index.php?$query_string;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security $hsts_header always;
    access_log off;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS $php_https if_not_empty;
}
