; A pushed artifact version is one multipart request. The default flags allow
; 5 MiB across 50 files, and the defaults here (2M file, 8M body, 20 files)
; refuse it before the handler runs. client_max_body_size in nginx.conf stays
; below post_max_size, so nginx answers first with a clear 413.
upload_max_filesize=16M
post_max_size=16M
max_file_uploads=100
