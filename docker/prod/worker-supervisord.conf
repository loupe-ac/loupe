; Supervisor for the production worker container. The web container uses
; docker/prod/supervisord.conf and must keep running php-fpm and nginx alone.
; Two consumers run side by side so the low-priority queue never starves behind
; a constant stream of event-driven jobs. scheduler_default comes before jobs
; so a deep jobs backlog does not delay schedule ticks. su-exec drops to
; www-data so exports written 0600 stay readable to php-fpm.
[supervisord]
nodaemon=true
loglevel=info
logfile_maxbytes=0

[program:worker]
command          = /sbin/su-exec www-data php bin/console messenger:consume scheduler_default interactive card_eval jobs --time-limit=3600 --memory-limit=128M
directory        = /var/www/html
autorestart      = true
stopwaitsecs     = 30
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0

[program:worker-low]
command          = /sbin/su-exec www-data php bin/console messenger:consume card_sweep --time-limit=3600 --memory-limit=128M
directory        = /var/www/html
autorestart      = true
stopwaitsecs     = 30
stdout_logfile   = /dev/stdout
stderr_logfile   = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
stdout_logfile_backups  = 0
stderr_logfile_backups  = 0
