version: 2

project_name: loupe

builds:
  - id: loupe-darwin
    main: .
    binary: loupe
    # Static binaries: the keychain backends this CLI uses are pure Go, so
    # nothing here needs libc.
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    # goreleaser reads git itself, so `loupe version` needs no shell here.
    ldflags: &ldflags
      - -s -w
      - "-X github.com/loupe-ac/loupe/cli/cmd.commit={{ .FullCommit }}"
      - "-X github.com/loupe-ac/loupe/cli/cmd.dirty={{ .IsGitDirty }}"
      - "-X github.com/loupe-ac/loupe/cli/cmd.version={{ .Version }}"
  - id: loupe-linux
    main: .
    binary: loupe
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: *ldflags

# Both archives share one name template. Only the darwin archive carries the
# Live review app, which the cli-release workflow builds into cli/panel/.
archives:
  - id: loupe-darwin
    ids: [loupe-darwin]
    formats: [tar.gz]
    name_template: "loupe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Setting files turns off the default README, so list it again.
    files:
      - README*
      - src: "panel/Live review.app"
        dst: "Live review.app"
  - id: loupe-linux
    ids: [loupe-linux]
    formats: [tar.gz]
    name_template: "loupe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# A cli/vX.Y.Z tag is no semver, so a snapshot must not read .Version.
snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"

# The cli-release workflow publishes with `gh`, which writes the notes.
changelog:
  disable: true
