class LoupeView {
    constructor(props) {

    setState(patch) {

            return;

    }

    static mount(Component, render, props, events, links) {
        const view = new Component(props);
        view._render = render;

        view._draw();

            document.body.addEventListener(
                name,
                (e) => view._dispatch(e),
                true,
            );
        });

            view.componentDidMount();

        return view;
    }

    static helpers(links) {
        const map = links || {};
        const escape = (value, quotes) => {
            let s = value === null || value === undefined ? '' : String(value);
            s = s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

                ? s.replace(/"/g, '&quot;').replace(/'/g, '&#39;')
                : s;

        return {
            g(scope, path) {
                let cur = scope;
                for (const key of String(path).split('.')) {

        const olds = Array.from(body.childNodes).filter((n) => n !== keep);
        LoupeView._morph(
            body,
            olds,
            Array.from(template.content.childNodes),
            keep,
        );
    }

    _dispatch(e) {
        const attr = 'data-on-' + e.type;
        let el = e.target;
        while (el && el.nodeType === 1) {
            if (el.hasAttribute(attr)) {
                const fn = this.handlers[Number(el.getAttribute(attr))];
                if (typeof fn === 'function') {
                    try {
                        fn.call(this, e);
                    } catch (err) {
                        console.error(err);
                    }
                }
            }
            if (!e.bubbles || e.cancelBubble || el === document.body) {
                break;
            }
            el = el.parentNode;
        }

    static _morph(parent, olds, news, before) {
        let j = 0;
        for (const n of news) {
            let k = j;
            while (k < olds.length && !LoupeView._same(olds[k], n)) {
                k++;
            }
            if (k === olds.length) {
                parent.insertBefore(n, olds[j] || before || null);
                continue;
            }
            for (; j < k; j++) {
                parent.removeChild(olds[j]);
            }
            LoupeView._update(olds[j], n);
            j++;
        }
        for (; j < olds.length; j++) {
            parent.removeChild(olds[j]);
        }
    }

    static _same(o, n) {
        if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) {
            return false;
        }

        return (
            o.nodeType !== 1 ||
            (o.getAttribute('id') === n.getAttribute('id') &&
                o.getAttribute('name') === n.getAttribute('name'))
        );
    }

    static _update(o, n) {
        if (o.nodeType !== 1) {
            if (o.data !== n.data) {
                o.data = n.data;
            }

            return;
        }
        LoupeView._syncAttributes(o, n);
        if (o.nodeName === 'TEXTAREA') {
            LoupeView._setValue(o, n.value);

            return;
        }
        LoupeView._morph(
            o,
            Array.from(o.childNodes),
            Array.from(n.childNodes),
            null,
        );
        LoupeView._syncProperties(o, n);
    }

    static _syncAttributes(o, n) {
        for (const a of Array.from(o.attributes)) {
            if (!n.hasAttribute(a.name)) {
                o.removeAttribute(a.name);
            }
        }
        for (const a of Array.from(n.attributes)) {
            if (o.getAttribute(a.name) !== a.value) {
                o.setAttribute(a.name, a.value);
            }
        }
    }

    static _syncProperties(o, n) {
        const name = o.nodeName;
        if (name === 'OPTION') {
            if (n.hasAttribute('selected') && !o.selected) {
                o.selected = true;
            }

                if (n.hasAttribute('checked') !== o.checked) {
                    o.checked = n.hasAttribute('checked');
                }
            } else if (n.hasAttribute('value')) {
                LoupeView._setValue(o, n.getAttribute('value'));
            }
        }
    }

    static _setValue(o, value) {
        if (o.value === value) {
            return;
        }
        const focused = o === document.activeElement;
        let start = null;
        let end = null;
        if (focused) {
            try {
                start = o.selectionStart;
                end = o.selectionEnd;
            } catch (err) {
                start = null;
            }
        }
        o.value = value;
        if (focused && start !== null) {
            const max = o.value.length;
            try {
                o.setSelectionRange(Math.min(start, max), Math.min(end, max));
            } catch (err) {
                return;
            }
        }
    }
}


class Component extends LoupeView {

  items = [
    { id: 1, name: 'Apple', tags: ['red', 'sweet'] },
    { id: 2, name: 'Banana', tags: ['yellow'] },
    { id: 3, name: 'Cherry', tags: [] },
  ];
  componentDidMount() {
    this.timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 1000);
  }
  renderVals() {
    const q = this.state.query.toLowerCase();
    const shown = this.items
      .filter(i => i.name.toLowerCase().indexOf(q) >= 0)
      .map(i => ({
        name: i.name,
        tags: i.tags,
        cls: this.state.done[i.id] ? 'done' : 'todo',
        toggle: () => this.setState(s => ({ done: Object.assign({}, s.done, { [i.id]: !s.done[i.id] }) })),
      }));
    return {
      title: this.props.label,
      query: this.state.query,
      onQuery: e => this.setState({ query: e.target.value }),
      count: this.state.count,
      onInc: () => this.setState(s => ({ count: s.count + 1 })),
      agreed: this.state.agreed,
      notAgreed: !this.state.agreed,
      onAgree: e => this.setState({ agreed: e.target.checked }),
      status: this.state.agreed ? 'Thanks' : 'Please agree',
      items: shown,
      empty: shown.length === 0,
      tick: this.state.tick,
      next: '#top',
      note: { __html: '<em>' + shown.length + ' shown</em>' },
    };
  }
}
