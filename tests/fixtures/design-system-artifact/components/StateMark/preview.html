<!-- @dsCard group="Core" width=700 height=150 subtitle="An icon that names what a card needs now, with its reason in an interactive tooltip." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 16px 18px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { StateMark } =
  dsFind('StateMark');

function Demo() {
  return (
    <div className="col">
      <div className="row">
        <StateMark kind="stuck" label="stuck">Why the card is stuck.</StateMark>
        <StateMark kind="needs-you" label="needs-you">Why the card is needs-you.</StateMark>
        <StateMark kind="working" label="working">Why the card is working.</StateMark>
        <StateMark kind="waiting" label="waiting">Why the card is waiting.</StateMark>
        <StateMark kind="chip" label="chip">Why the card is chip.</StateMark>
      </div>

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
