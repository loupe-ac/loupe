<!-- @dsCard group="Layout" width=700 height=320 subtitle="A master-detail page: a held header over a list pane beside a detail pane, each scrolling on its own." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 0; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { SplitView, ListRow } =
  dsFind('SplitView', 'ListRow');

function Demo() {
  return (
    <div className="col">

        <SplitView style={{ height: 240 }} list={<><ListRow href="#" title="Which format?" meta="Loupe, 5 minutes ago" /><ListRow href="#" title="Review the plan" meta="Loupe, 1 hour ago" current /></>} detail={<p style={{ margin: 0, padding: 12 }}>The ask you picked draws here.</p>} />


    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
