<!-- @dsCard group="Layout" width=700 height=200 subtitle="The heading row of a page: a title, an optional description and the actions beside them." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 0; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { PageHeader } =
  dsFind('PageHeader');

function Demo() {
  return (
    <div className="col">
        <PageHeader title="Documents" description="Every document of this project, newest first." actions={<div><button className="lp-btn" type="button">Filter</button> <button className="lp-btn lp-btn--primary" type="button">New document</button></div>} />
        <PageHeader variant="workshop" title="Workshop" />

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
