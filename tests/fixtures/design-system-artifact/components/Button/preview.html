<!-- @dsCard group="Core" width=700 height=330 subtitle="Any action or link that looks like a button." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 16px 18px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { Button } =
  dsFind('Button');

function Demo() {
  return (
    <div className="col">
      <div className="row">
        <Button variant="primary">primary</Button>
        <Button variant="inverse">inverse</Button>
        <Button variant="success">success</Button>
        <Button variant="danger">danger</Button>
        <Button variant="ghost">ghost</Button>
        <Button variant="danger-ghost">danger-ghost</Button>
        <Button variant="on-card">on-card</Button>
        <Button variant="open">open</Button>
      </div>
      <div className="chrome">
        <Button variant="outline">outline</Button>
      </div>
      <div className="row">
        <Button variant="icon" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></Button>
        <Button variant="ghost icon" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></Button>
        <Button variant="ghost icon compact" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></Button>
      </div>
      <div className="row">
        <Button size="sm">sm</Button>
        <Button size="lg">lg</Button>
        <Button disabled>disabled</Button>
        <Button href="#">link</Button>
      </div>

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
