<!-- @dsCard group="Layout" width=700 height=420 subtitle="A panel that slides in from the right edge, with a header, a body that scrolls and a footer." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 0; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { Drawer } =
  dsFind('Drawer');

function Demo() {
  return (
    <div className="col">

        <Drawer open style={{ position: 'static', width: '100%', maxWidth: 'none', height: 220 }} header={<h2 className="lp-drawer__title">Recent activity</h2>} footer={<span>Open the full list</span>}>
          <p style={{ margin: 0 }}>The body scrolls when its content is taller than the drawer.</p>
        </Drawer>


    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
