<!-- @dsCard group="Layout" width=900 height=520 subtitle="The page frame: a sidebar with the project switcher, a top bar with the breadcrumb, and the main column." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 0; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { AppShell } =
  dsFind('AppShell');

function Demo() {
  return (
    <div className="col">

        <AppShell projectName="Acme" active="board" crumbs={['Documents', 'Tech design']} meta="12 cards" userName="riley@example.com" counts={{ documents: 12, inbox: 2 }} projects={[{ name: 'Acme', documentCount: 12 }, { name: 'Globex', documentCount: 3 }]} features={{ inbox: true }} style={{ height: 460 }}>
          <p style={{ margin: 0, padding: 28 }}>A page goes here.</p>
        </AppShell>


    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
