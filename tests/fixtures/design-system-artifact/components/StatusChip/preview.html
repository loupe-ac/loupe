<!-- @dsCard group="Core" width=700 height=150 subtitle="A chip that names a state, with an optional reason in a tooltip." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { padding: 16px 18px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--chrome); border-radius: 6px; }
  .row > dialog[open] { position: static; margin: 0; }
  .row > .lp-tooltip { position: static; margin: 0; visibility: visible; opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-mount.js"></script>
<script type="text/babel">
const { StatusChip } =
  dsFind('StatusChip');

function Demo() {
  return (
    <div className="col">
      <div className="row">
        <StatusChip modifier="pending">pending</StatusChip>
        <StatusChip modifier="addressed">addressed</StatusChip>
        <StatusChip modifier="resolved">resolved</StatusChip>
        <StatusChip modifier="ok">ok</StatusChip>
        <StatusChip modifier="failed">failed</StatusChip>
        <StatusChip modifier="neutral">neutral</StatusChip>
      </div>
      <div className="row">
        <StatusChip modifier="ok" dot={false}>no dot</StatusChip>
        <StatusChip>default</StatusChip>
        <StatusChip modifier="failed" reason="A pull request waits for a merge.">with a reason</StatusChip>
      </div>

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
