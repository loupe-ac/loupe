name: amphetamine
os: [darwin]
events:
  start: [./hook, start]
  stop: [./hook, stop]
  busy: [./hook, busy]
  idle: [./hook, idle]
  tick: [./hook, tick]
settings:
  quiet_hours:
    type: string
    default: "23:00-06:00"
    description: The hours, as HH:MM-HH:MM, when the Mac stays awake only while the bridge is busy. Outside them it stays awake all the time. Empty keeps it awake only while busy.
