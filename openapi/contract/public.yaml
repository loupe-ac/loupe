openapi: 3.0.3
info:
  title: Loupe API v1
  version: 1.0.0
  description: |-
    The public HTTP API of Loupe. It covers projects, board columns, cards, documents and their review, site-review feedback, and artifacts.

    v1 is in beta for 3 months after the first release. Until then a breaking change may land with a changelog note. After that a breaking change makes /api/v2, and v1 keeps working for at least 6 months with `Deprecation` and `Sunset` headers.

    The server below is the hosted instance. A self-hosted instance uses its own host with the same paths.

    Every error on /api/v1 is `application/problem+json`, with `type`, `title`, `status` and `code`, and an optional `detail`. A validation refusal adds `errors`. An unknown path answers 404 `route_not_found`, and a known path with another method answers 405 `method_not_allowed`. A feature that a flag switches off answers 404 `route_not_found`.

    A list answers `{ items, next }` and a `Link` header with `rel="next"`. It has no totals and no page numbers. PATCH takes `application/json` with partial fields. This version has no ETag, no `If-Match`, no 304 and no 412.

    No route in this document is built yet. This document is the proposal.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: https://app.loupe.ac
  description: Hosted instance
security:
- bearerAuth: []
tags:
- name: Meta
  description: The routes that need no sign-in.
- name: Projects
  description: The projects a credential reaches.
- name: Columns
  description: The columns of a board, and its card types.
- name: Cards
  description: The cards of a board. There is no card delete.
- name: Documents
  description: Documents for human review. There is no document delete.
- name: Versions
  description: The versions of a document.
- name: Review
  description: Verdicts, decisions and comments on a document.
- name: Feedback
  description: Notes from the live-review widget.
- name: Artifacts
  description: Stored design artifacts. A flag gates them.
paths:
  /api/v1/openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Read this OpenAPI document
      tags:
      - Meta
      description: No sign-in is needed.
      security: []
      responses:
        '200':
          description: The public v1 specification, as JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: An OpenAPI 3.0.3 document.
        '405':
          $ref: '#/components/responses/E405MethodNotAllowedAnon'
        '429':
          $ref: '#/components/responses/E429RateLimitedAnon'
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List the projects this credential reaches
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/SortCreated'
      responses:
        '200':
          description: One page of projects.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/E400InvalidCursor'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404RouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
    post:
      operationId: createProject
      summary: Create a project
      tags:
      - Projects
      description: The credential must cover every project of its owner. The search language starts at the instance default.
        PATCH sets `description` and `searchLanguage`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: The new project.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotOwnerWideCredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404RouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '409':
          $ref: '#/components/responses/E409NameTakenIdempotencyKeyReusedIdempotencyInProgress'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422NameRequiredNameInvalidValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}:
    get:
      operationId: getProject
      summary: Read one project
      tags:
      - Projects
      parameters:
      - $ref: '#/components/parameters/Project'
      responses:
        '200':
          description: The project.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
    patch:
      operationId: updateProject
      summary: Change a project
      tags:
      - Projects
      description: A new name changes the slug, so a reference to the old slug, such as a bridge rule file, stops matching.
      parameters:
      - $ref: '#/components/parameters/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The project after the change.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '409':
          $ref: '#/components/responses/E409NameTakenSlugTaken'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/artifacts:
    get:
      operationId: listArtifacts
      summary: List the stored artifacts
      tags:
      - Artifacts
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/SortCreated'
      - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: One page of artifacts.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactList'
        '400':
          $ref: '#/components/responses/E400InvalidCursor'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
    post:
      operationId: createArtifact
      summary: Create an artifact with its first version
      tags:
      - Artifacts
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtifactCreateUpload'
            encoding:
              paths:
                style: form
                explode: true
              files:
                contentType: application/octet-stream
      responses:
        '201':
          description: The stored version.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactStored'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '409':
          $ref: '#/components/responses/E409IdempotencyKeyReusedIdempotencyInProgress'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/artifacts/{artifact}:
    get:
      operationId: getArtifact
      summary: Describe one artifact
      tags:
      - Artifacts
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Artifact'
      - $ref: '#/components/parameters/VersionNumberOptional'
      responses:
        '200':
          description: The artifact, its versions, and the files of one version.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundArtifactNotFoundArtifactVersionNotFoundAnd1More'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
    patch:
      operationId: updateArtifact
      summary: Archive or restore an artifact
      tags:
      - Artifacts
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Artifact'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpdate'
      responses:
        '200':
          description: The artifact after the change.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundArtifactNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/artifacts/{artifact}/files/{path}:
    get:
      operationId: readArtifactFile
      summary: Read one file of an artifact
      tags:
      - Artifacts
      description: The answer is the file itself, with its stored content type.
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Artifact'
      - $ref: '#/components/parameters/ArtifactFilePath'
      - $ref: '#/components/parameters/VersionNumberOptional'
      responses:
        '200':
          description: The bytes of the file.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundArtifactNotFoundArtifactVersionNotFoundAnd2More'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/artifacts/{artifact}/versions:
    post:
      operationId: createArtifactVersion
      summary: Store a new version of an artifact
      tags:
      - Artifacts
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Artifact'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtifactVersionUpload'
            encoding:
              paths:
                style: form
                explode: true
              files:
                contentType: application/octet-stream
      responses:
        '201':
          description: The stored version.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactStored'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundArtifactNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '409':
          $ref: '#/components/responses/E409IdempotencyKeyReusedIdempotencyInProgress'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/board/columns:
    get:
      operationId: listBoardColumns
      summary: List the columns and card types of the board
      tags:
      - Columns
      description: The columns read in board order, so this list takes no `sort`. The answer also carries the card types,
        which `board_columns` returns beside the columns.
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of columns, with the card types.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumnList'
        '400':
          $ref: '#/components/responses/E400InvalidCursor'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
    post:
      operationId: createBoardColumn
      summary: Add a column to the board
      tags:
      - Columns
      description: '`Location` names the new column by its slug. No route reads one column, so read it from the list.'
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnCreate'
      responses:
        '201':
          description: The new column, and every column of the board.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnWriteResult'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '409':
          $ref: '#/components/responses/E409ColumnSlugTakenIdempotencyKeyReusedIdempotencyInProgress'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/board/columns/order:
    put:
      operationId: reorderBoardColumns
      summary: Put the columns in a new order
      tags:
      - Columns
      description: Backlog always comes first and never moves, so leave it out. `errors[].code` is `backlog_in_order`, `unknown_column`
        or `order_incomplete`.
      parameters:
      - $ref: '#/components/parameters/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnOrder'
      responses:
        '200':
          description: Every column, in the new order.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnOrderResult'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '409':
          $ref: '#/components/responses/E409ColumnsChanged'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/projects/{project}/board/columns/{column}:
    get:
      operationId: getColumn
      summary: Read one column
      tags:
      - Columns
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Column'
      responses:
        '200':
          description: The column.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnWriteResult'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403CredentialNotAllowed'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '429':
          $ref: '#/components/responses/E429RateLimited'
        '404':
          $ref: '#/components/responses/E404ProjectNotFoundColumnNotFoundRouteNotFound'
    patch:
      operationId: updateBoardColumn
      summary: Rename a column, or set whether it is terminal
      tags:
      - Columns
      parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Column'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnUpdate'
      responses:
        '200':
          description: The column after the change, and every column of the board.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnWriteResult'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401InvalidCredentialsApiKeyExpired'
        '402':
