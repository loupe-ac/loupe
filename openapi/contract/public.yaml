          - has-follow-up
          - follow-up-of
          default: relates-to
    CardCreate:
      type: object
      description: '`errors[].code` covers, among others, `title_blank`, `title_too_long`, `document_unknown`, `artifact_unknown`,
        `linked_card_unknown`, `linked_card_self`, `linked_card_twice`, `parent_unknown`, `parent_not_epic`, `epic_cannot_have_parent`,
        `unknown_type`, `unknown_status`, `reporter_invalid`, and for `childDesign`: `child_design_required`, `child_design_no_parent`,
        `child_design_not_declared`, `child_design_with_status`, `child_design_no_inherit`.'
      required:
      - title
      - body
      - type
      properties:
        title:
          type: string
          maxLength: 255
        body:
          type: string
          description: Markdown. Write another card as `card:<number>` and a pull request as `pr:owner/repo#<number>`.
        type:
          type: string
          description: A type key from the column list. A key the project does not declare is refused.
        status:
          type: string
          description: The slug of the column the card lands in. It defaults to backlog.
        reporter:
          type: string
          enum:
          - human
          - agent
          - api-key
          description: Who raised the card. An API key may pass `human` or `api-key`, and defaults to `api-key`. A CLI sign-in
            may pass `human` or `agent`, and defaults to `agent`. Any other pair is refused.
        pullRequestUrls:
          type: array
          items:
            type: string
          description: A URL from an unrecognised forge is kept as given.
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          description: Documents of this project. Any other id is refused.
        artifactIds:
          type: array
          items:
            type: string
            format: uuid
          description: Artifacts of this project. Any other id is refused.
        relatedCards:
          type: array
          items:
            $ref: '#/components/schemas/CardRelatedInput'
        parentCardId:
          type: string
          description: A card of this project whose type has the children capability.
          format: uuid
        laneEnabled:
          type: boolean
          description: It defaults to true.
        childDesign:
          type: string
          description: Whether the tech design of the parent covers the card, for a card under a parent whose tech design
            is approved. Pass no `status` with `own`.
          enum:
          - inherit
          - own
        requiresHumanReview:
          type: boolean
          description: True when a person must review the pull request. It defaults to false.
    CardUpdate:
      type: object
      description: A field you leave out keeps its value. Reporter and number cannot change. `errors[].code` covers those
        of card creation, and `parent_card_cannot_be_epic`, `epic_type_locked`, `value_undeclared_key` and `value_wrong_type`.
      properties:
        title:
          type: string
          maxLength: 255
        body:
          type: string
          description: Markdown. Write another card as `card:<number>` and a pull request as `pr:owner/repo#<number>`.
        type:
          type: string
          description: A type key from the column list.
        status:
          type: string
          description: The slug of a column on this board. A change appends the card to the end of the column.
        pullRequestUrls:
          type: array
          items:
            type: string
          description: The full set. Leave it out to keep the links, and send an empty list to remove them all.
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          description: The full set, as `pullRequestUrls` says.
        artifactIds:
          type: array
          items:
            type: string
            format: uuid
          description: The full set, as `pullRequestUrls` says.
        relatedCards:
          type: array
          items:
            $ref: '#/components/schemas/CardRelatedInput'
          description: The full set. It replaces every link that touches the card, including links written from the other
            card.
        parentCardId:
          type: string
          description: The id of the new parent. Leave it out to keep the parent. An empty string clears it.
        clearParent:
          type: boolean
          description: True removes the card from its parent. Do not pass it with `parentCardId`.
        laneEnabled:
          type: boolean
        childDesign:
          type: string
          description: As in card creation. Pass no `status` with `own`.
          enum:
          - inherit
          - own
        requiresHumanReview:
          type: boolean
          description: A bridge worker can only turn it on.
        values:
          type: object
          additionalProperties: true
          description: 'Maps a declared key to its value, such as `{"tech-design-interactive": true}`. A key you leave out
            keeps its value. One bad entry refuses the whole call.'
