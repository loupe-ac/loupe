      - comments
      - decisions
      - agentReviews
      - verdictThroughApiKey
      properties:
        status:
          type: string
          enum:
          - in-review
          - approved
          - changes-requested
          - draft
        verdict:
          type: string
          description: The verdict standing on the current version. Null also after a withdrawal.
          enum:
          - approved
          - changes-requested
          - null
          nullable: true
        verdictId:
          type: string
          description: The newest entry of the verdict log, a withdrawal included.
          format: uuid
          nullable: true
        verdictThroughAgent:
          type: boolean
        note:
          type: string
          nullable: true
        version:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ReviewComment'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewDecision'
        agentReviews:
          type: array
          items:
            $ref: '#/components/schemas/DocumentAgentReview'
          description: Newest first.
        verdictThroughApiKey:
          type: boolean
          description: An API key recorded the verdict for the owner.
    VerdictSubmit:
      type: object
      description: Call this only after the owner gave the verdict. Approval needs an answer to every decision. Changes-requested
        needs a note or an open comment, otherwise `errors[].code` is `note_or_comment_required`.
      required:
      - versionNumber
      - verdict
      - expectedVerdictId
      properties:
        versionNumber:
          type: integer
          description: The version you showed the owner.
          minimum: 1
        verdict:
          type: string
          enum:
          - approved
          - changes-requested
        expectedVerdictId:
          type: string
          description: The `verdictId` from the review. Pass null when that is null.
          format: uuid
          nullable: true
        note:
          type: string
          description: The note of the owner.
    VerdictResult:
      type: object
      required:
      - verdictId
      - verdict
      - documentStatus
      properties:
        verdictId:
          type: string
          format: uuid
        verdict:
          type: string
          enum:
          - approved
          - changes-requested
        documentStatus:
          type: string
          enum:
          - in-review
          - approved
          - changes-requested
          - draft
    VerdictWithdrawResult:
      type: object
      required:
      - verdictId
      - documentStatus
      properties:
        verdictId:
          type: string
          description: The id of the withdrawal entry.
          format: uuid
        documentStatus:
          type: string
          enum:
          - in-review
          - approved
          - changes-requested
          - draft
    DecisionAnswer:
      type: object
      description: '`errors[].code` covers `unknown_version`, `unknown_option` and `note_too_long`.'
      required:
      - versionNumber
      - optionIndexes
      properties:
        versionNumber:
          type: integer
          description: The version you showed the owner.
          minimum: 1
        optionIndexes:
          type: array
          items:
            type: integer
            minimum: 0
          description: The indexes of the options the owner chose, from 0.
          minItems: 1
        note:
          type: string
          description: The note of the owner. Leave it out to keep the stored note, and pass an empty string to remove it.
          maxLength: 2000
    DecisionResult:
      type: object
      required:
      - decisionId
      - changed
      - cleared
      properties:
        decisionId:
          type: string
        changed:
          type: boolean
        cleared:
          type: boolean
    CommentReply:
      type: object
      description: '`errors[].code` covers `reply_empty`, `reply_too_long` and `reply_to_reply`.'
      required:
      - body
      properties:
        body:
          type: string
          description: The reply text. At most 65536 bytes. The reply is attributed to the agent.
          minLength: 1
    CommentReplyCreated:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    CommentUpdate:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The only status a route writes. Resolved stays with a person.
          enum:
          - addressed
    CommentStatusResult:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - addressed
    FeedbackItem:
      type: object
      description: A note that a reviewer left with the live-review widget.
      required:
      - id
      - url
      - surface
      - native
      - screenshot
      - anchors
      - body
      - hasDrawing
      - status
      - context
      - createdAt
      - cardId
      - number
      - title
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: The page of a web note, or null for a native note.
          nullable: true
        surface:
          type: string
          enum:
          - web
          - ios-simulator
        native:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/NativeFacts'
        screenshot:
          type: object
          description: The size of the marked image of the note, or null.
          required:
          - width
          - height
          properties:
            width:
              type: integer
            height:
              type: integer
          nullable: true
        anchors:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackAnchor'
        body:
          type: string
        hasDrawing:
          type: boolean
          description: True when the note has strokes. Ask the reviewer rather than guess.
        status:
          type: string
          enum:
          - pending
          - addressed
          - resolved
        context:
          type: string
          description: What a preview page said it served, or null.
          nullable: true
        createdAt:
          type: string
          format: date-time
        cardId:
          type: string
          format: uuid
          nullable: true
        number:
          type: integer
          description: The number of its card.
          nullable: true
        title:
          type: string
          description: The title of its card.
          nullable: true
    FeedbackList:
      type: object
      required:
      - items
      - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackItem'
        next:
          type: string
          description: The URL of the next page, or null on the last page.
          nullable: true
          format: uri
    FeedbackUpdate:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The only status a route writes. Resolved stays with a person.
          enum:
          - addressed
    ArtifactSummary:
      type: object
      required:
      - artifactId
      - name
      - latestVersion
      - archived
      - sourceLink
      - createdAt
      - path
      properties:
        artifactId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        latestVersion:
          type: integer
        archived:
          type: boolean
        sourceLink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        path:
          type: string
          description: The path of the artifact page in the app.
    ArtifactList:
      type: object
      required:
      - items
      - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSummary'
        next:
          type: string
          description: The URL of the next page, or null on the last page.
          nullable: true
          format: uri
    ArtifactVersion:
      type: object
      required:
      - number
      - storedAt
      - storedInSession
      - notes
      - fileCount
      - totalBytes
      properties:
        number:
          type: integer
        storedAt:
          type: string
          format: date-time
        storedInSession:
          type: boolean
        notes:
          type: string
          description: What changed.
          nullable: true
        fileCount:
          type: integer
        totalBytes:
          type: integer
    ArtifactFile:
      type: object
      required:
      - path
      - contentType
      - size
      properties:
        path:
          type: string
        contentType:
          type: string
        size:
          type: integer
    Artifact:
      type: object
      required:
      - artifactId
      - name
      - archived
      - archivedAt
      - sourceLink
      - createdAt
      - path
      - versions
      - selectedVersion
      - pageLink
      - files
      properties:
        artifactId:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        sourceLink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        path:
          type: string
          description: The path of the artifact page in the app.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactVersion'
        selectedVersion:
          type: integer
          description: The version whose files are listed.
          nullable: true
        pageLink:
          type: string
          description: A full address of the entry page of that version, valid for one hour, or null when the version has
            none.
          nullable: true
          format: uri
        files:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFile'
    ArtifactStored:
      type: object
      required:
      - artifactId
      - versionNumber
      - path
      - versionPath
      properties:
        artifactId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        path:
          type: string
          description: The path of the artifact page in the app.
        versionPath:
          type: string
          description: The path of this version in the app.
    ArtifactCreateUpload:
      type: object
      description: '`errors[].code` covers `paths_mismatch`, `no_files`, `too_many_files`, `unsafe_path`, `claude_design_canvas`,
        `duplicate_path`, `bad_content_type`, `too_large`, `card_not_found` and the name codes `name_blank`, `name_too_long`.'
      required:
      - name
      - paths
      - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        sourceLink:
          type: string
          maxLength: 2000
        paths:
          type: array
          items:
            type: string
            maxLength: 1024
          description: The path of each file in `files`, in the same order.
        card:
          type: string
          description: A card of this project to link.
          format: uuid
        notes:
          type: string
          description: What changed in this version.
          maxLength: 2000
        files:
          type: array
          items:
            type: string
            format: binary
          description: The files. Each part gives its content type.
    ArtifactVersionUpload:
      type: object
      description: '`errors[].code` covers `paths_mismatch`, `no_files`, `too_many_files`, `unsafe_path`, `claude_design_canvas`,
        `duplicate_path`, `bad_content_type`, `too_large`, `card_not_found` and the name codes `name_blank`, `name_too_long`.'
      required:
      - paths
      - files
      properties:
        paths:
          type: array
          items:
            type: string
            maxLength: 1024
          description: The path of each file in `files`, in the same order.
        card:
          type: string
          description: A card of this project to link.
          format: uuid
        notes:
          type: string
          description: What changed in this version.
          maxLength: 2000
        files:
          type: array
          items:
            type: string
            format: binary
          description: The files. Each part gives its content type.
    ArtifactUpdate:
      type: object
      required:
      - archived
      properties:
        archived:
          type: boolean
          description: True archives the artifact, and false restores it. Nothing is deleted. A second write changes nothing.
  examples:
    MethodNotAllowed:
      summary: method_not_allowed
      value:
        type: https://loupe.ac/docs/reference/api/errors#method_not_allowed
        title: Method not allowed
        status: 405
        code: method_not_allowed
        detail: The path does not take this method.
    RateLimited:
      summary: rate_limited
      value:
        type: https://loupe.ac/docs/reference/api/errors#rate_limited
        title: Rate limited
        status: 429
        code: rate_limited
        detail: Too many requests. Wait for the seconds in Retry-After.
    InvalidCursor:
      summary: invalid_cursor
      value:
        type: https://loupe.ac/docs/reference/api/errors#invalid_cursor
        title: Invalid cursor
        status: 400
        code: invalid_cursor
        detail: The cursor is malformed, or it comes from another list.
    InvalidCredentials:
      summary: invalid_credentials
      value:
        type: https://loupe.ac/docs/reference/api/errors#invalid_credentials
        title: Invalid credentials
        status: 401
        code: invalid_credentials
        detail: The bearer token is missing, unknown or revoked.
    ApiKeyExpired:
      summary: api_key_expired
      value:
        type: https://loupe.ac/docs/reference/api/errors#api_key_expired
        title: API key expired
        status: 401
        code: api_key_expired
        detail: The API key passed its expiry date.
    SubscriptionRequired:
      summary: subscription_required
      value:
        type: https://loupe.ac/docs/reference/api/errors#subscription_required
        title: Subscription required
        status: 402
        code: subscription_required
        detail: The account needs an active subscription.
        subscribeUrl: https://app.loupe.ac/billing/subscribe
    CredentialNotAllowed:
      summary: credential_not_allowed
      value:
        type: https://loupe.ac/docs/reference/api/errors#credential_not_allowed
        title: Credential not allowed
        status: 403
        code: credential_not_allowed
        detail: This credential cannot do this on this project.
    RouteNotFound:
      summary: route_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#route_not_found
        title: Route not found
        status: 404
        code: route_not_found
        detail: No route matches this path, or a feature flag switches the route off.
    ValidationFailed:
      summary: validation_failed
      value:
        type: https://loupe.ac/docs/reference/api/errors#validation_failed
        title: Validation failed
        status: 422
        code: validation_failed
        detail: One or more fields were refused.
        errors:
        - field: title
          code: title_blank
          message: A card title must not be blank.
    InvalidJson:
      summary: invalid_json
      value:
        type: https://loupe.ac/docs/reference/api/errors#invalid_json
        title: Invalid JSON
        status: 400
        code: invalid_json
        detail: The request body is not valid JSON.
    CredentialNotOwnerWide:
      summary: credential_not_owner_wide
      value:
        type: https://loupe.ac/docs/reference/api/errors#credential_not_owner_wide
        title: Credential not owner-wide
        status: 403
        code: credential_not_owner_wide
        detail: Only a credential that covers every project of the owner can create a project.
    NameTaken:
      summary: name_taken
      value:
        type: https://loupe.ac/docs/reference/api/errors#name_taken
        title: Name taken
        status: 409
        code: name_taken
        detail: Another project of this owner already has this name.
        slug: my-project
    IdempotencyKeyReused:
      summary: idempotency_key_reused
      value:
        type: https://loupe.ac/docs/reference/api/errors#idempotency_key_reused
        title: Idempotency key reused
        status: 409
        code: idempotency_key_reused
        detail: This key was used with a different request body.
    IdempotencyInProgress:
      summary: idempotency_in_progress
      value:
        type: https://loupe.ac/docs/reference/api/errors#idempotency_in_progress
        title: Idempotency in progress
        status: 409
        code: idempotency_in_progress
        detail: The first request with this key has not finished. Try again later.
    UnsupportedMediaType:
      summary: unsupported_media_type
      value:
        type: https://loupe.ac/docs/reference/api/errors#unsupported_media_type
        title: Unsupported media type
        status: 415
        code: unsupported_media_type
        detail: The Content-Type does not fit this operation.
    NameRequired:
      summary: name_required
      value:
        type: https://loupe.ac/docs/reference/api/errors#name_required
        title: Name required
        status: 422
        code: name_required
        detail: Pass a name, or a remote that gives one.
    NameInvalid:
      summary: name_invalid
      value:
        type: https://loupe.ac/docs/reference/api/errors#name_invalid
        title: Name invalid
        status: 422
        code: name_invalid
        detail: A project name needs at least one letter or digit, because the slug comes from the name.
    ProjectNotFound:
      summary: project_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#project_not_found
        title: Project not found
        status: 404
        code: project_not_found
        detail: The credential reaches no project with this id or slug.
    SlugTaken:
      summary: slug_taken
      value:
        type: https://loupe.ac/docs/reference/api/errors#slug_taken
        title: Slug taken
        status: 409
        code: slug_taken
        detail: Another project of this owner has a name that gives the same slug.
    ColumnSlugTaken:
      summary: column_slug_taken
      value:
        type: https://loupe.ac/docs/reference/api/errors#column_slug_taken
        title: Column slug taken
        status: 409
        code: column_slug_taken
        detail: Another column on this board already has the slug that comes from this label.
    ColumnNotFound:
      summary: column_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#column_not_found
        title: Column not found
        status: 404
        code: column_not_found
        detail: This board has no column with this slug.
    NoTerminalColumn:
      summary: no_terminal_column
      value:
        type: https://loupe.ac/docs/reference/api/errors#no_terminal_column
        title: No terminal column
        status: 409
        code: no_terminal_column
        detail: A board needs at least one terminal column.
    BacklogLocked:
      summary: backlog_locked
      value:
        type: https://loupe.ac/docs/reference/api/errors#backlog_locked
        title: Backlog locked
        status: 409
        code: backlog_locked
        detail: Nobody can rename, change, reorder or delete Backlog.
    ColumnsChanged:
      summary: columns_changed
      value:
        type: https://loupe.ac/docs/reference/api/errors#columns_changed
        title: Columns changed
        status: 409
        code: columns_changed
        detail: The columns changed while the call ran. Read them and try again.
    ColumnTargetRequired:
      summary: column_target_required
      value:
        type: https://loupe.ac/docs/reference/api/errors#column_target_required
        title: Target column required
        status: 409
        code: column_target_required
        detail: This column holds cards. Pass targetColumn.
    CardManaged:
      summary: card_managed
      value:
        type: https://loupe.ac/docs/reference/api/errors#card_managed
        title: Card managed
        status: 409
        code: card_managed
        detail: This card is managed, and its workflow does not allow this move. PUT the hold first, and then any move is
          allowed.
    ChildDesignRefused:
      summary: child_design_refused
      value:
        type: https://loupe.ac/docs/reference/api/errors#child_design_refused
        title: Child design refused
        status: 409
        code: child_design_refused
        detail: The workflow cannot carry out the childDesign choice for this card.
    CardNotFound:
      summary: card_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#card_not_found
        title: Card not found
        status: 404
        code: card_not_found
        detail: This project has no card with this number.
    EpicChildrenOpen:
      summary: epic_children_open
      value:
        type: https://loupe.ac/docs/reference/api/errors#epic_children_open
        title: Open child cards
        status: 409
        code: epic_children_open
        detail: This epic has open child cards. Move each of them to a terminal column first.
    AlreadyPaused:
      summary: already_paused
      value:
        type: https://loupe.ac/docs/reference/api/errors#already_paused
        title: Already held
        status: 409
        code: already_paused
        detail: This card is already unmanaged.
    NotPaused:
      summary: not_paused
      value:
        type: https://loupe.ac/docs/reference/api/errors#not_paused
        title: Not paused
        status: 409
        code: not_paused
        detail: This card has no hold or no pause to end.
    CardUnmanaged:
      summary: card_unmanaged
      value:
        type: https://loupe.ac/docs/reference/api/errors#card_unmanaged
        title: Card unmanaged
        status: 409
        code: card_unmanaged
        detail: The card is unmanaged, or the workflow is off for the project.
    PauseChanged:
      summary: pause_changed
      value:
        type: https://loupe.ac/docs/reference/api/errors#pause_changed
        title: Pause changed
        status: 409
        code: pause_changed
        detail: The active pause is not the pause named by pauseId.
    KindNotReleasable:
      summary: kind_not_releasable
      value:
        type: https://loupe.ac/docs/reference/api/errors#kind_not_releasable
        title: Pause kind not releasable
        status: 409
        code: kind_not_releasable
        detail: A pause of kind rule ends only on its own release condition.
    SeriesOrdinalTaken:
      summary: series_ordinal_taken
      value:
        type: https://loupe.ac/docs/reference/api/errors#series_ordinal_taken
        title: Series ordinal taken
        status: 409
        code: series_ordinal_taken
        detail: Another document in that series already holds that ordinal.
    SeriesNameTaken:
      summary: series_name_taken
      value:
        type: https://loupe.ac/docs/reference/api/errors#series_name_taken
        title: Series name taken
        status: 409
        code: series_name_taken
        detail: The project already has a series of that name.
    DocumentNotFound:
      summary: document_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#document_not_found
        title: Document not found
        status: 404
        code: document_not_found
        detail: This project has no such document.
    DocumentArchived:
      summary: document_archived
      value:
        type: https://loupe.ac/docs/reference/api/errors#document_archived
        title: Document archived
        status: 409
        code: document_archived
        detail: An archived document cannot be published. Restore it first.
    DocumentVersionNotFound:
      summary: document_version_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#document_version_not_found
        title: Document version not found
        status: 404
        code: document_version_not_found
        detail: This document has no version with this number.
    VerdictStale:
      summary: verdict_stale
      value:
        type: https://loupe.ac/docs/reference/api/errors#verdict_stale
        title: Verdict stale
        status: 409
        code: verdict_stale
        detail: The document has a newer version. Show it to the owner, then call again with its versionNumber.
    VerdictChanged:
      summary: verdict_changed
      value:
        type: https://loupe.ac/docs/reference/api/errors#verdict_changed
        title: Verdict changed
        status: 409
        code: verdict_changed
        detail: The review changed since you read it. Read the review again, and pass its newest verdictId.
    DecisionsUnanswered:
      summary: decisions_unanswered
      value:
        type: https://loupe.ac/docs/reference/api/errors#decisions_unanswered
        title: Decisions unanswered
        status: 409
        code: decisions_unanswered
        detail: One or more decisions have no answer yet. Answer them first, or request changes.
    VerdictNone:
      summary: verdict_none
      value:
        type: https://loupe.ac/docs/reference/api/errors#verdict_none
        title: No verdict
        status: 409
        code: verdict_none
        detail: The document has no verdict to withdraw.
    VerdictAlreadyWithdrawn:
      summary: verdict_already_withdrawn
      value:
        type: https://loupe.ac/docs/reference/api/errors#verdict_already_withdrawn
        title: Verdict already withdrawn
        status: 409
        code: verdict_already_withdrawn
        detail: The verdict is already withdrawn.
    DecisionNotFound:
      summary: decision_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#decision_not_found
        title: Decision not found
        status: 404
        code: decision_not_found
        detail: This version of the document holds no decision with that id.
    DecisionStale:
      summary: decision_stale
      value:
        type: https://loupe.ac/docs/reference/api/errors#decision_stale
        title: Decision stale
        status: 409
        code: decision_stale
        detail: The document has a newer version. Show it to the owner, then call again with its versionNumber.
    CommentNotFound:
      summary: comment_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#comment_not_found
        title: Comment not found
        status: 404
        code: comment_not_found
        detail: This document has no such comment.
    CommentVersionStale:
      summary: comment_version_stale
      value:
        type: https://loupe.ac/docs/reference/api/errors#comment_version_stale
        title: Comment version stale
        status: 409
        code: comment_version_stale
        detail: This comment belongs to an older version. Read the review for the current comment ids.
    CommentDeleted:
      summary: comment_deleted
      value:
        type: https://loupe.ac/docs/reference/api/errors#comment_deleted
        title: Comment deleted
        status: 409
        code: comment_deleted
