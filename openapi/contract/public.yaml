components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'An API key or an OAuth access token, in `Authorization: Bearer <token>`.'
  parameters:
    Project:
      name: project
      in: path
      required: true
      description: A project id or a project slug. A slug changes when the project is renamed, so quote the id when it must
        stay valid.
      schema:
        type: string
      example: my-project
    CardNumber:
      name: number
      in: path
      required: true
      description: The card number, the short label that counts from 1 inside this project.
      schema:
        type: integer
        minimum: 1
    Column:
      name: column
      in: path
      required: true
      description: The slug of a column, from the column list.
      schema:
        type: string
    Document:
      name: document
      in: path
      required: true
      description: The document id.
      schema:
        type: string
        format: uuid
    DocumentVersionNumber:
      name: version
      in: path
      required: true
      description: The version number of the document, counting from 1.
      schema:
        type: integer
        minimum: 1
    Verdict:
      name: verdict
      in: path
      required: true
      description: The `verdictId` from the review. A newer verdict is refused.
      schema:
        type: string
        format: uuid
    Decision:
      name: decision
      in: path
      required: true
      description: The id that the document declared in the fence of the decision block.
      schema:
        type: string
    Comment:
      name: comment
      in: path
      required: true
      description: The id of a comment from the review, on the current version of the document.
      schema:
        type: string
        format: uuid
    Feedback:
      name: feedback
      in: path
      required: true
      description: The feedback id.
      schema:
        type: string
        format: uuid
    Artifact:
      name: artifact
      in: path
      required: true
      description: The artifact id.
      schema:
        type: string
        format: uuid
    ArtifactFilePath:
      name: path
      in: path
      required: true
      description: The path of the file inside the version, as the artifact lists it. Percent-encode each `/` as `%2F`, because
        OpenAPI 3.0 path parameters hold no slash. The route also takes a raw `/`.
      schema:
        type: string
      example: assets%2Flogo.svg
    Limit:
      name: limit
      in: query
      description: The most rows to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The opaque position from the `next` URL of the last page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A key of your choice. A retry with the same key and body answers as the first request did. The same key
        with another body gets 409 `idempotency_key_reused`.
      schema:
        type: string
        maxLength: 255
    SortCreated:
      name: sort
      in: query
      description: The sort order. The default is creation order, oldest first. A leading `-` sorts newest first.
      schema:
        type: string
        enum:
        - createdAt
        - -createdAt
        default: createdAt
    SortCards:
      name: sort
      in: query
      description: The sort order. A leading `-` is descending. With `q`, an absent `sort` gives search rank.
      schema:
        type: string
        enum:
        - number
        - -number
        - createdAt
        - -createdAt
        - updatedAt
        - -updatedAt
        default: number
    VersionNumberRequired:
      name: versionNumber
      in: query
      required: true
      description: The version you showed the owner. A newer version is refused.
      schema:
        type: integer
        minimum: 1
    VersionNumberOptional:
      name: versionNumber
      in: query
      description: The artifact version to read. It defaults to the latest.
      schema:
        type: integer
        minimum: 1
    TargetColumn:
      name: targetColumn
      in: query
      description: The slug of the column the cards move to. It is needed only when the column holds cards.
      schema:
        type: string
    CardSearch:
      name: q
      in: query
      description: Search words, in the title and the body of every card, terminal columns included. Matching is by substring,
        ignoring case. Every word must match. Quote a phrase, prefix `-` to exclude, and write `or` for either. `12` or `#12`
        also finds that card.
      schema:
        type: string
    CardStatus:
      name: status
      in: query
      description: Only cards in the column with this slug.
      schema:
        type: string
    CardType:
      name: type
      in: query
      description: Only cards of this type key.
      schema:
        type: string
    CardReporter:
      name: reporter
      in: query
      description: Only cards raised by this reporter.
      schema:
        type: string
        enum:
        - human
        - agent
        - reviewer
        - api-key
    CardParent:
      name: parentCardId
      in: query
      description: Only the children of this card.
      schema:
        type: string
        format: uuid
    CardPaused:
      name: paused
      in: query
      description: True for only the cards with an active pause, and false for only those with none.
      schema:
        type: boolean
    CardFull:
      name: full
      in: query
      description: Return the whole card rather than the summary, which is far larger.
      schema:
        type: boolean
        default: false
    PauseId:
      name: pauseId
      in: query
      description: Lift this pause only, so a pause that changed since you read it is refused. Leave it out to lift the active
        pause.
      schema:
        type: string
        format: uuid
    DocumentSearch:
      name: q
      in: query
      description: Terms matched against the title and the current content, anywhere inside a word and ignoring case. Quotes,
        a leading minus and `or` work. With `q` and no `sort`, a document with every word in the title comes first.
      schema:
        type: string
    DocumentStatus:
      name: status
      in: query
      description: Only documents in this state.
      schema:
        type: string
        enum:
        - in-review
        - approved
        - changes-requested
        - draft
    DocumentTag:
      name: tag
      in: query
      description: Only documents with this tag, ignoring case and surrounding spaces.
      schema:
        type: string
    DocumentSeries:
      name: series
      in: query
      description: Only documents in this series, ignoring case. With no `sort`, they read by their position.
      schema:
        type: string
    IncludeArchived:
      name: includeArchived
      in: query
      description: Include archived rows, which are left out by default.
      schema:
        type: boolean
        default: false
    FeedbackStatus:
      name: status
      in: query
      description: Which feedback to return.
      schema:
        type: string
        enum:
        - pending
        - addressed
        - resolved
        - all
        default: pending
    FeedbackCard:
      name: cardId
      in: query
      description: Only the feedback of this card.
      schema:
        type: string
        format: uuid
  headers:
    RateLimit-Limit:
      description: The number of requests the window allows.
      schema:
        type: integer
    RateLimit-Remaining:
      description: The number of requests left in the window.
      schema:
        type: integer
    RateLimit-Reset:
      description: The number of seconds until the window resets.
      schema:
        type: integer
    Retry-After:
      description: The number of seconds to wait before the next request.
      schema:
        type: integer
    Location:
      description: The URL of the new resource.
      schema:
        type: string
        format: uri
    Link:
      description: The next page, as `<url>; rel="next"`. It is absent on the last page.
      schema:
        type: string
  schemas:
    Problem:
      type: object
      description: An error, as RFC 9457 `application/problem+json`.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          description: A URI that names the error.
          format: uri
          example: https://loupe.ac/docs/reference/api/errors#card_not_found
        title:
          type: string
          description: A short summary of the error.
        status:
          type: integer
          description: The HTTP status.
        code:
          type: string
          description: The stable machine-readable code.
        detail:
          type: string
          description: What happened in this request.
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - field
              - code
              - message
              properties:
                field:
                  type: string
                  description: The field, as a request names it.
                code:
                  type: string
                  description: The stable code of the refusal.
                message:
                  type: string
                  description: A sentence that says why.
    SubscriptionProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - subscribeUrl
        properties:
          subscribeUrl:
            type: string
            description: Where to subscribe.
            format: uri
    NameTakenProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          slug:
            type: string
            description: The slug of the project that holds the name.
    ApiVersions:
      type: object
      description: The API versions of this instance.
      required:
      - versions
      - cliRange
      properties:
        versions:
          type: array
          items:
            type: object
            required:
            - version
            - status
            properties:
              version:
                type: string
                example: v1
              status:
                type: string
                description: The state of this version.
                enum:
                - beta
                - stable
                - deprecated
                example: beta
        cliRange:
          type: string
          description: The CLI versions this server works with, as a caret range.
          example: ^2.0
      example:
        versions:
        - version: v1
          status: beta
        cliRange: ^2.0
    Project:
      type: object
      required:
      - id
      - slug
      - name
      - description
      - domain
      - searchLanguage
      - allowedOrigins
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Null on a project created before the slug existed, so quote the id.
          nullable: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          description: What the project is for.
          nullable: true
          maxLength: 500
        domain:
          type: string
          description: The domain of the site the project reviews.
          nullable: true
          maxLength: 255
        searchLanguage:
          type: string
          description: The language a new document or inbox item of the project takes.
          enum:
          - arabic
          - armenian
          - basque
          - catalan
          - danish
          - dutch
          - english
          - finnish
          - french
          - german
          - greek
          - hindi
          - hungarian
          - indonesian
          - irish
          - italian
          - lithuanian
          - nepali
          - norwegian
          - portuguese
          - romanian
          - russian
          - serbian
          - simple
          - spanish
          - swedish
          - tamil
          - turkish
          - yiddish
        allowedOrigins:
          type: array
          items:
            type: string
          description: The site origins the sign-in widget may run on.
        createdAt:
          type: string
          format: date-time
    ProjectList:
      type: object
      required:
      - items
      - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next:
          type: string
          description: The URL of the next page, or null on the last page.
          nullable: true
          format: uri
    ProjectCreate:
      type: object
      description: Give a name, a remote, or both.
      properties:
        name:
          type: string
          description: The project name. With no name, the project takes the last path segment of `remote`.
          maxLength: 100
        domain:
          type: string
          maxLength: 255
        remote:
          type: string
          description: A git remote, as `https://`, `ssh://`, `git://` or `user@host:path`.
          maxLength: 500
        origins:
          type: array
          items:
            type: string
          description: The origins to allow. An entry is an origin with no path, or a wildcard of one label. Plain http works
            on localhost only.
          maxItems: 20
    ProjectUpdate:
      type: object
      description: A field you leave out keeps its value.
      properties:
        name:
          type: string
          description: A new name. It also changes the slug.
          minLength: 1
          maxLength: 100
        description:
          type: string
          description: An empty string clears it.
          maxLength: 500
        domain:
          type: string
          description: An empty string clears it.
          maxLength: 255
        searchLanguage:
          type: string
          enum:
          - arabic
          - armenian
          - basque
          - catalan
          - danish
          - dutch
          - english
          - finnish
          - french
          - german
          - greek
          - hindi
          - hungarian
          - indonesian
          - irish
          - italian
          - lithuanian
          - nepali
          - norwegian
          - portuguese
          - romanian
          - russian
          - serbian
          - simple
          - spanish
          - swedish
          - tamil
          - turkish
          - yiddish
        origins:
          type: array
          items:
            type: string
          description: Replaces the whole stored list, and an empty list clears it. At most 20 entries and 4000 characters
            together, with no line break in an entry.
          maxItems: 20
    BoardColumn:
      type: object
      required:
      - slug
      - label
      - terminal
      - default
      - backlog
      properties:
        slug:
          type: string
          description: The value you pass as `status`.
        label:
          type: string
          description: The name a person sees on the board.
          maxLength: 100
        terminal:
          type: boolean
          description: A terminal column is where finished work goes.
        default:
          type: boolean
          description: True for the column where a new card lands when you pass no status.
        backlog:
          type: boolean
          description: True for Backlog, which the board does not draw as a column.
    CardType:
      type: object
      required:
      - key
      - label
      - children
      - lane
      properties:
        key:
          type: string
          description: The value you pass as `type`.
        label:
          type: string
        children:
          type: boolean
          description: A card of this type may be the parent of other cards.
        lane:
          type: boolean
          description: A card of this type gets a lane on the board.
    BoardColumnList:
      type: object
      required:
      - items
      - next
      - types
      - defaultType
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
        next:
          type: string
          description: The URL of the next page, or null on the last page.
          nullable: true
          format: uri
        types:
          type: array
          items:
            $ref: '#/components/schemas/CardType'
          description: The card types of the project.
        defaultType:
          type: string
          description: The type a new card gets.
    ColumnWriteResult:
      type: object
      required:
      - column
      - columns
      properties:
        column:
          type: string
          description: The slug of the column after the change.
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
          description: Every column of the board, in board order.
    ColumnDeleteResult:
      type: object
      required:
      - deleted
      - movedCards
      - targetColumn
      - columns
      properties:
        deleted:
          type: string
          description: The deleted slug.
        movedCards:
          type: integer
          description: The number of moved cards.
        targetColumn:
          type: string
          description: Where the cards went.
          nullable: true
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
          description: Every column that remains.
    ColumnOrderResult:
      type: object
      required:
      - columns
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumn'
          description: Every column of the board, in the new order.
    ColumnCreate:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          description: The slug comes from the label. The new column goes last, and it is not terminal.
          minLength: 1
          maxLength: 100
    ColumnUpdate:
      type: object
      description: A field you leave out keeps its value.
      properties:
        label:
          type: string
          description: A new name. The slug changes with it, so a bridge rule or a script that uses the old slug stops working.
          minLength: 1
          maxLength: 100
        terminal:
          type: boolean
          description: Whether finished work goes in this column.
    ColumnOrder:
      type: object
      required:
      - order
      properties:
        order:
          type: array
          items:
            type: string
          description: The slug of every column except backlog, each once, from left to right.
          uniqueItems: true
    Actor:
      type: object
      description: Who made a change.
      required:
      - kind
      - name
      - apiKey
      properties:
        kind:
          type: string
          description: The class of writer.
          enum:
          - human
          - agent
          - reviewer
          - system
          - api-key
        name:
          type: string
          description: The name of the person behind it, or null.
          nullable: true
        apiKey:
          type: object
          description: The key that acted when `kind` is `api-key`, otherwise null.
          required:
          - id
          - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          nullable: true
    PullRequestState:
      type: object
      description: The last state Loupe read from the forge.
      required:
      - state
      - draft
      - checks
      - failedChecks
      - mergeability
      - review
      - readyToMerge
      - refreshedAt
      properties:
        state:
          type: string
          enum:
          - open
          - merged
          - closed
        draft:
          type: boolean
        checks:
          type: string
          enum:
          - pending
          - passed
          - failed
        failedChecks:
          type: array
          items:
            type: string
        mergeability:
          type: string
          enum:
          - mergeable
          - conflicting
          - behind
          - blocked
          - unknown
        review:
          type: string
          enum:
          - approved
          - approval-outdated
          - changes-requested
          - required
          - none
        readyToMerge:
          type: boolean
        refreshedAt:
          type: string
          format: date-time
    AgentReviewFinding:
      type: object
      required:
      - path
      - startLine
      - endLine
      - severity
      - title
      - body
      - category
      - needsPerson
      properties:
        path:
          type: string
          nullable: true
        startLine:
          type: integer
          nullable: true
        endLine:
          type: integer
          nullable: true
        severity:
          type: string
          enum:
          - important
          - nit
          - pre-existing
        title:
          type: string
        body:
          type: string
        category:
          type: string
          enum:
          - code
          - spec
        needsPerson:
          type: boolean
    AgentReview:
      type: object
      required:
      - reviewId
      - headSha
      - conclusion
      - summary
      - findings
      - createdAt
      - postedAt
      - carriedTo
      - overriddenBy
      - checkUrl
      properties:
        reviewId:
          type: string
          format: uuid
        headSha:
          type: string
        conclusion:
          type: string
          enum:
          - success
          - failure
        summary:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AgentReviewFinding'
        createdAt:
          type: string
          format: date-time
        postedAt:
          type: string
          format: date-time
          nullable: true
        carriedTo:
          type: array
          items:
            type: object
            required:
            - headSha
            - postedAt
            properties:
              headSha:
                type: string
              postedAt:
                type: string
                format: date-time
                nullable: true
        overriddenBy:
          type: string
          nullable: true
        checkUrl:
          type: string
          nullable: true
          format: uri
    CardPullRequest:
      type: object
      required:
      - pullRequestId
      - url
      - forge
      - repository
      - number
      - state
      - agentReview
      properties:
        pullRequestId:
          type: string
          format: uuid
        url:
          type: string
        forge:
          type: string
          enum:
          - github
          - gitlab
          - bitbucket
          - other
        repository:
          type: string
          nullable: true
        number:
          type: integer
          nullable: true
        state:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PullRequestState'
          description: Null when Loupe holds no reading.
        agentReview:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AgentReview'
    CardDocument:
      type: object
      required:
      - documentId
      - title
      - status
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
          - in-review
          - approved
          - changes-requested
          - draft
    CardArtifact:
      type: object
      required:
      - artifactId
      - name
      - versionNumber
      - archived
      - path
      properties:
        artifactId:
          type: string
          format: uuid
        name:
          type: string
        versionNumber:
          type: integer
        archived:
          type: boolean
        path:
          type: string
          description: The path of the artifact page in the app.
    FeedbackAnchor:
      type: object
      required:
      - selector
      - text
      - quote
      - quotePrefix
      - quoteSuffix
      properties:
        selector:
          type: string
        text:
          type: string
        quote:
          type: string
          nullable: true
        quotePrefix:
          type: string
          nullable: true
        quoteSuffix:
          type: string
          nullable: true
    NativeFacts:
      type: object
      description: What a native note says about the app, the device, the screen and the element.
      required:
      - app
      - device
      - screen
      - element
      properties:
        app:
          type: object
          required:
          - name
          - bundleId
          properties:
            name:
              type: string
              nullable: true
            bundleId:
              type: string
        device:
          type: object
          required:
          - name
          - udid
          - osVersion
          properties:
            name:
              type: string
            udid:
              type: string
            osVersion:
              type: string
        screen:
          type: object
          required:
          - title
          properties:
            title:
              type: string
              nullable: true
        element:
          type: object
          required:
          - role
          - label
          - identifier
          - frame
          properties:
            role:
              type: string
            label:
              type: string
              nullable: true
            identifier:
              type: string
              nullable: true
            frame:
              type: object
              required:
              - x
              - y
              - width
              - height
              properties:
                x:
                  type: number
                y:
                  type: number
                width:
                  type: number
                height:
                  type: number
              nullable: true
          nullable: true
    CardFeedback:
      type: object
      required:
      - id
      - url
      - surface
      - native
      - screenshot
      - anchors
      - body
      - hasDrawing
      - status
      - context
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: The page of a web note, or null for a native note.
          nullable: true
        surface:
          type: string
          enum:
          - web
          - ios-simulator
        native:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/NativeFacts'
        screenshot:
          type: object
          description: The size of the marked image of the note, or null.
          required:
          - width
          - height
          properties:
            width:
              type: integer
            height:
              type: integer
          nullable: true
        anchors:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackAnchor'
        body:
          type: string
        hasDrawing:
          type: boolean
          description: True when the note has strokes. Ask the reviewer rather than guess.
        status:
          type: string
          enum:
          - pending
          - addressed
          - resolved
        context:
          type: string
          description: What a preview page said it served, or null.
          nullable: true
        createdAt:
          type: string
          format: date-time
    RelatedCard:
      type: object
      required:
      - cardId
      - number
      - title
      - status
      - kind
      properties:
        cardId:
          type: string
          format: uuid
        number:
          type: integer
        title:
          type: string
        status:
          type: string
        kind:
          type: string
          description: How this card reads the other card.
          enum:
          - relates-to
          - blocks
          - blocked-by
          - has-follow-up
          - follow-up-of
    CardRef:
      type: object
      required:
      - cardId
      - number
      - title
      - status
      properties:
        cardId:
          type: string
          format: uuid
        number:
          type: integer
        title:
          type: string
        status:
          type: string
    CardValue:
      type: object
      description: One typed value that the workflow template declares.
      required:
      - key
      - type
      - value
      - writer
      - updatedAt
      properties:
        key:
          type: string
        type:
          type: string
          enum:
          - bool
        value:
          type: boolean
          description: The value of the key, or null when it is unset.
          nullable: true
        writer:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Actor'
          description: Who last wrote the value, or null.
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CardPause:
      type: object
      required:
      - pauseId
      - kind
      - reason
      - ruleId
      - since
      properties:
        pauseId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - rule
          - retries
          - work-limit
          - work-timeout
          - work-stopped
        reason:
          type: string
        ruleId:
          type: string
        since:
          type: string
          format: date-time
    CardStateReason:
      type: object
      required:
      - kind
      - code
      - reason
      - since
      properties:
        kind:
          type: string
          enum:
          - stuck
          - needs-you
          - working
          - waiting
        code:
          type: string
        reason:
          type: string
        since:
          type: string
          format: date-time
    CardState:
      type: object
      description: What the card needs now on the board.
      required:
      - kind
      - code
      - since
      - reason
      - others
      properties:
        kind:
          type: string
          enum:
          - stuck
          - needs-you
          - working
          - waiting
        code:
          type: string
          description: Why.
        since:
          type: string
          format: date-time
        reason:
          type: string
          description: One sentence that says why.
        others:
          type: array
          items:
            $ref: '#/components/schemas/CardStateReason'
          description: The other reasons that apply.
    CardListState:
      type: object
      required:
      - kind
      - code
      - since
      properties:
        kind:
          type: string
          enum:
          - stuck
          - needs-you
          - working
          - waiting
        code:
          type: string
        since:
          type: string
          format: date-time
    Card:
      type: object
      required:
      - cardId
      - number
      - title
      - body
      - type
      - status
      - reporter
      - position
      - completedAt
      - createdAt
      - updatedAt
      - pullRequests
      - documents
      - artifacts
      - siteReviewComments
      - relatedCards
      - parent
      - laneEnabled
      - requiresHumanReview
      - values
      - children
      - progress
      - pause
      - state
      properties:
        cardId:
          type: string
          format: uuid
        number:
          type: integer
          description: The short label that counts from 1 inside this project.
        title:
          type: string
          maxLength: 255
        body:
          type: string
          description: Markdown.
        type:
          type: string
          description: A type key of the project.
        status:
          type: string
          description: The slug of the column.
        reporter:
          type: string
          description: Who first raised the card.
          enum:
          - human
          - agent
          - reviewer
          - api-key
        position:
          type: integer
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/CardPullRequest'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CardDocument'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/CardArtifact'
        siteReviewComments:
          type: array
          items:
            $ref: '#/components/schemas/CardFeedback'
          description: The feedback items of the card.
        relatedCards:
          type: array
          items:
            $ref: '#/components/schemas/RelatedCard'
        parent:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CardRef'
        laneEnabled:
          type: boolean
        requiresHumanReview:
          type: boolean
        values:
          type: array
          items:
            $ref: '#/components/schemas/CardValue'
          description: One row for each key the template declares.
        children:
          type: array
          items:
            $ref: '#/components/schemas/CardRef'
        progress:
          type: object
          description: Null for a type without the children capability.
          required:
          - done
          - total
          properties:
            done:
              type: integer
            total:
              type: integer
          nullable: true
        pause:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CardPause'
        state:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CardState'
          description: Null for a card in a terminal column and a card with no mark.
    CardSummary:
      type: object
      description: The lean row of the card list.
      required:
      - cardId
      - number
      - title
      - type
      - status
      - reporter
      - parentCardId
      - updatedAt
      - state
      properties:
        cardId:
          type: string
          format: uuid
        number:
          type: integer
        title:
          type: string
        type:
          type: string
        status:
          type: string
        reporter:
          type: string
          enum:
          - human
          - agent
          - reviewer
          - api-key
        parentCardId:
          type: string
          format: uuid
          nullable: true
        updatedAt:
          type: string
          format: date-time
        state:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CardListState'
    CardList:
      type: object
      required:
      - items
      - next
      properties:
        items:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/CardSummary'
            - $ref: '#/components/schemas/Card'
        next:
          type: string
