      required:
      - bridgeId
      - state
      - at
      - subjectType
      - subjectId
      properties:
        bridgeId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - queued
          - replaced
          - resumed
          - skipped
          - preparing
          - running
          - stopping
          - stopped
          - waiting-for-person
          - dropped
          - succeeded
          - failed
          - not-started
          - no-result
          - unfinished
          - blocked
          - waiting-on-forge
          - gave-up
        at:
          type: string
          format: date-time
        subjectType:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,39}$
        subjectId:
          type: string
          format: uuid
        cardNumber:
          type: integer
          description: Required for a card subject, and refused for any other.
          nullable: true
          minimum: 1
          maximum: 2147483647
        workRequestId:
          type: string
          format: uuid
          nullable: true
        workKind:
          type: string
          nullable: true
        ruleId:
          type: string
          nullable: true
          pattern: ^[a-z0-9][a-z0-9._:-]{0,99}$
        sessionId:
          type: string
          description: Required on `running`, except for a command run.
          format: uuid
          nullable: true
        startedAt:
          type: string
          description: Required on `running`.
          format: date-time
          nullable: true
        endedAt:
          type: string
          description: Required on an outcome.
          format: date-time
          nullable: true
        exitCode:
          type: integer
          nullable: true
          minimum: -255
          maximum: 255
        hasResult:
          type: boolean
          nullable: true
        failureReason:
          type: string
          nullable: true
          maxLength: 1000
        output:
          type: string
          description: Required on an outcome, and may be empty.
          nullable: true
          maxLength: 4000
        askId:
          type: string
          description: Checked for shape only.
          nullable: true
          maxLength: 100
        replacedBy:
          type: string
          description: Checked for shape only.
          format: uuid
          nullable: true
        maxChain:
          type: integer
          description: Checked for shape only.
          nullable: true
          minimum: 1
        reason:
          type: string
          description: Checked for shape only.
          enum:
          - shutdown
          - rule_dead
          - reload
          - null
          nullable: true
        resultStatus:
          type: string
          enum:
          - finished
          - blocked
          - unfinished
          - waiting
          - null
          nullable: true
        resultReason:
          type: string
          nullable: true
          maxLength: 40
          pattern: ^[a-z][a-z0-9-]*$
        resultFields:
          type: object
          additionalProperties: true
          description: At most 4000 bytes of JSON.
          nullable: true
        continues:
          type: string
          description: The id the bridge gave the run that this run resumes.
          format: uuid
          nullable: true
        resumeSkipped:
          type: string
          nullable: true
          maxLength: 50
        usage:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RunUsage'
        peakContextTokens:
          type: integer
          nullable: true
          minimum: 0
        workerPool:
          type: string
          nullable: true
          pattern: ^[a-z][a-z0-9-]{0,39}$
        experiment:
          type: string
          nullable: true
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        variant:
          type: string
          nullable: true
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        requestedModel:
          type: string
          nullable: true
          maxLength: 100
        switchedFrom:
          type: string
          nullable: true
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        kind:
          type: string
          enum:
          - worker
          - command
          - null
          nullable: true
        harness:
          type: string
          nullable: true
          maxLength: 40
          pattern: ^[a-z][a-z0-9-]{0,39}$
        account:
          type: string
          nullable: true
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        model:
          type: string
          nullable: true
          maxLength: 100
        harnessSessionId:
          type: string
          nullable: true
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
        harnessVersion:
          type: string
          nullable: true
          maxLength: 100
        cliVersion:
          type: string
          nullable: true
          maxLength: 100
        skillVersion:
          type: string
          nullable: true
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$
        harnessEvents:
