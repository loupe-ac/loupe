openapi: 3.0.3
info:
  title: Loupe private API v1 (no public promise)
  version: 1.0.0
  description: |-
    **This file has no public promise.** These routes serve the Loupe CLI bridge and the site-review widget. They may change with the CLI and the widget. Do not build on them.

    v1 is in beta for 3 months after the first release. Until then a breaking change may land with a changelog note. After that a breaking change makes /api/v2, and v1 keeps working for at least 6 months with `Deprecation` and `Sunset` headers.

    The server below is the hosted instance. A self-hosted instance uses its own host with the same paths.

    `/api/v1/bridge` routes need a credential with the `agent` scope. `/api/v1/live-review-widget` routes need a credential with the `site-review` scope, from a widget sign-in, a preview token or a CLI sign-in.

    Success bodies are the bodies of the old routes. Errors are `application/problem+json`, and `code` holds the value of the old flat `error` key. An error keeps the extra keys the old route gave: `errors`, `types`, `missing` and `subscribeUrl`. A route that a feature flag switches off answers 404 `route_not_found`.

    No route in this document is built yet. This document is the proposal.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: https://app.loupe.ac
  description: Hosted instance
security:
- bearerAuth: []
tags:
- name: Bridge
  description: What the CLI bridge reads and reports about itself.
- name: Worker runs
  description: What the CLI bridge reports about its runs.
- name: Artifacts
  description: Storing design artifacts from the CLI.
- name: Tokens
  description: Preview tokens and push tokens.
- name: Widget
  description: What the site-review widget calls.
paths:
  /api/v1/bridge/bridges/{bridgeId}/commands/{commandId}:
    put:
      operationId: acknowledgeBridgeCommand
      summary: Record the answer of a bridge to a command
      tags:
      - Bridge
      parameters:
      - $ref: '#/components/parameters/BridgeId'
      - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandAck'
      responses:
        '200':
          description: The answer is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAckAnswer'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401Unauthorized'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403InsufficientScope'
        '404':
          $ref: '#/components/responses/E404CommandNotFoundRouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422InvalidStateInvalidReasonReasonTooLong'
        '429':
          $ref: '#/components/responses/E429RateLimited'
  /api/v1/bridge/bridges/{bridgeId}/heartbeat:
    put:
      operationId: recordBridgeHeartbeat
      summary: Record that a bridge is alive
      tags:
      - Bridge
      parameters:
      - $ref: '#/components/parameters/BridgeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: The heartbeat is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatAnswer'
        '400':
          $ref: '#/components/responses/E400InvalidJson'
        '401':
          $ref: '#/components/responses/E401Unauthorized'
        '402':
          $ref: '#/components/responses/E402SubscriptionRequired'
        '403':
          $ref: '#/components/responses/E403InsufficientScope'
        '404':
          $ref: '#/components/responses/E404RouteNotFound'
        '405':
          $ref: '#/components/responses/E405MethodNotAllowed'
        '415':
          $ref: '#/components/responses/E415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/E422ValidationFailed'
        '429':
