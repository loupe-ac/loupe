        effort:
          type: string
          nullable: true
        harness:
          type: string
          nullable: true
        account:
          type: string
          nullable: true
        runModel:
          type: string
          nullable: true
        inboxActionId:
          type: string
          format: uuid
          nullable: true
        inboxItemNumber:
          type: integer
          nullable: true
        inboxItemId:
          type: string
          format: uuid
          nullable: true
    ModelUsage:
      type: object
