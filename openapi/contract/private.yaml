          nullable: true
          maxLength: 1000
    CommandAckAnswer:
      type: object
      required:
      - commandId
      - state
      properties:
        commandId:
          type: string
          format: uuid
        state:
          type: string
          description: The stored state.
          enum:
          - pending
          - done
          - refused
          - expired
          - cancelled
    WorkClaim:
      type: object
      required:
      - workRequestId
      - claimToken
      - leaseUntil
      - workRequest
      properties:
        workRequestId:
          type: string
          format: uuid
        claimToken:
          type: string
          description: The bridge sends it back with the result.
          format: uuid
        leaseUntil:
          type: string
          format: date-time
          nullable: true
        workRequest:
          $ref: '#/components/schemas/WorkRequest'
    WorkResult:
      type: object
      required:
      - claimToken
      - state
      properties:
        claimToken:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - done
          - refused
        reason:
          type: string
          description: A code that starts with a letter, at most 64 characters.
          nullable: true
          pattern: ^[a-z][a-z0-9-]{0,63}$
    WorkResultAnswer:
      type: object
      required:
      - workRequestId
      - state
      properties:
        workRequestId:
          type: string
          format: uuid
        state:
          type: string
          description: The stored state.
          enum:
          - open
          - claimed
          - done
          - refused
          - expired
          - cancelled
    RunStateReport:
      type: object
