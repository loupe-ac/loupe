          nullable: true
          maxLength: 1000
        harness:
          type: string
          nullable: true
          maxLength: 40
          pattern: ^[a-z][a-z0-9-]{0,39}$
        account:
          type: string
          nullable: true
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        model:
          type: string
          nullable: true
          maxLength: 100
        harnessSessionId:
          type: string
          nullable: true
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
    SessionClosed:
      type: object
      required:
      - closed
      properties:
        closed:
          type: integer
          description: The runs this call closed.
    ExperimentPin:
      type: object
      description: The controller checks each field itself, so a bad field gets its own code rather than `validation_failed`.
      required:
      - candidate
      - variants
      - baseline
      properties:
        candidate:
          type: string
          description: The variant drawn for the card. It must be one of `variants`.
        variants:
          type: array
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          minItems: 1
          maxItems: 32
          uniqueItems: true
        baseline:
          type: string
          description: The variant the others are compared against. It must be one of `variants`.
        weights:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 1000000
          description: One weight for each variant, in order. A bad list never refuses the pin.
          nullable: true
        metrics:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_:-]{0,127}$
          nullable: true
          maxItems: 16
        headline:
          type: object
          properties:
            goal:
              type: object
              required:
              - metric
              properties:
                metric:
                  type: string
                  pattern: ^[a-z][a-z0-9_:-]{0,127}$
                better:
                  type: string
                  enum:
                  - lower
                  - higher
            guards:
              type: array
              items:
                type: string
                pattern: ^[a-z][a-z0-9_:-]{0,127}$
              maxItems: 16
            controls:
              type: array
              items:
                type: object
                required:
                - metric
                - variant
                - expect
                - share
                properties:
                  metric:
                    type: string
                  variant:
                    type: string
                  expect:
                    type: string
                    pattern: ^(>=|<=|>|<|==) *-?[0-9]+(\.[0-9]+)?$
                  share:
                    type: number
                    exclusiveMinimum: true
                    minimum: 0
                    maximum: 1
              maxItems: 16
          nullable: true
        covers:
          type: array
          items:
            type: string
            pattern: ^(?:[a-z][a-z0-9-]{0,39}:)?[a-z][a-z0-9-]{0,39}$
          description: The work kinds the experiment covers.
          nullable: true
          maxItems: 32
    ExperimentPinAnswer:
      type: object
      required:
      - variant
      - switchedFrom
      properties:
        variant:
          type: string
        switchedFrom:
          type: string
          nullable: true
    InboxAskCheck:
      type: object
      required:
      - askId
      - closed
      - allRead
      properties:
        askId:
          type: string
          format: uuid
        closed:
          type: boolean
        allRead:
          type: boolean
          description: Whether that session already read every item.
    ArtifactStore:
      type: object
      required:
      - paths
      - files[]
      properties:
        name:
          type: string
          description: Required with no `artifactId`.
          maxLength: 255
        artifactId:
          type: string
          description: Stores a new version of this artifact.
          maxLength: 36
        sourceLink:
          type: string
          maxLength: 2000
        paths:
          type: array
          items:
            type: string
          description: The path of each file in `files[]`, in the same order.
        card:
          type: string
          maxLength: 36
        notes:
          type: string
          maxLength: 2000
        files[]:
          type: array
          items:
            type: string
            format: binary
    ArtifactStored:
      type: object
      required:
      - artifactId
      - versionNumber
      - path
      - versionPath
      properties:
        artifactId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        path:
          type: string
        versionPath:
          type: string
    PreviewTokenMint:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          description: Names the preview. A second mint under it replaces the first.
          minLength: 1
          maxLength: 100
        card:
          type: string
          format: uuid
          nullable: true
    IssuedToken:
      type: object
      required:
      - token
      - expiresAt
      properties:
        token:
          type: string
          description: Shown once.
        expiresAt:
          type: string
          format: date-time
    PreviewTokenRevoked:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: integer
          description: The tokens this call revoked. A label with no live token is not an error.
    GitTokenRequest:
      type: object
      required:
      - repository
      properties:
        repository:
          type: string
          description: The `owner/name` of the repository.
          maxLength: 255
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
    Stroke:
      type: object
      required:
      - points
      properties:
        space:
          type: string
          enum:
          - anchor
          - page
          default: page
        points:
          type: array
          items:
            type: array
            items:
              type: number
              minimum: -1000
              maximum: 1000
            minItems: 2
            maxItems: 2
          description: Fractions, not pixels.
          minItems: 2
          maxItems: 500
    NoteAnchor:
      type: object
      required:
      - selector
      - text
      - quote
      - quotePrefix
      - quoteSuffix
      properties:
        selector:
          type: string
        text:
          type: string
        quote:
          type: string
          nullable: true
        quotePrefix:
          type: string
          nullable: true
        quoteSuffix:
          type: string
          nullable: true
    NativeFacts:
      type: object
      required:
      - app
      - device
      - screen
      - element
      properties:
        app:
          type: object
          required:
          - name
          - bundleId
          properties:
            name:
              type: string
              nullable: true
            bundleId:
              type: string
        device:
          type: object
          required:
          - name
          - udid
          - osVersion
          properties:
            name:
              type: string
            udid:
              type: string
            osVersion:
              type: string
        screen:
          type: object
          required:
          - title
          properties:
            title:
              type: string
              nullable: true
        element:
          type: object
          required:
          - role
          - label
          - identifier
          - frame
          properties:
            role:
              type: string
            label:
              type: string
              nullable: true
            identifier:
              type: string
              nullable: true
            frame:
              type: object
              required:
              - x
              - y
              - width
              - height
              properties:
                x:
                  type: number
                y:
                  type: number
                width:
                  type: number
                height:
                  type: number
              nullable: true
          nullable: true
    PendingComments:
      type: object
      required:
      - projectId
      - drawingEnabled
      - parentTypes
      - context
      - comments
      properties:
        projectId:
          type: string
          format: uuid
        drawingEnabled:
          type: boolean
        parentTypes:
          type: array
          items:
            type: object
            required:
            - key
            - label
            properties:
              key:
                type: string
              label:
                type: string
        context:
          type: object
          required:
          - label
          - url
          properties:
            label:
              type: string
            url:
              type: string
              nullable: true
          nullable: true
        comments:
          type: array
          items:
            type: object
            required:
            - id
            - body
            - url
            - surface
            - native
            - anchors
            - strokes
            - link
            properties:
              id:
                type: string
                format: uuid
              body:
                type: string
              url:
                type: string
                nullable: true
              surface:
                type: string
                enum:
                - web
                - ios-simulator
              native:
                type: object
                nullable: true
                allOf:
                - $ref: '#/components/schemas/NativeFacts'
              anchors:
                type: array
                items:
                  $ref: '#/components/schemas/NoteAnchor'
              strokes:
                type: array
                items:
                  $ref: '#/components/schemas/Stroke'
              link:
                type: object
                required:
                - label
                - url
                properties:
                  label:
                    type: string
                  url:
                    type: string
                    nullable: true
                nullable: true
    PickerCards:
      type: object
      required:
      - cards
      properties:
        cards:
          type: array
          items:
            type: object
            required:
            - cardId
            - number
            - title
            - status
            properties:
              cardId:
                type: string
                format: uuid
              number:
                type: integer
              title:
                type: string
              status:
                type: string
          maxItems: 20
    WidgetCardCreate:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          maxLength: 10000
          default: ''
        type:
          type: string
          description: A type key. Null means the default type.
          nullable: true
          maxLength: 20
        parent:
          type: boolean
          description: Asks for a type that can have children.
          default: false
    WidgetCardCreated:
      type: object
      required:
      - cardId
      - number
      - label
      - url
      properties:
        cardId:
          type: string
          format: uuid
        number:
          type: integer
        label:
          type: string
          description: '`#<number> <title>`.'
        url:
          type: string
          format: uri
    VerdictPanel:
      type: object
      required:
      - cardId
      - connection
      - pullRequests
      - notes
      - preview
      - latestVerdict
      properties:
        cardId:
          type: string
          format: uuid
        connection:
          type: object
          required:
          - state
          - login
          properties:
            state:
              type: string
              enum:
              - none
              - connected
              - expired
            login:
              type: string
              nullable: true
        pullRequests:
          type: array
          items:
            type: object
            required:
            - id
            - label
            - ownPullRequest
            properties:
              id:
                type: string
                format: uuid
              label:
                type: string
              ownPullRequest:
                type: boolean
        notes:
          type: array
          items:
            type: object
            required:
            - id
            - url
            - body
            - anchorCount
            properties:
              id:
                type: string
                format: uuid
              url:
                type: string
                nullable: true
              body:
                type: string
              anchorCount:
                type: integer
        preview:
          type: object
          required:
          - approve
          - request-changes
          - comment
          properties:
            approve:
              $ref: '#/components/schemas/VerdictActions'
            request-changes:
              $ref: '#/components/schemas/VerdictActions'
            comment:
              $ref: '#/components/schemas/VerdictActions'
        latestVerdict:
          type: object
          required:
          - id
          - kind
          - message
          - createdAt
          - deliveries
          properties:
            id:
              type: string
              format: uuid
            kind:
              type: string
              enum:
              - approve
              - request-changes
              - comment
            message:
              type: string
            createdAt:
              type: string
              format: date-time
            deliveries:
              type: array
              items:
                type: object
                required:
                - pullRequestId
                - label
                - state
                - reason
                - reviewUrl
                properties:
                  pullRequestId:
                    type: string
                    format: uuid
                  label:
                    type: string
                  state:
                    type: string
                    enum:
                    - pending
                    - posted
                    - commented
                    - skipped
                    - refused
                  reason:
                    type: string
                    nullable: true
                  reviewUrl:
                    type: string
                    nullable: true
          nullable: true
    VerdictActions:
      type: object
      required:
      - actions
      properties:
        actions:
          type: array
          items:
            type: object
            required:
            - code
            - label
            properties:
              code:
                type: string
              label:
                type: string
    CardVerdictSend:
      type: object
