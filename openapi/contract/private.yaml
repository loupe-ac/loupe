          enum:
          - approve
          - request-changes
          - comment
        pullRequestIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        message:
          type: string
          maxLength: 10000
          default: ''
        submissionId:
          type: string
          description: One id for each Send, kept across a retry of the same content.
          format: uuid
          nullable: true
    CardVerdictSent:
      type: object
      required:
      - verdictId
      - kind
      - noteCount
      properties:
        verdictId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - approve
          - request-changes
          - comment
        noteCount:
          type: integer
    FeedbackAdd:
      type: object
      required:
      - body
      - target
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        url:
          type: string
          description: Required on a web note, and refused on a native note.
          nullable: true
          maxLength: 2000
        anchors:
          type: array
          items:
            type: object
            required:
            - selector
            properties:
              selector:
                type: string
                minLength: 1
                maxLength: 2000
              text:
                type: string
                maxLength: 2000
              quote:
                type: string
                nullable: true
                maxLength: 2000
              quotePrefix:
                type: string
                nullable: true
                maxLength: 2000
              quoteSuffix:
                type: string
                nullable: true
                maxLength: 2000
          maxItems: 10
        strokes:
          type: array
          items:
            $ref: '#/components/schemas/Stroke'
          maxItems: 50
        selector:
          type: string
          description: The old single-anchor body, from a cached widget.
          maxLength: 2000
        text:
          type: string
          description: The old single-anchor body, from a cached widget.
          maxLength: 2000
        context:
          type: string
          nullable: true
          maxLength: 255
        deliveryId:
          type: string
          format: uuid
          nullable: true
        surface:
          type: string
          enum:
          - web
          - ios-simulator
          default: web
        native:
          type: object
          description: Required on an `ios-simulator` note, and refused on a web note.
          required:
          - bundleId
          - deviceName
          - udid
          - osVersion
          properties:
            appName:
              type: string
              nullable: true
              maxLength: 255
            bundleId:
              type: string
              maxLength: 255
            deviceName:
              type: string
              maxLength: 255
            udid:
              type: string
              maxLength: 100
            osVersion:
              type: string
              maxLength: 100
            screenTitle:
              type: string
              nullable: true
              maxLength: 2000
            element:
              type: object
              required:
              - role
              - frame
              properties:
                role:
                  type: string
                  maxLength: 200
                label:
                  type: string
                  nullable: true
                  maxLength: 2000
                identifier:
                  type: string
                  nullable: true
                  maxLength: 2000
                frame:
                  type: object
                  required:
                  - x
                  - y
                  - width
                  - height
                  properties:
                    x:
                      type: number
                    y:
                      type: number
                    width:
                      type: number
                    height:
                      type: number
              nullable: true
          nullable: true
        screenshot:
          type: object
          properties:
            contentType:
              type: string
              nullable: true
            data:
              type: string
              description: Base64. At most 2 MiB of image bytes.
              nullable: true
          nullable: true
        target:
          type: object
          description: Name either `cardId` or `newCard`.
          properties:
            cardId:
              type: string
              format: uuid
              nullable: true
            newCard:
              type: object
              properties:
                parentCardId:
                  type: string
                  description: An epic of the project, which the new card goes under.
                  format: uuid
                  nullable: true
              nullable: true
    FeedbackAdded:
      type: object
      required:
      - commentId
      - cardId
      - number
      - label
      - url
      properties:
        commentId:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        number:
          type: integer
        label:
          type: string
        url:
          type: string
          format: uri
    FeedbackDeleted:
      type: object
      required:
      - cardDeleted
      properties:
        cardDeleted:
          type: boolean
          description: Whether the card the note created went too.
    CommentBody:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    CommentUpdated:
      type: object
      required:
      - commentId
      - label
      properties:
        commentId:
          type: string
          format: uuid
        label:
          type: string
          description: The label of the card of the note.
          nullable: true
  examples:
    Unauthorized:
      summary: invalid_credentials
      value:
        type: https://loupe.ac/docs/reference/api/errors#invalid_credentials
        title: Unauthorized
        status: 401
        code: invalid_credentials
        detail: The request carries no valid token.
    SubscriptionRequired:
      summary: subscription_required
      value:
        type: https://loupe.ac/docs/reference/api/errors#subscription_required
        title: Subscription required
        status: 402
        code: subscription_required
        detail: The account needs an active subscription.
        subscribeUrl: https://app.loupe.ac/billing/subscribe
    InsufficientScope:
      summary: credential_not_allowed
      value:
        type: https://loupe.ac/docs/reference/api/errors#credential_not_allowed
        title: Insufficient scope
        status: 403
        code: credential_not_allowed
        detail: The token carries another scope.
    RouteNotFound:
      summary: route_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#route_not_found
        title: Route not found
        status: 404
        code: route_not_found
        detail: No such route, a path id is not a uuid the route takes, or a feature flag switches the route off.
    MethodNotAllowed:
      summary: method_not_allowed
      value:
        type: https://loupe.ac/docs/reference/api/errors#method_not_allowed
        title: Method not allowed
        status: 405
        code: method_not_allowed
        detail: The path does not take this method.
    NoBridgeId:
      summary: no_bridge_id
      value:
        type: https://loupe.ac/docs/reference/api/errors#no_bridge_id
        title: Upgrade required
        status: 426
        code: no_bridge_id
        detail: This Loupe server sends events only to a bridge that runs work requests. Upgrade the loupe CLI.
    UnknownBridge:
      summary: unknown_bridge
      value:
        type: https://loupe.ac/docs/reference/api/errors#unknown_bridge
        title: Upgrade required
        status: 426
        code: unknown_bridge
        detail: This Loupe server has no heartbeat from this bridge. Upgrade the loupe CLI, which sends its heartbeat before
          it reads the events.
    NoWorkRequests:
      summary: no_work_requests
      value:
        type: https://loupe.ac/docs/reference/api/errors#no_work_requests
        title: Upgrade required
        status: 426
        code: no_work_requests
        detail: 'This bridge runs no work requests. Upgrade the loupe CLI and map the work kinds under work: in rules.yaml.'
    RateLimited:
      summary: rate_limited
      value:
        type: https://loupe.ac/docs/reference/api/errors#rate_limited
        title: Rate limited
        status: 429
        code: rate_limited
        detail: Too many requests. Wait for the seconds in Retry-After.
    InvalidQuery:
      summary: invalid_query
      value:
        type: https://loupe.ac/docs/reference/api/errors#invalid_query
        title: Invalid query
        status: 400
        code: invalid_query
    ProjectNotFound:
      summary: project_not_found
      value:
        type: https://loupe.ac/docs/reference/api/errors#project_not_found
        title: Project not found
        status: 404
        code: project_not_found
    CardNotFound:
