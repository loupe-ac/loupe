        subjectId:
          type: string
          format: uuid
        cardNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        workKind:
          type: string
          description: The kind of the work request, or the name of the session.
          maxLength: 100
        workRequestId:
          type: string
          format: uuid
          nullable: true
        ruleId:
          type: string
          nullable: true
          pattern: ^[a-z0-9][a-z0-9._:-]{0,99}$
        state:
          type: string
          enum:
          - running
          - not-started
        at:
          type: string
          format: date-time
        failureReason:
