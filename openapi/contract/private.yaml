components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An OAuth access token. A `/api/v1/bridge` route needs the `agent` scope. A `/api/v1/live-review-widget`
        route needs the `site-review` scope, from a widget sign-in, a preview token or a CLI sign-in.
  parameters:
    Handle:
      name: handle
      in: path
      required: true
      description: A project id or a project slug.
      schema:
        type: string
    BridgeId:
      name: bridgeId
      in: path
      required: true
      description: The uuid the bridge generates on its first start. Any other value answers 404.
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      description: The key the bridge gave the run. A value that is not a uuid answers 422 `invalid_run_id`.
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: The session id. A value that is not a uuid answers 422 `invalid_session_id`.
      schema:
        type: string
    CardId:
      name: cardId
      in: path
      required: true
      description: The card id.
      schema:
        type: string
    CommentId:
      name: id
      in: path
      required: true
      description: The note id. A value that is not a uuid answers 404 `not_found`.
      schema:
        type: string
    XLoupeBridge:
      name: X-Loupe-Bridge
      in: header
      description: The id of the calling bridge. A missing or unknown value answers 426.
      schema:
        type: string
    XLoupeSession:
      name: X-Loupe-Session
      in: header
      description: The session that stores the version. A session of a worker run is refused.
      schema:
        type: string
        maxLength: 255
    XLoupeProject:
      name: X-Loupe-Project
      in: header
      description: The project id this request acts on, for a credential that covers several projects. A credential bound
        to one project may only confirm it.
      schema:
        type: string
        format: uuid
    After:
      name: after
      in: query
      required: true
      description: The sequence to read after.
      schema:
        type: integer
        minimum: 0
    CommandId:
      name: commandId
      in: path
      required: true
      description: The command id.
      schema:
        type: string
        format: uuid
    WorkRequestId:
      name: workRequestId
      in: path
      required: true
      description: The work request id.
      schema:
        type: string
        format: uuid
    Experiment:
      name: experiment
      in: path
      required: true
      description: The experiment name. A bad name answers 422 `invalid_experiment`.
      schema:
        type: string
    AskId:
      name: askId
      in: path
      required: true
      description: The ask id.
      schema:
        type: string
        format: uuid
    Label:
      name: label
      in: path
      required: true
      description: The label.
      schema:
        type: string
    Scope:
      name: scope
      in: query
      description: A destination such as `card:<id>`. An absent scope lists the whole project. A scope nothing resolves lists
        nothing.
      schema:
        type: string
    Surface:
      name: surface
      in: query
      description: It defaults to web.
      schema:
        type: string
        enum:
        - web
        - ios-simulator
        default: web
    Context:
      name: context
      in: query
      description: The marker of the preview card, or the target the widget stored.
      schema:
        type: string
    Q:
      name: q
      in: query
      description: Words to search for.
      schema:
        type: string
    Type:
      name: type
      in: query
      description: A type key. An unknown key means every type.
      schema:
        type: string
    Parent:
      name: parent
      in: query
      description: True lists cards of types that can have children.
      schema:
        type: boolean
  headers:
    Retry-After:
      description: The number of seconds to wait before the next request.
      schema:
        type: integer
  schemas:
    Problem:
      type: object
      description: An error, as RFC 9457 `application/problem+json`.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          description: A URI that names the error.
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: The old flat `error` value where the old route had one, otherwise a code this document names.
        detail:
          type: string
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - field
              - code
              - message
              properties:
                field:
                  type: string
                code:
                  type: string
                message:
                  type: string
    SubscriptionProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - subscribeUrl
        properties:
          subscribeUrl:
            type: string
            format: uri
    ArtifactRefusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: object
            additionalProperties:
              type: string
            description: A translated message for each refused field, keyed by the field.
    UnknownTypeProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - types
        properties:
          types:
            type: array
            items:
              type: string
            description: The types this request could use.
    GitTokenRefusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - missing
        properties:
          missing:
            type: array
            items:
              type: string
            description: The permission names the installation lacks, for `missing_grant`.
    SubjectRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
    WorkContext:
      type: object
      description: What the card held when the request opened. Each key is null when the card held no such value.
      required:
      - pullRequestNumber
      - pullRequestUrl
      - headSha
      - reason
      - documentId
      - epicBranch
      - inboxActionId
      - inboxItemNumber
      - inboxItemId
      properties:
        pullRequestNumber:
          type: integer
          nullable: true
        pullRequestUrl:
          type: string
          nullable: true
        headSha:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        documentId:
          type: string
          format: uuid
          nullable: true
        epicBranch:
          type: string
          nullable: true
        inboxActionId:
          type: string
          format: uuid
          nullable: true
        inboxItemNumber:
          type: integer
          nullable: true
        inboxItemId:
          type: string
          format: uuid
          nullable: true
    WorkRequest:
      type: object
      description: One work request. It never carries the claim token.
      required:
      - type
      - projectId
      - subject
      - workRequestId
      - subjectType
      - subjectId
      - kind
      - capability
      - state
      - cardNumber
      - ruleId
      - createdAt
      - resumeSessionId
      - context
      - model
      - effort
      - prompt
      - inboxActionId
      - inboxItemNumber
      - inboxItemId
      - targetBridgeId
      - branch
      - params
      - run
      properties:
        type:
          type: string
          enum:
          - bridge.work_request
        projectId:
          type: string
          format: uuid
        subject:
          $ref: '#/components/schemas/SubjectRef'
        workRequestId:
          type: string
          format: uuid
        subjectType:
          type: string
        subjectId:
          type: string
          format: uuid
        kind:
          type: string
          description: The kind of work.
        capability:
          type: string
          description: The capability a bridge must report to claim the request.
          nullable: true
        state:
          type: string
          enum:
          - open
          - claimed
          - done
          - refused
          - expired
          - cancelled
        cardNumber:
          type: integer
          description: A label a person reads, for a card subject alone.
          nullable: true
        ruleId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resumeSessionId:
          type: string
          format: uuid
          nullable: true
        context:
          $ref: '#/components/schemas/WorkContext'
        model:
          type: string
          nullable: true
        effort:
          type: string
          description: '`low`, `medium`, `high`, `xhigh` or `max`.'
          nullable: true
        prompt:
          type: string
          nullable: true
        inboxActionId:
          type: string
          format: uuid
          nullable: true
        inboxItemNumber:
          type: integer
          nullable: true
        inboxItemId:
          type: string
          format: uuid
          nullable: true
        targetBridgeId:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
          nullable: true
        params:
          type: object
          additionalProperties: true
          description: Parameter name to value, or null when the request has none.
          nullable: true
        run:
          type: array
          items:
            type: string
          description: The `run` list of the command entry.
          nullable: true
    BridgeCommand:
      type: object
      description: One command to a bridge.
      required:
      - type
      - projectId
      - subject
      - commandId
      - kind
      - bridgeId
      - runId
      - runKey
      - sessionId
      - subjectType
      - subjectId
      - cardNumber
      - workRequestId
      - workKind
      - ruleId
      - startedAt
      - endedAt
      - expiresAt
      - cause
      - context
      - model
      - effort
      - harness
      - account
      - runModel
      - inboxActionId
      - inboxItemNumber
      - inboxItemId
      properties:
        type:
          type: string
          enum:
          - bridge.command
        projectId:
          type: string
          format: uuid
        subject:
          $ref: '#/components/schemas/SubjectRef'
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - resume-run
          - stop-run
          - rerun-command
          - collect-session-usage
        bridgeId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        runKey:
          type: string
          format: uuid
          nullable: true
        sessionId:
          type: string
          format: uuid
          nullable: true
        subjectType:
          type: string
        subjectId:
          type: string
          format: uuid
        cardNumber:
          type: integer
          nullable: true
        workRequestId:
          type: string
          format: uuid
          nullable: true
        workKind:
          type: string
          nullable: true
        ruleId:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
        cause:
