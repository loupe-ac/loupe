      - cacheWriteTokens
      properties:
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cacheReadTokens:
          type: integer
          minimum: 0
        cacheWriteTokens:
          type: integer
          minimum: 0
        costUsd:
          type: number
          description: Null when the bridge estimated a model it knows no price for.
          nullable: true
          minimum: 0
          maximum: 999999.999999
    RunUsage:
      type: object
      required:
      - source
      - models
      properties:
        source:
          type: string
          enum:
          - reported
          - estimated
        models:
          type: object
          description: Keyed by model name, 1 to 100 characters, at most 20 keys. An empty object means the process spent
            nothing.
          properties: {}
          additionalProperties:
            $ref: '#/components/schemas/ModelUsage'
    EventsAnswer:
      type: object
      required:
      - hubUrl
      - jwt
      - topic
      - projects
      - flags
      - cliRange
      - head
      properties:
        hubUrl:
          type: string
          format: uri
        jwt:
          type: string
          description: A subscriber JWT for the topic of the caller.
        topic:
          type: string
        projects:
          type: array
          items:
            type: object
            required:
            - id
            - slug
            - name
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
                nullable: true
              name:
                type: string
        flags:
          type: object
          description: The only flags an agent token reads, such as `inbox.enabled` and `bridge.heartbeat_interval_seconds`.
          properties: {}
          additionalProperties:
            oneOf:
            - type: boolean
            - type: integer
        cliRange:
          type: string
          example: ^2.0
        head:
          type: integer
          description: The highest outbox sequence of the owner.
    EventReplay:
      type: object
      required:
      - events
      - hasMore
      properties:
        events:
          type: array
          items:
            type: object
            required:
            - id
            - type
            - data
            properties:
              id:
                type: integer
                description: The outbox sequence.
              type:
                type: string
              data:
                type: object
                additionalProperties: true
                description: The payload, in the shape the hub delivers.
        hasMore:
          type: boolean
    CardHolds:
      type: object
      required:
      - holds
      properties:
        holds:
          type: array
          items:
            type: object
            required:
            - projectId
            - cardId
            properties:
              projectId:
                type: string
                format: uuid
              cardId:
                type: string
                format: uuid
    Sites:
      type: object
      required:
      - sites
      properties:
        sites:
          type: array
          items:
            type: object
            required:
            - id
            - slug
            - name
            - collectFullText
            - subcommandPrograms
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
                nullable: true
              name:
                type: string
              collectFullText:
                type: boolean
              subcommandPrograms:
                type: array
                items:
                  type: string
    ProjectColumns:
      type: object
      required:
      - project
      - columns
      properties:
        project:
          type: object
          required:
          - id
          - slug
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
              nullable: true
        columns:
          type: array
          items:
            type: object
            required:
            - slug
            - label
            - terminal
            - default
            - backlog
            properties:
              slug:
                type: string
              label:
                type: string
              terminal:
                type: boolean
              default:
                type: boolean
              backlog:
                type: boolean
    ProjectCard:
      type: object
      required:
      - cardId
      - number
      - column
      - held
      properties:
        cardId:
          type: string
          format: uuid
        number:
          type: integer
        column:
          type: string
          description: The slug of the column the card is in.
        held:
          type: boolean
          description: Whether a person paused the agents on it.
    Heartbeat:
      type: object
      description: One heartbeat. A list that is null keeps the rows the server holds, and an empty list clears them. `docs/reference/bridge-heartbeat.md`
        gives the exceptions.
      required:
      - projects
      - cliVersion
      properties:
        projects:
          type: array
          items:
            type: string
            format: uuid
          description: The project ids the bridge follows.
          maxItems: 500
        cliVersion:
          type: string
          description: 1 to 100 characters after trimming.
          maxLength: 100
        update:
          type: object
          required:
          - state
          properties:
            state:
              type: string
              enum:
              - current
              - updating
              - rolled-back
              - blocked
              - 'off'
              - dev
            version:
              type: string
              maxLength: 100
            install:
              type: string
              description: An unknown method is stored as none. `homebrew` is the only value now.
        hooks:
          type: array
          items:
            type: object
            required:
            - package
            - ref
            - event
            - outcome
            properties:
              package:
                type: string
                maxLength: 300
              ref:
                type: string
                maxLength: 100
              event:
                type: string
                enum:
                - start
                - stop
                - busy
                - idle
              lastRunAt:
                type: string
                format: date-time
                nullable: true
              outcome:
                type: string
                enum:
                - ok
                - failed
                - timeout
                - never
              error:
                type: string
                nullable: true
                maxLength: 500
          nullable: true
          maxItems: 100
        workerPools:
          type: array
          items:
            type: object
            required:
            - name
            - size
            - inUse
            - queued
            properties:
              name:
                type: string
                pattern: ^[a-z][a-z0-9-]{0,39}$
              size:
                type: integer
                minimum: 0
                maximum: 1000
              inUse:
                type: integer
                minimum: 0
                maximum: 1000
              queued:
                type: integer
                minimum: 0
                maximum: 1000
          nullable: true
          maxItems: 50
        paused:
          type: boolean
          description: True when the bridge takes no new work now.
          nullable: true
        capabilities:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]{0,39}$
          nullable: true
          maxItems: 20
        workClaims:
          type: array
          items:
            type: object
            required:
            - id
            - claimToken
            properties:
              id:
                type: string
                format: uuid
              claimToken:
                type: string
                format: uuid
          nullable: true
          maxItems: 200
        name:
          type: string
          description: At most 40 characters with no control character. Blank clears the name.
          nullable: true
          maxLength: 40
        hostSamples:
          type: array
          items:
            type: object
            required:
            - sampledAt
            - cpuPct
            - memUsed
            - memTotal
            - swapUsed
            properties:
              sampledAt:
                type: string
                format: date-time
              cpuPct:
                type: array
                items:
                  type: number
                  minimum: 0
                  maximum: 100
                maxItems: 1024
              memUsed:
                type: integer
                minimum: 0
              memTotal:
                type: integer
                minimum: 0
              swapUsed:
                type: integer
                minimum: 0
              batteryPct:
                type: number
                nullable: true
                minimum: 0
                maximum: 100
              onAc:
                type: boolean
                nullable: true
          nullable: true
          maxItems: 720
        pushLogin:
          type: string
          description: Sent by an old bridge, and ignored.
          nullable: true
        accounts:
          type: array
          items:
            type: object
            required:
            - name
            - harness
            - state
            properties:
              name:
                type: string
                pattern: ^[a-z][a-z0-9-]{0,39}$
              harness:
                type: string
                pattern: ^[a-z][a-z0-9-]{0,39}$
              state:
                type: string
                enum:
                - ready
                - failing
              reason:
                type: string
                nullable: true
                maxLength: 200
              used:
                type: boolean
                nullable: true
          nullable: true
          maxItems: 50
        commandEntries:
          type: array
          items:
            type: object
            required:
            - name
            - params
            - run
            - timeout
            properties:
              name:
                type: string
                maxLength: 100
              description:
                type: string
                nullable: true
                maxLength: 500
              params:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - pattern
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    pattern:
                      type: string
                      maxLength: 500
                    description:
                      type: string
                      nullable: true
                      maxLength: 500
                maxItems: 20
              run:
                type: array
                items:
                  type: string
                  maxLength: 1000
                minItems: 1
                maxItems: 50
              timeout:
                type: string
                maxLength: 20
          nullable: true
          maxItems: 50
        worktrees:
          type: array
          items:
            type: object
            required:
            - projectId
            - branch
            - path
            properties:
              projectId:
                type: string
                format: uuid
              branch:
                type: string
                maxLength: 255
              path:
                type: string
                maxLength: 4096
          nullable: true
          maxItems: 200
        repositories:
          type: array
          items:
            type: object
            required:
            - projectId
            - path
            properties:
              projectId:
                type: string
                format: uuid
              path:
                type: string
                maxLength: 4096
              remoteUrl:
                type: string
                nullable: true
                maxLength: 2048
          nullable: true
          maxItems: 500
        workKinds:
          type: array
          items:
            type: string
            pattern: ^(?:[a-z][a-z0-9-]{0,39}:)?[a-z][a-z0-9-]{0,39}$
          nullable: true
          maxItems: 50
        gitIdentities:
          type: array
          items:
            type: object
            required:
            - projectId
            - mode
            properties:
              projectId:
                type: string
                format: uuid
              mode:
                type: string
                enum:
                - agent_account
                - app_token
                - machine
              commitName:
                type: string
                nullable: true
                maxLength: 255
              pushLogin:
                type: string
                nullable: true
                maxLength: 39
              githubUserId:
                type: integer
                nullable: true
                minimum: 1
          nullable: true
          maxItems: 500
        gitIdentitiesAge:
          type: integer
          description: The seconds since the bridge read `gitIdentities`.
          nullable: true
          minimum: 0
          maximum: 86400
        interactiveSessions:
          type: array
          items:
            type: object
            required:
            - sessionId
            properties:
              sessionId:
                type: string
                format: uuid
              alive:
                type: boolean
                nullable: true
              transcriptAt:
                type: string
                format: date-time
                nullable: true
          nullable: true
          maxItems: 100
    HeartbeatAnswer:
      type: object
      required:
      - cliRange
      - paused
      - commands
      - workRequests
      - lostClaims
      - watchSessions
      properties:
        cliRange:
          type: string
          example: ^2.0
        paused:
          type: boolean
          description: True when the server asks the bridge to take no new work.
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BridgeCommand'
          description: The pending commands, oldest first.
        workRequests:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequest'
          description: The open work requests the bridge can claim, oldest first, at most 100.
        lostClaims:
          type: array
          items:
            type: string
            format: uuid
          description: The ids from `workClaims` that the bridge no longer holds.
        watchSessions:
          type: array
          items:
            type: string
            format: uuid
          description: The open interactive runs that this bridge launched.
    BridgeRuns:
      type: object
      required:
      - runs
      properties:
        runs:
          type: array
          items:
            type: object
            required:
            - runId
            - projectId
            - state
            properties:
              runId:
                type: string
                format: uuid
              projectId:
                type: string
                format: uuid
              state:
                type: string
                enum:
                - queued
                - resumed
                - preparing
                - running
                - stopping
          maxItems: 1000
    CommandAck:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - done
          - refused
        reason:
          type: string
